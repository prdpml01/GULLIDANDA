name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor
      run: |
        npx cap init "Gulli Danda" "com.pradeep.gullidanda" --web-dir=www
        mkdir -p www
        echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://prdpml01.github.io/GULLIDANDA/"></head></html>' > www/index.html

    - name: Configure Capacitor
      run: |
        node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          config.server = { url: 'https://prdpml01.github.io/GULLIDANDA/', cleartext: false, androidScheme: 'https' };
          config.android = { allowMixedContent: true };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
        "

    - name: Add Android Platform and Sync
      run: |
        npx cap add android
        npx cap sync

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gulli-Danda-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
