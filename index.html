  rr(ctx, pbX, pbY, pbW, 4, 2); ctx.fill();
  ctx.fillStyle = '#8affa0';
  rr(ctx, pbX, pbY, pbW * (NET.joinPopupTimer / 4), 4, 2); ctx.fill();

  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function drawBotBattingOverlay(){
  if (G.phase !== 'botBatting') return;
  ctx.fillStyle = 'rgba(12,16,28,0.88)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;
  const cx = W/2, cy = 200;
  const bob = Math.sin(t * 3) * 6;

  ctx.save();
  ctx.translate(cx, cy + bob);

  const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 100);
  glow.addColorStop(0, 'rgba(92,158,224,0.5)');
  glow.addColorStop(1, 'rgba(92,158,224,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI*2); ctx.fill();

  ctx.font = '900 84px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🤖', 0, 0);
  ctx.restore();

  centerText('🤖 AUTO-PILOT IS BATTING...', 320, 30, '#5c9ee0');
  centerText('Your score: ' + G.score + ' pts', 360, 22, '#ffd166');

  const dots = '.'.repeat(1 + (Math.floor(performance.now()/400) % 3));
  centerText('Simulating opponent innings' + dots, 400, 16, 'rgba(255,255,255,0.75)');

  const pbW = 380, pbH = 6, pbX = W/2 - pbW/2, pbY = 440;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  rr(ctx, pbX, pbY, pbW, pbH, 3); ctx.fill();
  const progress = 1 - clamp(G.botBattingTimer / 5.0, 0, 1);
  const pbGrd = ctx.createLinearGradient(pbX, 0, pbX + pbW, 0);
  pbGrd.addColorStop(0, '#5c9ee0'); pbGrd.addColorStop(1, '#ffd166');
  ctx.fillStyle = pbGrd;
  rr(ctx, pbX, pbY, pbW * progress, pbH, 3); ctx.fill();

  centerText('Get ready for results...', 480, 14, 'rgba(255,209,102,0.8)');
}

/* ==================== MAIN RENDER ==================== */
function draw(){
  ctx.clearRect(0,0,W,H);
  if (G.phase === 'splash'){ drawSplash(); return; }
  if (G.phase === 'login'){ drawLoginScreen(); return; }
  if (G.phase === 'register'){ drawRegisterScreen(); return; }
  if (G.phase === 'guest'){ drawGuestScreen(); return; }
  if (G.phase === 'leaderboard'){ drawLeaderboard(); return; }
  if (G.phase === 'profileView'){ drawProfileView(); return; }
  if (G.phase === 'market'){ drawMarket(); return; }
  ctx.save();
  if (shake > 0.002){ const m = shake * shake * 9; ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m); }
  if (G.phase === 'waitingOpp'){
    drawWaitingOpp();
  } else {
    drawSky();
    if (G.players.length > 0){ drawStadium(); }
    else { ctx.fillStyle = '#2a3142'; ctx.fillRect(0, STADIUM_TOP, W, STADIUM_BOTTOM - STADIUM_TOP); }
    drawField();
    if (G.phase === 'menu' || G.phase === 'levelSelect' || G.phase === 'playerSelect'){
      if (G.phase === 'menu') drawMenuScreen();
      else if (G.phase === 'levelSelect') drawLevelSelect();
      else drawPlayerSelect();
    }
    else if (G.phase === 'searching'){ drawSearching(); }
    else if (G.phase === 'toss'){ drawToss(); }
    else if (G.phase === 'tossResult'){ drawTossResult(); }
    else if (G.phase === 'botBatting'){ drawBotBattingOverlay(); }
    else if (G.phase === 'nameEntry'){ if (fielders.length === 0) buildFielders(); for (const f of fielders) drawFielder(f); drawPlayer(); drawNameEntry(); }
    else if (G.phase === 'turnIntro'){ drawDistanceMarkers(); for (const f of fielders) drawFielder(f); drawPlayer(); drawEffects(); drawTurnIntro(); }
    else if (G.phase === 'turnEnd'){ drawDistanceMarkers(); for (const f of fielders) drawFielder(f); drawPlayer(); drawEffects(); drawTurnEnd(); }
    else if (G.phase === 'gameOver'){ drawDistanceMarkers(); for (const f of fielders) drawFielder(f); drawPlayer(); drawEffects(); drawGameOver(); }
    else {
      drawDistanceMarkers();
      if (G.phase==='fielding'||G.phase==='throw'||G.phase==='result') drawDandaOnGround();
      drawZone();
      for (const f of fielders) drawFielder(f);
      drawGulli(); drawPlayer(); drawEffects();
      drawPowerMeter(); drawShotSelector(false); drawCurrentPlayerBadge(); drawOverlays();
    }
  }
  drawStickers(frameDt);
  ctx.restore();
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*1.0);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.32)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);
  drawJoinPopup();
}

/* ==================== HUD & STICKER VISIBILITY ==================== */
const uiScore = document.getElementById('uiScore');
const uiBest = document.getElementById('uiBest');
const uiOuts = document.getElementById('uiOuts');
const uiTurn = document.getElementById('uiTurn');
const uiCoins = document.getElementById('uiCoins');
const uiLives = document.getElementById('uiLives');
const chatStickerBar = document.getElementById('chatStickerBar');

function updateHUD(){
  const hud = document.getElementById('hud');
  const isMenuPhase = (G.phase === 'menu' || G.phase === 'levelSelect' || G.phase === 'playerSelect'
      || G.phase === 'nameEntry' || G.phase === 'splash' || G.phase === 'login'
      || G.phase === 'register' || G.phase === 'guest' || G.phase === 'searching'
      || G.phase === 'toss' || G.phase === 'tossResult' || G.phase === 'leaderboard'
      || G.phase === 'profileView' || G.phase === 'market' || G.phase === 'botBatting'
      || G.phase === 'waitingOpp');

  if (isMenuPhase){
    hud.style.display = 'none';
  } else {
    hud.style.display = 'flex';
    uiScore.textContent = G.score;
    uiBest.textContent = G.best;
    uiOuts.textContent = G.outs + '/1';
    uiTurn.textContent = (G.currentPlayer + 1) + '/' + G.players.length;
    if (uiCoins) uiCoins.textContent = ACCOUNT.coins;
    if (uiLives) uiLives.textContent = ACCOUNT.lives;
  }

  // Floating Emoji Bar will only appear during Online matches
  if (chatStickerBar){
    const showChat = (G.mode === 'online' && (G.phase === 'power' || G.phase === 'air' || G.phase === 'fly' || G.phase === 'fielding' || G.phase === 'throw' || G.phase === 'result' || G.phase === 'waitingOpp'));
    chatStickerBar.style.display = showChat ? 'flex' : 'none';
  }
}

/* ==================== ENGINE LOOP ==================== */
let last = performance.now();
function loop(now){
  let dt = (now-last)/1000;
  last = now;
  if (dt>0.05) dt=0.05;
  frameDt = dt;
  update(dt); draw(); updateHUD();
  requestAnimationFrame(loop);
}

resetGulli();
rebuildMenuButtons();
initFirebase();
setTimeout(()=>{ try{ playSplashChime(); } catch(e){} }, 120);
requestAnimationFrame(loop);

})();
</script>
