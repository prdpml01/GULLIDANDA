/* ================================================================

var LEVEL_NAMES = ['ROOKIE','AMATEUR','PRO','EXPERT','LEGEND','MASTER','GRANDMASTER','CHAMPION','ELITE','SUPREME','TITAN','IMMORTAL','GODLIKE','UNSTOPPABLE','PHENOMENAL'];

};
function getLevelTarget(n){
  n = Number(n);
  if (isNaN(n)) n = 1;
  n = Math.max(1, Math.floor(n));
  return 500 * n;
}

function getLevel(n){
  n = Number(n);
  if (isNaN(n)) n = 1;
  n = Math.max(1, Math.floor(n));
  var target = getLevelTarget(n);
  var speed1 = Math.min(600 + (n-1) * 100, 2400);
  var speed2 = Math.min(560 + (n-1) * 95, 2300);
  var error  = Math.max(52 - (n-1) * 2.5, 6);
  var name;
  if (n <= LEVEL_NAMES.length) name = LEVEL_NAMES[n-1];
  else name = 'LEGEND ' + n;
  return { level: n, target: target, speed:[speed1, speed2], error: error, name: name };
}

function calcCoins(score, target){
  var base = Math.floor(score / COIN_DIVISOR);
  var isBonus = score >= 2 * target;
  return { base: base, bonus: isBonus, total: isBonus ? base * 2 : base };
}

  try {
    var data = {
      savedAt: Date.now(), isGuest: !!ACCOUNT.isGuest,
      username: ACCOUNT.username || '', name: ACCOUNT.name || '',

      coins: ACCOUNT.coins || 0, lives: ACCOUNT.lives || 0,
      ownedSkins: ACCOUNT.ownedSkins || ['red'], ownedDandas: ACCOUNT.ownedDandas || ['brown'],

      activeSkin: ACCOUNT.activeSkin || 'red', activeDanda: ACCOUNT.activeDanda || 'brown',
      activeBoost: ACCOUNT.activeBoost || 'normal'
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(data));
  } catch(e){}
}
function loadSession(){
  try { var raw = localStorage.getItem(SESSION_KEY); if (!raw) return null; return JSON.parse(raw); } catch(e){ return null; }
}
function clearSession(){ try { localStorage.removeItem(SESSION_KEY); } catch(e){} }
function applySessionToAccount(s){
  if (!s) return;
  ACCOUNT.isGuest = !!s.isGuest;
  ACCOUNT.username = s.username || '';
  ACCOUNT.name = s.name || (ACCOUNT.isGuest ? 'GUEST' : 'PLAYER');
  ACCOUNT.passwordHash = s.passwordHash || '';
  ACCOUNT.bestSingle = s.bestSingle || 0;
  ACCOUNT.bestOnline = s.bestOnline || 0;
  ACCOUNT.matchesPlayed = s.matchesPlayed || 0;
  ACCOUNT.onlineMatches = s.onlineMatches || 0;
  ACCOUNT.wins = s.wins || 0;
  ACCOUNT.losses = s.losses || 0;
  ACCOUNT.totalRuns = s.totalRuns || 0;
  ACCOUNT.highestUnlockedLevel = Math.max(1, s.highestUnlockedLevel || 1);
  ACCOUNT.coins = Math.max(0, s.coins || 0);
  ACCOUNT.lives = Math.max(0, s.lives || 0);
  ACCOUNT.ownedSkins  = s.ownedSkins  || ['red'];
  ACCOUNT.ownedDandas = s.ownedDandas || ['brown'];

  ACCOUNT.activeSkin  = s.activeSkin  || 'red';
  ACCOUNT.activeDanda = s.activeDanda || 'brown';
  ACCOUNT.activeBoost = s.activeBoost || 'normal';
  ACCOUNT.loggedIn = true;
}
function normalizeUsername(u){ return String(u || '').toUpperCase().replace(/[^A-Z0-9_]/g, '').slice(0, 15); }
function usernameKey(u){ return 'u_' + String(u || '').toLowerCase(); }
function isValidUsername(u){ return u && u.length >= 3 && u.length <= 15; }
function isValidPassword(p){ return p && p.length >= 4 && p.length <= 20; }
function hashPassword(pw){
  var h = 5381; var str = 'gd:' + pw;
  for (var i = 0; i < str.length; i++){ h = ((h << 5) + h) + str.charCodeAt(i); h = h & 0xffffffff; }
  return 'h' + (h >>> 0).toString(36);
}
function trackEvent(name, params){ try { if (window.firebaseAnalytics){ window.firebaseAnalytics.logEvent(name, params || {}); } } catch(e){} }

/* ================================================================

function checkDailyBonus(){
  try {
    var today = new Date().toDateString();
    var lastLogin = localStorage.getItem('gulli_last_login') || '';
    var streak = parseInt(localStorage.getItem('gulli_streak') || '0', 10);
    if (lastLogin === today) return;
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (lastLogin === yesterday.toDateString()){ streak++; }
    else { streak = 1; }
    var bonus = 100 + (streak - 1) * 50;
    if (bonus > 500) bonus = 500;
    ACCOUNT.coins += bonus;
    saveSession();
    try { syncAccountStats(); } catch(e){}
    localStorage.setItem('gulli_last_login', today);
    localStorage.setItem('gulli_streak', String(streak));
    G.banner = '🎁 DAILY BONUS +' + bonus + ' 🪙  (Day ' + streak + ')';

function checkWeeklyBonus(){
  if (!NET.ready || !ACCOUNT.loggedIn || ACCOUNT.isGuest || !ACCOUNT.username) return;
  try {
    var now = new Date();
    var startOfYear = new Date(now.getFullYear(), 0, 1);
    var days = Math.floor((now - startOfYear) / (24 * 60 * 60 * 1000));
    var weekNum = Math.ceil((days + startOfYear.getDay() + 1) / 7);
    var weekKey = now.getFullYear() + '-W' + weekNum;
    var lastWeekClaimed = localStorage.getItem('gulli_weekly_claimed') || '';
    if (lastWeekClaimed === weekKey) return;
    NET.db.ref('weekly_leaders/' + weekKey).once('value').then(function(snap){
      if (!snap.exists()){
        NET.db.ref('accounts').orderByChild('bestOnline').limitToLast(3).once('value').then(function(s){
          var top3 = {}; var i = 0;
          s.forEach(function(child){
            var v = child.val();
            if (v && v.username && !v.isGuest){ top3[child.key] = { username: v.username, bestOnline: v.bestOnline || 0, rank: 3 - i }; i++; }
          });
          NET.db.ref('weekly_leaders/' + weekKey).set(top3).catch(function(){});
        }).catch(function(){});
        return;
      }
      var myKey = usernameKey(ACCOUNT.username);
      var leaders = snap.val();
      var myRank = leaders[myKey] ? leaders[myKey].rank : 0;
      var bonus = 0;
      if (myRank === 3) bonus = 500;
      else if (myRank === 2) bonus = 1000;
      else if (myRank === 1) bonus = 2000;
      if (bonus > 0){
        ACCOUNT.coins += bonus; saveSession(); syncAccountStats();
        G.banner = '🏆 WEEKLY RANK #' + (4 - myRank) + '! +' + bonus + ' 🪙';
        G.bannerTimer = 5;
        try { playCoinSound(); } catch(e){}
      }
      localStorage.setItem('gulli_weekly_claimed', weekKey);
    }).catch(function(){});
  } catch(e){}
}

function startOnlineMatchmaking(){
  var roomFromUrl = null;
  try { var params = new URLSearchParams(window.location.search); roomFromUrl = params.get('room'); } catch(e){}
  if (roomFromUrl){
    if (!ACCOUNT.loggedIn || ACCOUNT.isGuest){
      ACCOUNT.afterLoginAction = 'online';
      ACCOUNT.pendingRoom = roomFromUrl;
      ACCOUNT.error = ''; ACCOUNT.formUsername = ''; ACCOUNT.formPassword = '';

      return;
    }
    if (!isOnline){ G.banner = '📴 NO INTERNET'; G.bannerTimer = 2.5; return; }
    NET.myName = ACCOUNT.name;
    setPhase('searching'); NET.searching = true;
    NET.searchStart = performance.now();
    NET.statusMsg = "Joining friend's room...";
    if (!NET.ready && !initFirebase()){ G.banner = 'NETWORK ERROR'; G.bannerTimer = 2.5; setPhase('menu'); return; }
    NET.db.ref('rooms/' + roomFromUrl).once('value').then(function(snap){
      var room = snap.val();
      if (!room || room.status !== 'waiting' || room.p2){
        G.banner = '❌ Room not available'; G.bannerTimer = 2.5;
        NET.searching = false; setPhase('menu'); return;
      }
      NET.db.ref('rooms/' + roomFromUrl).transaction(function(cur){
        if (!cur || cur.status !== 'waiting' || cur.p2) return;
        cur.status = 'playing';
        cur.p2 = { name: NET.myName, score: 0, done: false };
        cur.joinedAt = Date.now();
        return cur;
      }).then(function(res){
        var v = res.snapshot && res.snapshot.val();
        if (res.committed && v && v.p2 && v.p2.name === NET.myName){ onJoined(roomFromUrl, v); }
        else { G.banner = '❌ Room full or closed'; G.bannerTimer = 2.5; NET.searching = false; setPhase('menu'); }
      }).catch(function(){ NET.searching = false; setPhase('menu'); });
    }).catch(function(){ NET.searching = false; setPhase('menu'); });
    return;
  }
  if (!isOnline){ G.banner = '📴 NO INTERNET'; G.bannerTimer = 2.5; beep(200, 0.2, 'sawtooth', 0.10); return; }
  if (!ACCOUNT.loggedIn || ACCOUNT.isGuest){

    ACCOUNT.error = ''; ACCOUNT.formUsername = ''; ACCOUNT.formPassword = '';
    setPhase('login'); G.banner = '🔓 LOGIN TO PLAY ONLINE'; G.bannerTimer = 2;

  NET.oppLive = null; NET.tossWinner = null; NET.currentBatsman = null;
  NET.tossDecided = false; NET.turnHandedOver = false;
  NET.autopilot = false; NET.autopilotStart = 0; NET.autopilotBot = null;

  if (!NET.ready && !initFirebase()){ G.banner = 'NETWORK ERROR'; G.bannerTimer = 2.5; setPhase('menu'); return; }
  setPhase('searching'); NET.searching = true;
  NET.searchStart = performance.now(); NET.statusMsg = 'Searching for players...';
  tryFindRoom();
}
function roomIsFresh(room){ return !room.createdAt || (Date.now() - room.createdAt) < 30*60*1000; }
function listRooms(status){
  return NET.db.ref('rooms').orderByChild('status').equalTo(status).limitToFirst(10).once('value').then(function(snap){
    var arr = [];
    snap.forEach(function(ch){
      var r = ch.val();
      if (r && r.p1 && r.p1.name !== NET.myName && roomIsFresh(r)) arr.push({ id: ch.key, room: r, status: status });
    });
    return arr;
  }).catch(function(){ return []; });
}
function findCandidates(){

function claimRoom(id, wantStatus){

    if (cur === null) return cur;

    if (wantStatus === 'waiting' && cur.p2) return;
    if (wantStatus === 'autopilot' && !(cur.p2 && cur.p2.isBot)) return;
    cur.status = 'playing';
    cur.p2 = { name: NET.myName, score: 0, done: false };
    cur.joinedAt = Date.now();
    return cur;
  }).then(function(res){
    var v = res.snapshot && res.snapshot.val();

  });
}
function detachRoomListeners(){

      else setTimeout(function(){ if (NET.searching) tryFindRoom(); }, 1500);
    });
  }).catch(function(){

}
function attemptJoin(cands, i){

  var c = cands[i];
  return claimRoom(c.id, c.status).then(function(ok){
    if (ok){
      if (!NET.searching){ try{ NET.db.ref('rooms/' + c.id + '/p2/left').set(true); }catch(e){} return false; }

function onJoined(id, room){

function hopTo(elig, myId){

    cur.status = 'closing'; return cur;
  }).then(function(res){
    var v = res.snapshot && res.snapshot.val();

function watchRoom(){

    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  } catch(e){}
}
function sweep(f1,f2,dur,type,vol){
  type = type || 'square'; vol = vol || 0.10;
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f1, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  } catch(e){}
}
function playCheer(intensity){
  intensity = intensity || 1;
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var dur = 0.5 + intensity * 0.6;
    var bufSize = Math.floor(actx.sampleRate * dur);
    var buffer = actx.createBuffer(1, bufSize, actx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufSize; i++){
      var phase = i / bufSize;
      var env = Math.sin(phase * Math.PI) * (1 - phase * 0.4);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    var src = actx.createBufferSource(); src.buffer = buffer;
    var filter = actx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800 + intensity * 800; filter.Q.value = 0.6;
    var gain = actx.createGain(); gain.gain.value = 0.055 * intensity;
    src.connect(filter).connect(gain).connect(actx.destination);
    src.start(); src.stop(actx.currentTime + dur);
  } catch(e){}
}

function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
var lerp  = function(a,b,t){ return a+(b-a)*t; };
var clamp = function(v,a,b){ return Math.max(a,Math.min(b,v)); };
function shade(hex, amt){
  var n = parseInt(hex.slice(1),16);
  var r = (n>>16)+amt, g = ((n>>8)&0xff)+amt, b = (n&0xff)+amt;
  return '#' + ((clamp(r,0,255)<<16)|(clamp(g,0,255)<<8)|clamp(b,0,255)).toString(16).padStart(6,'0');
}
function hexA(hex, a){
  var n = parseInt(hex.slice(1),16);
  return 'rgba(' + (n>>16) + ',' + ((n>>8)&0xff) + ',' + (n&0xff) + ',' + a + ')';
}

function drawCrowdPerson(c, p, armRaise){
  var s = p.s;
  var headR = 4.6 * s, bodyH = 12.5 * s;
  var hipY = p.y - 2.5*s;
  var shoulderY = hipY - bodyH;
  var headY = shoulderY - headR*0.62;
  var raise = armRaise || 0;
  c.fillStyle = p.shirt;
  rr(c, p.x - 5.5*s, shoulderY, 11*s, bodyH + 3*s, 3.4*s); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.16)';
  rr(c, p.x + 1.5*s, shoulderY + 1*s, 4*s, bodyH + 1.5*s, 2.6*s); c.fill();
  c.strokeStyle = p.shirt; c.lineWidth = 2.5*s; c.lineCap = 'round';
  var handY = shoulderY + (raise > 0 ? -7*s*raise : 8*s);
  c.beginPath();
  c.moveTo(p.x - 4.6*s, shoulderY + 1.5*s); c.lineTo(p.x - 7.6*s, handY);
  c.moveTo(p.x + 4.6*s, shoulderY + 1.5*s); c.lineTo(p.x + 7.6*s, handY);
  c.stroke();
  c.fillStyle = p.skin;
  c.beginPath(); c.arc(p.x - 7.6*s, handY, 1.7*s, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(p.x + 7.6*s, handY, 1.7*s, 0, Math.PI*2); c.fill();
  c.fillStyle = p.skin;
  c.beginPath(); c.ellipse(p.x, headY, headR*0.9, headR, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = p.hair;
  c.beginPath(); c.ellipse(p.x, headY - headR*0.28, headR*0.98, headR*0.78, 0, Math.PI, Math.PI*2); c.fill();
  if (s > 0.95){
    c.fillStyle = 'rgba(20,15,10,0.75)';
    c.beginPath(); c.arc(p.x - headR*0.36, headY + headR*0.08, headR*0.13, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(p.x + headR*0.36, headY + headR*0.08, headR*0.13, 0, Math.PI*2); c.fill();
  }
  if (p.hat){
    c.fillStyle = shade(p.shirt, -45);
    c.beginPath(); c.ellipse(p.x, headY - headR*0.62, headR*1.18, headR*0.62, 0, Math.PI, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(p.x + headR*0.55, headY - headR*0.62, headR*0.9, headR*0.30, 0, 0, Math.PI*2); c.fill();
  }
}
function initCrowd(){
  var numPlayers = Math.max(G.players.length || 1, 1);
  var sectionWidth = W / numPlayers;
  crowdSections = [];
  for (var s = 0; s < numPlayers; s++){
    var p = G.players[s];
    crowdSections.push({ color: p ? p.color : '#7a8aa0', name: p ? p.name : 'FANS', x: s * sectionWidth, w: sectionWidth });
  }
  crowdCanvas = document.createElement('canvas');
  crowdCanvas.width = W; crowdCanvas.height = H;
  var c = crowdCanvas.getContext('2d');
  crowdRows = []; crowdDots = []; frontRowPeople = []; flashes = []; crowdFlags = [];
  var ROWS = 8;
  var startY = STADIUM_TOP + 6, endY = STADIUM_BOTTOM - 12;
  var rowH = (endY - startY) / ROWS;
  for (var row = 0; row < ROWS; row++){
    var depth = row / (ROWS - 1);
    var isFront = (row === ROWS - 1);
    var baseY = startY + row * rowH + rowH * 0.78;
    var scale = 0.50 + depth * 0.82;
    var gap = 21 - depth * 9;
    var dim = Math.floor(depth * 30) - 26;
    crowdRows.push({ y0: startY + row * rowH, h: rowH });
    for (var x = 3 + Math.random() * gap * 0.6; x < W - 3; x += gap * (0.70 + Math.random() * 0.55)){
      var secIdx = 0;
      for (var si = 0; si < crowdSections.length; si++){
        var cs = crowdSections[si];
        if (x >= cs.x && x < cs.x + cs.w){ secIdx = si; break; }
      }
      var sec = crowdSections[secIdx];
      var teamColors = Math.random() < 0.55;
      var rawShirt = teamColors ? shade(sec.color, Math.floor((Math.random() - 0.5) * 50)) : SHIRT_TONES[(Math.random() * SHIRT_TONES.length) | 0];
      var person = {
        x: x + (Math.random() - 0.5) * 3, y: baseY + (Math.random() - 0.5) * 3,
        s: scale * (0.88 + Math.random() * 0.26),
        skin: SKIN_TONES[(Math.random() * SKIN_TONES.length) | 0],
        hair: HAIR_TONES[(Math.random() * HAIR_TONES.length) | 0],
        shirt: shade(rawShirt, dim), hat: Math.random() < 0.11,
        phase: Math.random() * Math.PI * 2
      };
      if (isFront) frontRowPeople.push(person);
      else drawCrowdPerson(c, person, 0);
      crowdDots.push({ x: person.x, y: person.y - 20 * person.s, color: person.shirt });
    }
  }
  for (var si2 = 0; si2 < crowdSections.length; si2++){
    var sec2 = crowdSections[si2];
    var n = Math.max(1, Math.round(sec2.w / 210));
    for (var i = 0; i < n; i++){
      crowdFlags.push({ x: sec2.x + sec2.w * (i + 0.5) / n, color: sec2.color, phase: Math.random() * Math.PI * 2, w: 46 + Math.random() * 26 });
    }
  }
  buildStaticBG();
}

function evalQuality(v){
  if (v>=SWEET_LO && v<=SWEET_HI){ var mid=(SWEET_LO+SWEET_HI)/2; return 0.88 + 0.12*(1-Math.abs(v-mid)/((SWEET_HI-SWEET_LO)/2)); }
  if (v<SWEET_LO) return Math.max(0, 0.88*(v/SWEET_LO));
  return Math.max(0, 0.88*((100-v)/(100-SWEET_HI)));
}

function swing(){
  if (gulli.vy <= 0) return;
  var dist = Math.abs(gulli.y - ZONE_Y);
  var acc = clamp(1 - dist/ZONE_R, 0, 1);
  G.accuracy = acc; G.swingTimer = G.swingDur; G.zonePop = 0;
  var shot = SHOTS[G.shotType];
  var power = 0.70 + acc * 0.55;
  var boost = getActiveBoost();
  var boostMul = 1 + boost.bonus;
  gulli.vy = shot.vyBase * power * boostMul;
  gulli.vx = shot.vxBase * power * boostMul;
  gulli.rotV = 20;
  G.phase = 'fly';
  shake = 0.35 + acc * 0.75;
  spawnBurst(gulli.x, gulli.y, acc);
  G.ring = { x:gulli.x, y:gulli.y, t:0, acc:acc };
  var cheerLevel = acc * (G.shotType === 'LOFT' ? 1.4 : G.shotType === 'DRIVE' ? 1.1 : 0.7);
  crowdExcitement = Math.max(crowdExcitement, 0.6 + cheerLevel * 1.0);
  playCheer(0.5 + acc * 0.9);
  if (acc > 0.92) { sweep(900,1800,0.18,'triangle',0.13); G.banner='PERFECT!'; speakVoice("Kamaal ka shot!"); }
  else if (acc > 0.6) { beep(700,0.12,'triangle',0.11); G.banner='GREAT HIT!'; speakVoice("Dhuandaar hit!"); }
  else if (acc > 0.25) { beep(500,0.12,'triangle',0.09); G.banner='HIT'; speakVoice("Badiya shot!"); }
  else { beep(360,0.12,'triangle',0.08); G.banner='WEAK HIT'; speakVoice("Halka shot!"); }
  G.bannerTimer = 0.9;
}

function updateParticles(dt){
  for (var i=G.particles.length-1;i>=0;i--){
    var p = G.particles[i];
    if (p.confetti) p.vy += 150 * dt;
    else if (p.cheer) p.vy += 180 * dt;
    else if (p.spark) p.vy += 20 * dt;
    else p.vy += 1000 * dt;
    if (p.confetti){ p.vx += Math.sin(performance.now()/300 + i) * 20 * dt; p.rot = (p.rot || 0) + (p.rotV || 0) * dt; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if (p.life<=0 || p.y > H + 60) G.particles.splice(i,1);

}
function update(dt){
  NET.lastSync = (NET.lastSync || 0) + dt;
  if (NET.lastSync > 0.10 && NET.roomRef && NET.role && G.mode === 'online' && !NET.autopilot){
    NET.lastSync = 0;
    var phaseLabel = G.phase;
    if (G.phase === 'power' || G.phase === 'air') phaseLabel = 'BATTING';
    else if (G.phase === 'fly') phaseLabel = 'HIT!';
    else if (G.phase === 'fielding') phaseLabel = 'FIELDING';
    else if (G.phase === 'throw') phaseLabel = 'THROWING';
    else if (G.phase === 'result') phaseLabel = 'RESULT';
    else if (G.phase === 'turnEnd') phaseLabel = 'INNINGS DONE';
    else if (G.phase === 'waitingOpp') phaseLabel = 'WAITING';
    else if (G.phase === 'turnIntro') phaseLabel = 'GETTING READY';
    var fs = [];
    for (var i = 0; i < fielders.length; i++){

    }

      cx: Math.round(camX), pw: Math.round(G.power), sh: G.shotType,
      bd: Math.round(G.hitDistance || 0),
      bn: G.banner || '', bt: Math.round((G.bannerTimer || 0) * 10) / 10,
      oc: G.outcome || '', ql: Math.round((G.quality || 0) * 100) / 100,
      sk: skin.color, dn: danda.color, da: danda.accent,
      nm: NET.myName, fs: fs, ts: Date.now()
    }).catch(function(){});
  }
  if (G.bannerTimer>0) G.bannerTimer -= dt;
  if (G.swingTimer>0) G.swingTimer -= dt;
  if (G.marketMsgTimer>0) G.marketMsgTimer -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3.0);
  updateParticles(dt);
  crowdExcitement = Math.max(0, crowdExcitement - dt * 0.7);
  if (crowdExcitement > 0.9 && Math.random() < crowdExcitement * 0.25) spawnCheerParticles();
  if (crowdCanvas && crowdDots.length){
    if (Math.random() < 0.04 + crowdExcitement * 0.55){ var d = crowdDots[(Math.random() * crowdDots.length) | 0]; flashes.push({ x: d.x, y: d.y, life: 0.32, max: 0.32 }); }
    for (var fl = flashes.length - 1; fl >= 0; fl--){ flashes[fl].life -= dt; if (flashes[fl].life <= 0) flashes.splice(fl, 1); }
  }
  if (G.phase === 'splash'){
    G.splashTimer += dt;
    if (Math.random() < 0.7) spawnSplashSpark();
    if (G.splashTimer >= SPLASH_DURATION){ bootAccount(); }
    return;
  }
  // ✅ FIX: searching phase — forfeit check after searching block
  if (G.phase === 'searching' && NET.searching){
    var elapsed = performance.now() - NET.searchStart;
    var remaining = Math.max(0, 30 - Math.floor(elapsed / 1000));
    NET.statusMsg = remaining > 0 ? 'Searching... Auto-pilot in ' + remaining + 's' : 'Starting auto-pilot...';
    if (elapsed >= 30000){ startAutopilotMode(); return; }
  }
  if (NET.joinPopupTimer > 0){
    NET.joinPopupTimer -= dt;
    if (NET.joinPopupTimer <= 0){ NET.joinPopup = null; NET.joinPopupTimer = 0; }
  }
  // ✅ FIX: forfeit check runs regardless of phase (except splash)
  NET.forfeitTimer += dt;
  if (NET.forfeitTimer > 1){ NET.forfeitTimer = 0; checkOppForfeit(); }
  if (G.phase === 'turnEnd' && G.mode === 'online'){
    G.turnEndTimer = (G.turnEndTimer || 0) + dt;
    if (G.turnEndTimer >= 2.2){ G.turnEndTimer = 0; advanceFromTurnEnd(); return; }
  }
  if (G.phase === 'botBatting'){
    G.botBattingTimer -= dt;
    if (G.botBattingTimer <= 0){ finishBotMatch(); }
    return;
  }
  if (G.phase === 'searching' || G.phase === 'waitingOpp' || G.phase === 'market'){ return; }
  if (G.phase === 'toss'){
    if (performance.now() - NET.tossStartTime > TOSS_DURATION){ NET.tossResultStart = performance.now(); setPhase('tossResult'); }
    return;
  }
  if (G.phase === 'tossResult'){
    if (performance.now() - NET.tossResultStart > TOSS_RESULT_DURATION){
      if (NET.tossWinner === NET.role) beginOnlineTurn();
      else setPhase('waitingOpp');
    }
    return;
  }
  if (G.phase==='turnEnd' || G.phase==='gameOver' || G.phase==='turnIntro'
      || G.phase==='menu' || G.phase==='levelSelect' || G.phase==='playerSelect'
      || G.phase==='nameEntry' || G.phase==='login' || G.phase==='register' || G.phase==='guest'
      || G.phase==='leaderboard' || G.phase==='profileView'){
    camX += (0 - camX) * Math.min(1, dt*3);
    if (G.phase === 'gameOver'){ G.celebrationTimer += dt; G.confettiTimer += dt; if (G.confettiTimer > 0.06){ G.confettiTimer = 0; spawnConfetti(); } }
    return;
  }
  var camTarget = 0;
  if (G.phase==='fly') camTarget = Math.max(0, gulli.x - W*0.35);
  else if ((G.phase==='fielding'||G.phase==='throw') && activeFielder) camTarget = Math.max(0, activeFielder.x - W*0.5);
  camX += (camTarget - camX) * Math.min(1, dt*5);
  for (var fi = 0; fi < fielders.length; fi++){
    var fld = fielders[fi];
    if (fld.chasing) continue;
    fld.patrolPhase += dt * fld.patrolSpeed;
    fld.x = fld.homeX + Math.sin(fld.patrolPhase) * fld.patrol;
    fld.facing = Math.cos(fld.patrolPhase) > 0 ? 1 : -1;
    if (Math.abs(Math.cos(fld.patrolPhase)) > 0.15){ fld.moving = true; fld.runPhase += dt * 12; fld.speed = 180; }
    else { fld.moving = false; fld.runPhase = 0; fld.speed = 0; }
  }
  switch (G.phase){
    case 'power':
      G.power += G.powerDir*105*dt;
      if (G.power>=100){G.power=100;G.powerDir=-1;}
      if (G.power<=0) {G.power=0; G.powerDir=1;}
      break;
    case 'air': {
      gulli.vy += GRAV*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
      if (gulli.vy>0) G.zonePop = Math.min(1, G.zonePop + dt*6);
      if (gulli.y > GROUND_Y-7){ gulli.y = GROUND_Y-7; gulli.grounded = true; missGulli(); }
      break;
    }
    case 'fly': {
      gulli.vy += GRAV*dt; gulli.x += gulli.vx*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
      var y0 = gulli.y, vy0 = gulli.vy;
      var targetY = GROUND_Y - 7;
      var disc = vy0*vy0 + 2*GRAV*(targetY - y0);
      if (disc > 0 && gulli.vx !== 0){
        var tLand = (-vy0 + Math.sqrt(disc)) / GRAV;
        if (tLand > 0 && tLand < 6){
          var landingX = gulli.x + gulli.vx * tLand;
          for (var k=0;k<fielders.length;k++){
            var ff = fielders[k];
            var dx = landingX - ff.x;
            var adist = Math.abs(dx);
            if (adist > 8){
              var spd = Math.min(ff.topSpeed * 1.5, 1700);
              var step = Math.min(spd * dt, adist);
              ff.x += Math.sign(dx) * step;
              ff.moving = true; ff.facing = Math.sign(dx);
              ff.runPhase += dt * 18; ff.speed = spd;
            }
          }
        }
      }
      if (!gulli.grounded){
        var hAbove = GROUND_Y - gulli.y;
        if (hAbove > 80 && hAbove < 280){
          for (var m=0;m<fielders.length;m++){
            var fm = fielders[m];
            if (Math.abs(fm.x - gulli.x) < 46){
              fm.isCatcher = true;
              G.outcome='out'; G.outReason='caught';
              G.hitDistance = Math.max(0, (gulli.x-GULLI_START_X)/PPM);
              G.banner='CAUGHT!'; G.bannerTimer=1.6;
              shake = 0.6; spawnBurst(gulli.x, gulli.y, 1);
              sweep(500,120,0.35,'sawtooth',0.13);
              crowdExcitement = 1.8; playCheer(1.3);
              speakVoice("Lapak liya! Catch out!");
              finishRound(); return;
            }
          }
        }
      }
      if (gulli.y > GROUND_Y-7){
        gulli.y = GROUND_Y-7;
        if (Math.abs(gulli.vy)>230){ gulli.vy = -Math.abs(gulli.vy)*0.42; gulli.vx *= 0.80; spawnDust(gulli.x, GROUND_Y); beep(240,0.06,'sine',0.05); }
        else { gulli.vy = 0; gulli.vx *= Math.pow(0.012, dt); gulli.rotV *= Math.pow(0.05, dt); if (Math.abs(gulli.vx)<28){ gulli.vx=0; beginFielding(); } }
      }
      break;
    }
    case 'fielding': {
      if (!activeFielder){ beginFielding(); break; }
      var dxf = gulli.x - activeFielder.x;
      var distToBall = Math.abs(dxf);
      if (distToBall > 22){
        var minSpeed = distToBall / 0.5;
        var targetSpd = Math.max(activeFielder.topSpeed, minSpeed);
        activeFielder.speed += (targetSpd - activeFielder.speed) * Math.min(1, dt*25);
        var dir = Math.sign(dxf);
        var stepF = Math.min(activeFielder.speed * dt, distToBall - 22);
        if (stepF > 0) activeFielder.x += dir * stepF;
        activeFielder.moving = true; activeFielder.facing = dir;
        activeFielder.runPhase += dt * (activeFielder.speed / 22);
      } else {

      }
      break;
    }
    case 'throw': {

        throwTimer -= dt;

          var sx = activeFielder.x, sy = GROUND_Y - 92;
          var dist = Math.abs(sx - DANDA_X);

          var err = (Math.random()*2-1)*baseError;

          var T = clamp(dist/900, 0.55, 1.55);
          gulli.x = sx; gulli.y = sy;
          gulli.vx = (target - sx)/T;
          gulli.vy = (GROUND_Y-7 - sy - 0.5*GRAV*T*T)/T;

          beep(620,0.08,'square',0.09);
        }
      } else {
        gulli.vy += GRAV*dt; gulli.x += gulli.vx*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
        if (gulli.y > GROUND_Y-7){
          gulli.y = GROUND_Y-7; gulli.vy = 0; gulli.vx = 0;
          var diff = Math.abs(gulli.x - DANDA_X);

            shake = 0.7; spawnBurst(DANDA_X, GROUND_Y-24, 1);
            sweep(760,140,0.38,'sawtooth',0.14); beep(120,0.4,'sawtooth',0.10);
            crowdExcitement = 1.6; playCheer(1.1);
            speakVoice("Seedha dande pe! Wicket!");
          } else {

            speakVoice("Bach gaye! Not out!");
          }
          G.bannerTimer = 1.6;
          finishRound();
        }
      }
      break;
    }
    case 'result':
      G.resultTimer -= dt;
      if (G.resultTimer<=0) nextRound();
      break;
  }
}

function onInput(e){
  if (!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(err){} }

  if (G.phase === 'toss' || G.phase === 'tossResult'){ return; }
  if (G.phase === 'botBatting') return;
  if (G.phase==='menu' || G.phase==='levelSelect' || G.phase==='playerSelect'
      || G.phase==='turnIntro' || G.phase==='turnEnd' || G.phase==='gameOver'
      || G.phase==='login' || G.phase==='register' || G.phase==='guest' || G.phase==='leaderboard'
      || G.phase==='profileView' || G.phase==='searching' || G.phase==='market'){
    if (e){ var coords = canvasCoordsFromEvent(e); handleMenuClick(coords.x, coords.y); }
    return;
  }
  if (G.phase === 'waitingOpp') return;
  if (G.phase === 'nameEntry'){ if (e) commitName(); return; }
  var canPickShot = (G.phase==='power' || G.phase==='air');
  if (canPickShot && e){
    var coords2 = canvasCoordsFromEvent(e);
    for (var i=0; i<shotButtons.length; i++){ if (pointInButton(coords2.x, coords2.y, shotButtons[i])){ setShot(shotButtons[i].id); return; } }
  }
  switch (G.phase){
    case 'power': lockPower(); break;
    case 'air': swing(); break;
    case 'result': if (G.resultTimer<1.4) G.resultTimer=0; break;
  }
}
function handleNameEntryKey(e){

    else if (G.phase === 'guest'){ guestLogin(ACCOUNT.formName); }

    else if (focus === 'guestName'){ ACCOUNT.formName = ACCOUNT.formName.slice(0, -1); }

  }

  if (G.phase==='gameOver' && (e.code==='Space'||e.code==='Enter')){
    if (G.mode==='onlineResults'){ cleanupOnline(); startOnlineMatchmaking(); e.preventDefault(); return; }
    if (G.mode==='single'){

      else startSinglePlayer(G.level);

  }
  if (e.key==='1'){ setShot('PUSH');  e.preventDefault(); return; }
  if (e.key==='2'){ setShot('DRIVE'); e.preventDefault(); return; }
  if (e.key==='3'){ setShot('LOFT');  e.preventDefault(); return; }

    var order = ['PUSH','DRIVE','LOFT'];

function drawStar(cx, cy, outer, inner, points){
  ctx.beginPath();
  for (var i=0; i<points*2; i++){
    var r = i % 2 === 0 ? outer : inner;
    var a = (Math.PI / points) * i - Math.PI/2;
    var x = cx + Math.cos(a) * r; var y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

/* ================================================================
   MASTER DRAW
   ================================================================ */
function draw(){
  ctx.clearRect(0,0,W,H);
  var ph = G.phase;
  if (ph === 'splash'){ drawSplash(); return; }
  if (ph === 'login'){ drawLoginScreen(); return; }
  if (ph === 'register'){ drawRegisterScreen(); return; }
  if (ph === 'guest'){ drawGuestScreen(); return; }
  if (ph === 'leaderboard'){ drawLeaderboard(); return; }
  if (ph === 'profileView'){ drawProfileView(); return; }
  if (ph === 'market'){ drawMarket(); return; }
  ctx.save();
  if (shake > 0.002){ var m = shake * shake * 9; ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m); }
  drawSky();
  if (G.players.length > 0) drawStadium();
  else { ctx.fillStyle = '#2a3142'; ctx.fillRect(0, STADIUM_TOP, W, STADIUM_BOTTOM - STADIUM_TOP); }
  drawField();
  var f, i;
  if (ph === 'menu') drawMenu();
  else if (ph === 'levelSelect') drawLevelSelect();
  else if (ph === 'playerSelect') drawPlayerSelect();
  else if (ph === 'searching') drawSearching();
  else if (ph === 'toss') drawToss();
  else if (ph === 'tossResult') drawTossResult();
  else if (ph === 'botBatting') drawBotBatting();
  else if (ph === 'nameEntry'){ if (!fielders.length) buildFielders(); for (i=0;i<fielders.length;i++) drawFielder(fielders[i]); drawPlayer(); drawNameEntry(); }
  else if (ph === 'turnIntro' || ph === 'turnEnd' || ph === 'gameOver'){
    drawDistanceMarkers();
    for (i=0;i<fielders.length;i++) drawFielder(fielders[i]);
    drawPlayer(); drawEffects();
    if (ph === 'turnIntro') drawTurnIntro(); else if (ph === 'turnEnd') drawTurnEnd(); else drawGameOver();
  }
  else {
    drawDistanceMarkers();
    if (ph === 'fielding' || ph === 'throw' || ph === 'result') drawDandaOnGround();
    drawZone();
    for (i=0;i<fielders.length;i++) drawFielder(fielders[i]);
    drawGulli(); drawPlayer(); drawEffects();
    drawPowerMeter(); drawShotSelector(false); drawCurrentPlayerBadge(); drawOverlays();
    if (ph === 'waitingOpp') drawWaitingOpp();
  }
  drawStickers(frameDt);
  ctx.restore();
  var vg = ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.32)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  drawJoinPopup();
  if (G.banner && G.bannerTimer > 0 && (ph === 'menu' || ph === 'levelSelect' || ph === 'searching' || ph === 'gameOver')){
    ctx.save(); ctx.globalAlpha = clamp(G.bannerTimer/0.4, 0, 1);
    centerText(G.banner, H - 90, 22, '#ffd166'); ctx.restore();
  }
}

/* ================================================================
   HUD + LOOP
   ================================================================ */
var uiScore = document.getElementById('uiScore'), uiBest = document.getElementById('uiBest'),
    uiOuts = document.getElementById('uiOuts'), uiTurn = document.getElementById('uiTurn'),
    uiCoins = document.getElementById('uiCoins'), uiLives = document.getElementById('uiLives'),
    hudEl = document.getElementById('hud'), chatBar = document.getElementById('chatStickerBar');
var HUD_HIDE = ['menu','levelSelect','playerSelect','nameEntry','splash','login','register','guest','searching','toss','tossResult','leaderboard','profileView','market','botBatting','waitingOpp'];
function updateHUD(){
  var hide = HUD_HIDE.indexOf(G.phase) >= 0;
  hudEl.style.display = hide ? 'none' : 'flex';
  if (!hide){
    uiScore.textContent = G.score; uiBest.textContent = G.best;
    uiOuts.textContent = G.outs + '/1';
    uiTurn.textContent = (G.currentPlayer + 1) + '/' + G.players.length;
    uiCoins.textContent = ACCOUNT.coins; uiLives.textContent = ACCOUNT.lives;
  }
  var showChat = G.mode === 'online' && ['power','air','fly','fielding','throw','result','waitingOpp'].indexOf(G.phase) >= 0;
  chatBar.style.display = showChat ? 'flex' : 'none';
}
var last = performance.now(), roomJoinTried = false;
function loop(now){
  var dt = Math.min(0.05, (now - last) / 1000); last = now; frameDt = dt;
  update(dt); draw(); updateHUD();
  if (!roomJoinTried && G.phase === 'menu'){
    roomJoinTried = true;
    try { if (new URLSearchParams(location.search).get('room')) startOnlineMatchmaking(); } catch(e){}
  }
  requestAnimationFrame(loop);
}
resetGulli();
rebuildMenuButtons();
setTimeout(function(){ try{ playSplashChime(); }catch(e){} }, 120);
requestAnimationFrame(loop);

/* ================================================================
   START GATE — fullscreen + landscape lock
   ================================================================ */
var startGate = document.getElementById('startGate');
var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
  window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone === true;
function lockLandscape(){
  return new Promise(function(resolve){
    try{
      if (screen.orientation && screen.orientation.lock){
        var p = screen.orientation.lock('landscape');
        if (p && p.then) p.then(resolve).catch(resolve); else resolve();
      } else resolve();
    }catch(e){ resolve(); }
  });
}
var fsStarted = false, fsAttempts = 0, autoProceedTimer = null;
function isIOSSafariLocal(){
  var ua = navigator.userAgent;
  var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return ios && /Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua);
}
function isInAppBrowserLocal(){
  return /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|WhatsApp|Line\/|Snapchat|Twitter|TikTok|Bytedance|MicroMessenger|LinkedInApp/i.test(navigator.userAgent || '');
}
function finishStart(){
  if (fsStarted) return; fsStarted = true;
  if (autoProceedTimer) clearTimeout(autoProceedTimer);
  startGate.classList.add('hide');
  setTimeout(function(){ startGate.style.display = 'none'; }, 400);
  try { lockLandscape(); } catch(e){}
  try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function(){}); } catch(e){}
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch(e){}
  try { if (typeof firebase !== 'undefined' && !NET.ready) initFirebase(); } catch(e){}
  G.splashTimer = Math.max(G.splashTimer, SPLASH_DURATION - 0.7);
  try { playSplashChime(); } catch(e){}
}
function triggerStart(){
  if (fsStarted) return;
  fsAttempts++;
  var tapText = startGate.querySelector('.sg-tap-text');
  var el = document.documentElement;
  if (isIOSSafariLocal() || isInAppBrowserLocal()){ finishStart(); return; }
  var tried = false;
  try {
    if (el.requestFullscreen){ el.requestFullscreen({ navigationUI:'hide' }).then(lockLandscape).catch(function(){}); tried = true; }
    else if (el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); tried = true; }
  } catch(e){}
  if (!tried){ finishStart(); return; }
  setTimeout(function(){
    if (document.fullscreenElement || document.webkitFullscreenElement){ document.body.classList.add('fs'); finishStart(); return; }
    if (fsAttempts < 2){ if (tapText) tapText.textContent = 'TAP AGAIN'; return; }
    finishStart();
  }, 250);
}
if (isStandalone){
  startGate.style.display = 'none';
  document.body.classList.add('fs');
  lockLandscape();
  setTimeout(function(){
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch(e){}
    if (typeof firebase !== 'undefined' && !NET.ready) initFirebase();
    G.splashTimer = Math.max(G.splashTimer, SPLASH_DURATION - 0.5);
  }, 100);
} else {
  startGate.addEventListener('click', triggerStart);
  startGate.addEventListener('touchend', triggerStart, { passive: true });
  window.addEventListener('keydown', function(e){
    if (startGate.style.display !== 'none' && (e.code === 'Space' || e.code === 'Enter')){ triggerStart(); e.preventDefault(); }
  });
  autoProceedTimer = setTimeout(function(){ if (!fsStarted) finishStart(); }, 2500);
}
document.addEventListener('fullscreenchange', function(){
  if (document.fullscreenElement){ document.body.classList.add('fs'); lockLandscape(); }
  else document.body.classList.remove('fs');
});
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && 'wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function(){});
});

})();
</script>
</body>
