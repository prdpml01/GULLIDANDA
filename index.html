const LEVEL_NAMES = [
  'ROOKIE','AMATEUR','PRO','EXPERT','LEGEND',
  'MASTER','GRANDMASTER','CHAMPION','ELITE','SUPREME',

];
function getLevelTarget(n){
  n = Math.max(1, Math.floor(n));
  if (n === 1) return 100;
  if (n === 2) return 250;
  return 500 * Math.pow(2, n - 3);
}
function getLevel(n){
  n = Math.max(1, Math.floor(n));
  const target = getLevelTarget(n);
  const speed1 = Math.min(600 + (n-1) * 100, 2400);
  const speed2 = Math.min(560 + (n-1) * 95, 2300);
  const error  = Math.max(52 - (n-1) * 2.5, 6);
  let name;
  if (n <= LEVEL_NAMES.length) name = LEVEL_NAMES[n-1];
  else name = 'LEGEND ' + n;
  return { level: n, target, speed:[speed1, speed2], error, name };
}
function calcCoins(score, target){
  const base = Math.floor(score / COIN_DIVISOR);
  const isBonus = score >= 2 * target;
  return { base, bonus: isBonus, total: isBonus ? base * 2 : base };
}

function saveSession(){
  try {
    const base = {
      coins: ACCOUNT.coins,
      lives: ACCOUNT.lives,
      highestUnlockedLevel: ACCOUNT.highestUnlockedLevel,
      ownedSkins: ACCOUNT.ownedSkins,
      ownedDandas: ACCOUNT.ownedDandas,
      ownedBoosts: ACCOUNT.ownedBoosts,
      activeSkin: ACCOUNT.activeSkin,
      activeDanda: ACCOUNT.activeDanda,
      activeBoost: ACCOUNT.activeBoost
    };
    if (ACCOUNT.isGuest){
      localStorage.setItem(SESSION_KEY, JSON.stringify(Object.assign({ isGuest: true, name: ACCOUNT.name }, base)));
    } else {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ username: ACCOUNT.username, isGuest: false }));
    }
  } catch(e){}
}
function clearSession(){ try { localStorage.removeItem(SESSION_KEY); } catch(e){} }
function loadSession(){
  try { const raw = localStorage.getItem(SESSION_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return null;
}
function normalizeUsername(u){ return String(u || '').toUpperCase().replace(/[^A-Z0-9_]/g, '').slice(0, 15); }
function usernameKey(u){ return 'u_' + String(u || '').toLowerCase(); }
function isValidUsername(u){ return u && u.length >= 3 && u.length <= 15; }
function isValidPassword(p){ return p && p.length >= 4 && p.length <= 20; }
function hashPassword(pw){
  let h = 5381; const str = 'gd:' + pw;
  for (let i = 0; i < str.length; i++){ h = ((h << 5) + h) + str.charCodeAt(i); h = h & 0xffffffff; }
  return 'h' + (h >>> 0).toString(36);
}
function trackEvent(name, params){
  try { if (window.firebaseAnalytics){ window.firebaseAnalytics.logEvent(name, params || {}); } } catch(e){}
}

function onUsernameChange(){
  if (suggestionTimer) clearTimeout(suggestionTimer);
  suggestionsOpen = true;
  const typed = ACCOUNT.formUsername;
  if (!typed || typed.length < 2){ usernameSuggestions = []; return; }
  suggestionTimer = setTimeout(() => { fetchUsernameSuggestions(typed); }, 250);
}
function fetchUsernameSuggestions(prefix){
  if (!NET.ready){ usernameSuggestions = []; return; }
  const keyLow = 'u_' + prefix.toLowerCase();
  NET.db.ref('accounts').orderByKey()
    .startAt(keyLow).endAt(keyLow + '\uf8ff').limitToFirst(5)
    .once('value').then(snap => {
      const out = [];
      snap.forEach(ch => { const v = ch.val(); if (v && v.username){ out.push(v.username); } });
      usernameSuggestions = out;
    }).catch(() => { usernameSuggestions = []; });
}

function registerUserAccount(username, password){
  if (!NET.ready){ ACCOUNT.error = 'Network not ready'; return; }
  if (!isValidUsername(username)){ ACCOUNT.error = 'Username must be 3-15 chars (A-Z, 0-9, _)'; return; }
  if (!isValidPassword(password)){ ACCOUNT.error = 'Password must be 4-20 chars'; return; }
  ACCOUNT.error = ''; ACCOUNT.loading = true;
  const key = usernameKey(username);
  NET.db.ref('accounts/' + key).once('value').then(snap => {
    if (snap.exists()){ ACCOUNT.error = 'Username already taken. Try another.'; ACCOUNT.loading = false; return; }
    const data = {
      username, passwordHash: hashPassword(password), name: username,
      bestSingle: 0, bestOnline: 0, matchesPlayed: 0, onlineMatches: 0,
      wins: 0, losses: 0, totalRuns: 0,
      highestUnlockedLevel: 1, coins: 0, lives: 0,
      ownedSkins: ['red'], ownedDandas: ['brown'], ownedBoosts: ['normal'],
      activeSkin: 'red', activeDanda: 'brown', activeBoost: 'normal',
      createdAt: Date.now(), updatedAt: Date.now()
    };
    return NET.db.ref('accounts/' + key).set(data).then(() => {
      Object.assign(ACCOUNT, data);
      ACCOUNT.loggedIn = true; ACCOUNT.isGuest = false; ACCOUNT.loading = false;
      saveSession(); setPhase('menu');
      beep(880, 0.1, 'triangle', 0.11);
      setTimeout(()=>beep(1200, 0.15, 'triangle', 0.11), 120);
      trackEvent('sign_up', { method: 'username' });
    });
  }).catch(() => { ACCOUNT.error = 'Connection error. Try again.'; ACCOUNT.loading = false; });
}

function loginUserAccount(username, password){
  if (!NET.ready){ ACCOUNT.error = 'Network not ready'; return; }
  if (!isValidUsername(username)){ ACCOUNT.error = 'Enter a valid username'; return; }
  if (!isValidPassword(password)){ ACCOUNT.error = 'Enter your password'; return; }
  ACCOUNT.error = ''; ACCOUNT.loading = true;
  const key = usernameKey(username);
  NET.db.ref('accounts/' + key).once('value').then(snap => {
    if (!snap.exists()){ ACCOUNT.error = 'Username not found. Register first.'; ACCOUNT.loading = false; return; }
    const data = snap.val();
    if (data.passwordHash !== hashPassword(password)){ ACCOUNT.error = 'Wrong password. Try again.'; ACCOUNT.loading = false; return; }
    ACCOUNT.username = data.username || username;
    ACCOUNT.name = data.name || ACCOUNT.username;
    ACCOUNT.passwordHash = data.passwordHash;
    ACCOUNT.bestSingle = data.bestSingle || 0;
    ACCOUNT.bestOnline = data.bestOnline || 0;
    ACCOUNT.matchesPlayed = data.matchesPlayed || 0;
    ACCOUNT.onlineMatches = data.onlineMatches || 0;
    ACCOUNT.wins = data.wins || 0;
    ACCOUNT.losses = data.losses || 0;
    ACCOUNT.totalRuns = data.totalRuns || 0;
    ACCOUNT.highestUnlockedLevel = Math.max(1, data.highestUnlockedLevel || 1);
    ACCOUNT.coins = Math.max(0, data.coins || 0);
    ACCOUNT.lives = Math.max(0, data.lives || 0);
    ACCOUNT.ownedSkins = data.ownedSkins || ['red'];
    ACCOUNT.ownedDandas = data.ownedDandas || ['brown'];
    ACCOUNT.ownedBoosts = data.ownedBoosts || ['normal'];
    ACCOUNT.activeSkin = data.activeSkin || 'red';
    ACCOUNT.activeDanda = data.activeDanda || 'brown';
    ACCOUNT.activeBoost = data.activeBoost || 'normal';
    ACCOUNT.loggedIn = true; ACCOUNT.isGuest = false; ACCOUNT.loading = false;
    saveSession(); setPhase('menu');
    beep(880, 0.1, 'triangle', 0.11);
    trackEvent('login', { method: 'username' });
  }).catch(() => { ACCOUNT.error = 'Connection error. Try again.'; ACCOUNT.loading = false; });
}

function syncAccountStats(){
  if (!NET.ready || !ACCOUNT.loggedIn || ACCOUNT.isGuest || !ACCOUNT.username) return;
  const key = usernameKey(ACCOUNT.username);
  NET.db.ref('accounts/' + key).update({
    name: ACCOUNT.name,
    bestSingle: ACCOUNT.bestSingle, bestOnline: ACCOUNT.bestOnline,
    matchesPlayed: ACCOUNT.matchesPlayed, onlineMatches: ACCOUNT.onlineMatches,
    wins: ACCOUNT.wins, losses: ACCOUNT.losses, totalRuns: ACCOUNT.totalRuns,
    highestUnlockedLevel: ACCOUNT.highestUnlockedLevel,
    coins: ACCOUNT.coins,
    lives: ACCOUNT.lives,
    ownedSkins: ACCOUNT.ownedSkins,
    ownedDandas: ACCOUNT.ownedDandas,
    ownedBoosts: ACCOUNT.ownedBoosts,
    activeSkin: ACCOUNT.activeSkin,
    activeDanda: ACCOUNT.activeDanda,
    activeBoost: ACCOUNT.activeBoost,
    updatedAt: Date.now()
  }).catch(()=>{});
}
function updateStatsSingle(score, coinsEarned){
  ACCOUNT.matchesPlayed++; ACCOUNT.totalRuns += score;
  if (score > ACCOUNT.bestSingle) ACCOUNT.bestSingle = score;
  if (coinsEarned) ACCOUNT.coins += coinsEarned;
  syncAccountStats();
  trackEvent('single_match_end', { score: score, coins: coinsEarned || 0 });
}
function updateStatsOnline(myScore, won){
  ACCOUNT.matchesPlayed++; ACCOUNT.onlineMatches++; ACCOUNT.totalRuns += myScore;
  if (myScore > ACCOUNT.bestOnline) ACCOUNT.bestOnline = myScore;
  if (won) ACCOUNT.wins++; else ACCOUNT.losses++;
  syncAccountStats();
  trackEvent('online_match_end', { score: myScore, won: won ? 1 : 0 });
}

  if (!NET.ready){ if (cb) cb(null); return; }
  LEADERBOARD.loading = true;
  NET.db.ref('accounts').orderByChild('bestOnline').limitToLast(10).once('value').then(snap => {
    const arr = [];
    snap.forEach(child => { const v = child.val(); if (v && v.username && !v.isGuest) arr.push(v); });
    arr.sort((a,b) => (b.bestOnline||0) - (a.bestOnline||0));
    LEADERBOARD.data = arr; LEADERBOARD.loading = false;
    if (cb) cb(arr);
  }).catch(() => { LEADERBOARD.loading = false; if (cb) cb(null); });
}

function resetMatchFlags(){
  NET.round = 1; NET.rematchSent = false; NET.oppRematch = false; NET.oppLeft = false;
  NET.botResult = false; NET.forfeitWin = false; NET.leaveArmed = false;
  NET.roundStarting = false; NET.hopping = false; NET.autopilotStarting = false;
  NET.autopilotRetryAt = 0; NET.oppLiveAt = 0; NET.series = { me: 0, opp: 0 };
  clearTimeout(NET.scanTimer); NET.scanTimer = null;
}

const SPEC = {
  ready: false,
  gx: 0, gy: 0, gr: 0, cx: 0,
  tgx: 0, tgy: 0, tgr: 0, tcx: 0,
  fX: []
};
function specReset(){ SPEC.ready = false; SPEC.fX = []; }

function initFirebase(){
  try {
    if (typeof firebase === 'undefined') return false;
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    NET.db = firebase.database();
    NET.ready = true;
    try {
      if (firebase.analytics){
        window.firebaseAnalytics = firebase.analytics();
        window.firebaseAnalytics.logEvent('page_view', {
          page_title: 'Gulli Danda Game', page_location: window.location.href, timestamp: Date.now()
        });
      }
    } catch(e){}
    return true;
  } catch(e){ return false; }
}
function genRoomId(){ return 'GD-' + Math.random().toString(36).slice(2,7).toUpperCase(); }

function startOnlineMatchmaking(){
  if (!ACCOUNT.loggedIn){ setPhase('login'); return; }
  if (ACCOUNT.isGuest){ G.banner = 'REGISTER TO PLAY ONLINE'; G.bannerTimer = 2.5; return; }
  NET.myName = ACCOUNT.name;
  NET.myDone = false; NET.oppDone = false; NET.oppScore = null; NET.oppName = '';
  NET.oppLive = null; NET.tossWinner = null; NET.currentBatsman = null;
  NET.tossDecided = false; NET.turnHandedOver = false;
  NET.autopilot = false; NET.autopilotStart = 0;
  NET.autopilotBot = null;
  NET.joinPopup = null; NET.joinPopupTimer = 0;
  NET.roomRef = null; NET.roomId = null; NET.role = null;
  resetMatchFlags();
  specReset();
  if (!NET.ready && !initFirebase()){ G.banner = 'NETWORK ERROR'; G.bannerTimer = 2.5; setPhase('menu'); return; }
  setPhase('searching'); NET.searching = true;
  NET.searchStart = performance.now(); NET.statusMsg = 'Searching for players...';
  trackEvent('matchmaking_start', {});
  tryFindRoom();
}
function roomIsFresh(room){ return !room.createdAt || (Date.now() - room.createdAt) < 30*60*1000; }
function listRooms(status){
  return NET.db.ref('rooms').orderByChild('status').equalTo(status).limitToFirst(10).once('value').then(snap => {
    const arr = [];
    snap.forEach(ch => {
      const r = ch.val();
      if (r && r.p1 && r.p1.name !== NET.myName && roomIsFresh(r)) arr.push({ id: ch.key, room: r, status: status });
    });
    return arr;
  }).catch(() => []);
}
function findCandidates(){
  return Promise.all([listRooms('waiting'), listRooms('autopilot')]).then(res => {
    const w = res[0].filter(c => !c.room.p2);
    const a = res[1].filter(c => c.room.p2 && c.room.p2.isBot);
    return w.concat(a);
  });
}
function claimRoom(id, wantStatus){
  return NET.db.ref('rooms/' + id).transaction(cur => {
    if (cur === null) return cur;
    if (!cur.p1 || cur.p1.name === NET.myName || cur.status !== wantStatus) return;
    if (wantStatus === 'waiting' && cur.p2) return;
    if (wantStatus === 'autopilot' && !(cur.p2 && cur.p2.isBot)) return;
    cur.status = 'playing';
    cur.p2 = { name: NET.myName, score: 0, done: false };
    cur.joinedAt = Date.now();
    return cur;
  }).then(res => {
    const v = res.snapshot && res.snapshot.val();
    return !!(res.committed && v && v.status === 'playing' && v.p2 && v.p2.name === NET.myName);
  });
}
function detachRoomListeners(){
  if (NET.listener && NET.roomRef){ try{ NET.roomRef.off('value', NET.listener); }catch(e){} }
  NET.listener = null;
  if (NET.liveRef){ try{ NET.liveRef.off(); }catch(e){} NET.liveRef = null; }
}
function armLeaveFlag(){
  try{
    if (NET.roomRef && NET.role){
      NET.roomRef.onDisconnect().cancel();
      NET.roomRef.child(NET.role + '/left').onDisconnect().set(true);
    }
  }catch(e){}
}
function refreshResultButtons(){ if (G.phase === 'gameOver' && G.mode === 'onlineResults') rebuildMenuButtons(); }

function tryFindRoom(){
  if (!NET.searching || NET.roomRef) return;
  findCandidates().then(cands => {
    if (!NET.searching || NET.roomRef) return;
    return attemptJoin(cands, 0).then(ok => {
      if (ok || !NET.searching || NET.roomRef) return;
      if (performance.now() - NET.searchStart > 4000) createRoom();
      else setTimeout(() => { if (NET.searching) tryFindRoom(); }, 1500);
    });
  }).catch(() => {
    if (!NET.searching || NET.roomRef) return;
    if (performance.now() - NET.searchStart > 4000) createRoom();
    else setTimeout(() => { if (NET.searching) tryFindRoom(); }, 1500);
  });
}
function attemptJoin(cands, i){
  if (!NET.searching || i >= cands.length) return Promise.resolve(false);
  const c = cands[i];
  return claimRoom(c.id, c.status).then(ok => {
    if (ok){
      if (!NET.searching){
        try{ NET.db.ref('rooms/' + c.id + '/p2/left').set(true); }catch(e){}
        return false;
      }
      onJoined(c.id, c.room);
      return true;
    }
    return attemptJoin(cands, i + 1);
  }).catch(() => attemptJoin(cands, i + 1));
}
function onJoined(id, room){
  NET.roomId = id; NET.role = 'p2';
  NET.oppName = room.p1 ? room.p1.name : '';
  NET.roomRef = NET.db.ref('rooms/' + id);
  NET.searching = false;
  NET.tossDecided = false; NET.tossWinner = null; NET.currentBatsman = null;
  NET.round = room.round || 1;
  NET.myDone = false; NET.oppDone = false; NET.oppScore = null; NET.oppLive = null; NET.oppLeft = false;
  NET.statusMsg = 'Joined ' + (NET.oppName || 'player') + ' — connecting...';
  NET.leaveArmed = true; armLeaveFlag();
  specReset();
  watchRoom();
  trackEvent('matchmaking_success', {});
  waitForHost(id);
}
function waitForHost(id){
  const joinStart = performance.now();
  const check = () => {
    if (NET.roomId !== id || NET.role !== 'p2') return;
    if (NET.tossWinner || G.phase !== 'searching') return;
    if (performance.now() - joinStart > 20000){ restartSearch(); return; }
    setTimeout(check, 1000);
  };
  setTimeout(check, 1000);
}
function restartSearch(){
  const ref = NET.roomRef;
  detachRoomListeners();
  try{ if (ref){ ref.child('p2/left').set(true); ref.child('p2/left').onDisconnect().cancel(); } }catch(e){}
  NET.roomRef = null; NET.roomId = null; NET.role = null; NET.leaveArmed = false;
  NET.tossWinner = null; NET.currentBatsman = null; NET.tossDecided = false;
  NET.searching = true; NET.searchStart = performance.now();
  NET.statusMsg = 'Searching for players...';
  setPhase('searching');
  tryFindRoom();
}
function createRoom(){
  if (!NET.searching || NET.roomRef) return;
  const id = genRoomId(); NET.roomId = id; NET.role = 'p1';
  NET.myRoomCreatedAt = Date.now(); NET.round = 1;
  NET.roomRef = NET.db.ref('rooms/' + id);
  const ref = NET.roomRef;
  ref.set({
    status: 'waiting', createdAt: NET.myRoomCreatedAt, round: 1,
    p1: { name: NET.myName, score: 0, done: false }, p2: null
  }).then(() => {
    if (NET.roomRef !== ref) return;
    NET.statusMsg = 'Room created. Waiting for opponent...';
    try{ ref.onDisconnect().remove(); }catch(e){}
    watchRoom();
    scheduleRoomScan();
  }).catch(() => {});
}
function scheduleRoomScan(){
  clearTimeout(NET.scanTimer);
  NET.scanTimer = setTimeout(scanForRooms, 2000);
}
function scanForRooms(){
  if (!NET.searching || NET.role !== 'p1' || !NET.roomRef || NET.hopping) return;
  const myId = NET.roomId, myCreated = NET.myRoomCreatedAt || 0;
  findCandidates().then(cands => {
    if (!NET.searching || NET.roomId !== myId) return;
    const elig = cands.filter(c => {
      if (c.status === 'autopilot') return true;
      const cc = c.room.createdAt || 0;
      return cc < myCreated || (cc === myCreated && c.id < myId);
    });
    if (!elig.length){ scheduleRoomScan(); return; }
    hopTo(elig, myId);
  }).catch(() => scheduleRoomScan());
}
function hopTo(elig, myId){
  NET.hopping = true;
  const myRef = NET.roomRef;
  myRef.transaction(cur => {
    if (cur === null) return cur;
    if (cur.status !== 'waiting' || cur.p2) return;
    cur.status = 'closing';
    return cur;
  }).then(res => {
    const v = res.snapshot && res.snapshot.val();
    if (!(res.committed && v && v.status === 'closing')){ NET.hopping = false; scheduleRoomScan(); return; }
    detachRoomListeners();
    return attemptJoin(elig, 0).then(ok => {
      NET.hopping = false;
      if (ok){
        try{ myRef.onDisconnect().cancel(); }catch(e){}
        myRef.remove().catch(() => {});
      } else if (NET.roomRef === myRef && NET.searching){
        myRef.transaction(cur => {
          if (cur && cur.status === 'closing' && !cur.p2){ cur.status = 'waiting'; }
          return cur;
        }).catch(() => {});
        watchRoom();
        scheduleRoomScan();
      }
    });
  }).catch(() => { NET.hopping = false; scheduleRoomScan(); });
}

function watchRoom(){
  detachRoomListeners();
  const ref = NET.roomRef; if (!ref) return;
  const role = NET.role;
  const oppRole = role === 'p1' ? 'p2' : 'p1';
  NET.listener = ref.on('value', snap => {
    const data = snap.val();
    if (!data){
      if (role === 'p2' && !NET.tossWinner && G.phase === 'searching' && NET.roomRef === ref) restartSearch();
      return;
    }
    const opp = data[oppRole];
    if (opp && !opp.isBot){
      NET.oppName = opp.name || NET.oppName;
      NET.oppScore = typeof opp.score === 'number' ? opp.score : null;
      NET.oppDone = !!opp.done;
      const wasLeft = NET.oppLeft;
      NET.oppLeft = !!opp.left;
      if (!NET.leaveArmed){ NET.leaveArmed = true; armLeaveFlag(); }
      if (wasLeft !== NET.oppLeft) refreshResultButtons();
    }

    const dr = data.round || 1;
    if (dr > NET.round){ startNextRound(data, dr); return; }

    const rm = data.rematch || {};
    const mineReq = rm[role] === NET.round, oppReq = rm[oppRole] === NET.round;
    if (mineReq !== NET.rematchSent || oppReq !== NET.oppRematch){
      NET.rematchSent = mineReq; NET.oppRematch = oppReq; refreshResultButtons();
    }
    if (rm.p1 === NET.round && rm.p2 === NET.round &&
        !NET.roundStarting && !NET.oppLeft && !NET.botResult &&
        data.p1 && data.p2 && !data.p2.isBot){
      NET.roundStarting = true;
      const myRound = NET.round;
      ref.transaction(cur => {
        if (cur === null) return cur;
        if ((cur.round || 1) !== myRound) return;
        if (!cur.p1 || !cur.p2 || cur.p2.isBot) return;
        const w = Math.random() < 0.5 ? 'p1' : 'p2';
        cur.round = myRound + 1;
        cur.tossWinner = w;
        cur.currentBatsman = w;
        cur.skipToss = null;
        cur.live = null;
        cur.rematch = null;
        cur.p1.score = 0; cur.p1.done = false; cur.p1.left = null;
        cur.p2.score = 0; cur.p2.done = false; cur.p2.left = null;
        return cur;
      }).then(() => { NET.roundStarting = false; })
        .catch(() => { NET.roundStarting = false; });
    }

    if (role === 'p1' && data.p2 && !data.p2.isBot && !data.tossWinner && !NET.tossDecided){
      NET.tossDecided = true; NET.searching = false;
      const winner = Math.random() < 0.5 ? 'p1' : 'p2';
      ref.update({ tossWinner: winner, currentBatsman: winner }).catch(() => {});
    }
    if (data.tossWinner && !NET.tossWinner){
      NET.tossWinner = data.tossWinner;
      NET.currentBatsman = data.currentBatsman || data.tossWinner;
      NET.searching = false;
      if (data.skipToss){
        if (NET.currentBatsman === NET.role && !NET.myDone){
          G.banner = '🎮 ' + (NET.oppName || 'OPPONENT') + ' IS DONE — YOUR TURN!'; G.bannerTimer = 2.5;
          beginOnlineTurn();
        } else {
          G.banner = '🔗 LINKED WITH ' + (NET.oppName || 'OPPONENT'); G.bannerTimer = 2.5;
          setPhase('waitingOpp');
        }
      } else if (G.phase !== 'toss' && G.phase !== 'tossResult'){
        NET.tossStartTime = performance.now(); setPhase('toss');
      }
    }
    if (data.currentBatsman && data.currentBatsman !== NET.currentBatsman){
      NET.currentBatsman = data.currentBatsman;
      if (NET.currentBatsman === NET.role && !NET.myDone && G.phase === 'waitingOpp'){ beginOnlineTurn(); }
    }
    if (data.p1 && data.p2 && data.p1.done && data.p2.done){ showOnlineResults(data); }
    checkOppForfeit();
  });
  NET.liveRef = ref.child('live/' + oppRole);
  NET.liveRef.on('value', snap => {
    const val = snap.val();
    NET.oppLive = val;
    NET.oppLiveAt = performance.now();
    if (val && val.sticker && (!NET.lastStickerTime || val.sticker.ts > NET.lastStickerTime)){
      NET.lastStickerTime = val.sticker.ts;
      spawnSticker(val.sticker.emoji, false);
      beep(980, 0.08, 'triangle', 0.1);
    }
  });
}
function startNextRound(data, dr){
  NET.round = dr;
  NET.myDone = false; NET.oppDone = false; NET.oppScore = null; NET.oppLive = null;
  NET.turnHandedOver = false; NET.rematchSent = false; NET.oppRematch = false;
  NET.roundStarting = false; NET.botResult = false; NET.forfeitWin = false;
  NET.tossWinner = data.tossWinner || 'p1';
  NET.currentBatsman = data.currentBatsman || NET.tossWinner;
  NET.tossDecided = true;
  NET.tossStartTime = performance.now();
  NET.oppLeft = false;
  G.turnEndTimer = 0;
  specReset();
  G.banner = '🔁 REMATCH!'; G.bannerTimer = 2;
  setPhase('toss');
}
function requestRematch(){
  if (!NET.roomRef || NET.rematchSent || NET.oppLeft || NET.botResult || NET.forfeitWin) return;
  NET.rematchSent = true; rebuildMenuButtons();
  NET.roomRef.child('rematch/' + NET.role).set(NET.round).catch(() => { NET.rematchSent = false; rebuildMenuButtons(); });
}
function checkOppForfeit(){
  if (!NET.roomRef || !NET.oppLeft || NET.oppDone) return;
  if (G.phase !== 'waitingOpp' && G.phase !== 'toss' && G.phase !== 'tossResult') return;
  showForfeitWin();
}
function showForfeitWin(){
  const myScore = NET.myDone ? (G.score || 0) : 0;
  G.mode = 'onlineResults';
  G.players = [
    { name: NET.myName, color: getActiveSkin().color, score: myScore },
    { name: NET.oppName || 'OPPONENT', color: PLAYER_COLORS[1], score: NET.oppScore || 0 }
  ];
  G.gameOverWinner = 0;
  G.gameOverMsg = 'OPPONENT LEFT — YOU WIN!';
  NET.forfeitWin = true; NET.series.me++;
  updateStatsOnline(myScore, true);
  G.celebrationTimer = 0; G.confettiTimer = 0;
  setPhase('gameOver');
  crowdExcitement = 2; playCheer(1.4);
}
function beginOnlineTurn(){
  G.mode = 'online';
  G.players = [{ name: NET.myName, color: getActiveSkin().color, score:0, outs:0 }];
  G.currentPlayer = 0;
  G.gameOverWinner = null; G.gameOverMsg = ''; G.levelCleared = false;
  G.celebrationTimer = 0; G.confettiTimer = 0;
  specReset();
  initCrowd(); prepareTurn();
}
function reportOnlineScore(score){
  if (!NET.roomRef && !NET.autopilot) return;
  if (NET.myDone) return;
  NET.myDone = true;

  if (NET.autopilot){
    const playerScore = G.score;
    let botScore;
    if (playerScore < 50){
      botScore = Math.round(30 + Math.random() * 80);
    } else {
      botScore = Math.round(playerScore * (0.55 + Math.random() * 0.75));
    }
    if (botScore < 20) botScore = 20 + Math.round(Math.random() * 40);
    G.botScore = botScore;
    NET.autopilotBot.score = botScore;
    G.botBattingTimer = 5.0;
    setPhase('botBatting');
    beep(600, 0.12, 'triangle', 0.10);
    return;
  }

  const update = {};
  update[NET.role + '/score'] = score;
  update[NET.role + '/done'] = true;
  if (NET.currentBatsman === NET.role && !NET.turnHandedOver){
    NET.turnHandedOver = true;
    update['currentBatsman'] = (NET.role === 'p1') ? 'p2' : 'p1';
  }
  NET.statusMsg = 'Waiting for ' + (NET.oppName || 'opponent') + '...';
  specReset();
  setPhase('waitingOpp');
  NET.roomRef.update(update).then(() => { checkFinish(); }).catch(() => {});
}
function checkFinish(){
  if (!NET.roomRef) return;
  NET.roomRef.once('value').then(snap => {
    const d = snap.val();
    if (d && d.p1 && d.p2 && d.p1.done && d.p2.done) showOnlineResults(d);
    else checkOppForfeit();
  });
}
function showOnlineResults(data){
  if (G.phase === 'gameOver' && G.mode === 'onlineResults') return;
  G.mode = 'onlineResults';
  NET.botResult = false; NET.forfeitWin = false;
  const myScore  = (data[NET.role] && data[NET.role].score) || 0;
  const oppScore = ((NET.role === 'p1' ? data.p2 : data.p1)?.score) || 0;
  const myName   = (data[NET.role] && data[NET.role].name) || NET.myName || 'YOU';
  const oppName  = ((NET.role === 'p1' ? data.p2 : data.p1)?.name) || NET.oppName || 'OPPONENT';
  G.players = [
    { name: myName,  color: getActiveSkin().color, score: myScore },
    { name: oppName, color: PLAYER_COLORS[1], score: oppScore }
  ];
  G.gameOverWinner = myScore > oppScore ? 0 : (myScore < oppScore ? 1 : -1);
  G.gameOverMsg = (myScore === oppScore) ? 'DRAW!' : (myScore > oppScore ? 'YOU WIN!' : 'YOU LOSE');
  if (G.gameOverWinner === 0) NET.series.me++; else if (G.gameOverWinner === 1) NET.series.opp++;
  updateStatsOnline(myScore, myScore > oppScore);
  G.celebrationTimer = 0; G.confettiTimer = 0;
  setPhase('gameOver');
  if (myScore >= oppScore){ crowdExcitement = 2; playCheer(1.4); }
  else { beep(240,0.3,'sawtooth',0.10); }
}
function cleanupOnline(){
  NET.searching = false;
  const ref = NET.roomRef, role = NET.role;
  detachRoomListeners();
  if (ref && role){
    try{ ref.onDisconnect().cancel(); ref.child(role + '/left').onDisconnect().cancel(); }catch(e){}
    ref.once('value').then(snap => {
      const d = snap.val(); if (!d) return;
      const opp = d[role === 'p1' ? 'p2' : 'p1'];
      const oppGone = !opp || opp.isBot || opp.left;
      if (oppGone || (role === 'p1' && (d.status === 'waiting' || d.status === 'autopilot' || d.status === 'closing'))){
        ref.remove().catch(() => {});
      } else {
        ref.child(role + '/left').set(true).catch(() => {});
      }
    }).catch(() => {});
  }
  resetMatchFlags();
  NET.oppLive = null; NET.roomId = null; NET.role = null; NET.oppName = '';
  NET.oppScore = null; NET.oppDone = false; NET.myDone = false; NET.roomRef = null;
  NET.tossWinner = null; NET.currentBatsman = null;
  NET.tossDecided = false; NET.turnHandedOver = false;
  NET.autopilot = false; NET.autopilotStart = 0;
  NET.autopilotBot = null;
  NET.joinPopup = null; NET.joinPopupTimer = 0;
  specReset();
}

function startAutopilotMode(){
  if (!NET.searching || NET.autopilotStarting) return;
  if (performance.now() < NET.autopilotRetryAt) return;
  NET.autopilotStarting = true;

  const botData = { name: '🤖 AUTO-PILOT', score: 0, done: false, isBot: true };
  const p1Data  = { name: NET.myName, score: 0, done: false };

  const begin = () => {
    NET.autopilotStarting = false;
    if (!NET.searching) return;
    clearTimeout(NET.scanTimer);
    NET.searching = false;
    NET.autopilot = true;
    NET.autopilotStart = performance.now();
    NET.autopilotBot = { name: '🤖 AUTO-PILOT', score: 0 };
    NET.role = 'p1';
    NET.oppName = NET.autopilotBot.name;
    NET.myDone = false; NET.oppDone = false; NET.oppLeft = false;
    NET.turnHandedOver = false; NET.botResult = false;
    NET.tossWinner = 'p1';
    NET.currentBatsman = 'p1';
    NET.tossStartTime = performance.now();
    NET.tossResultStart = 0;
    detachRoomListeners();
    try{ if (NET.roomRef) NET.roomRef.onDisconnect().remove(); }catch(e){}
    if (NET.roomRef) watchAutopilotRoom();
    specReset();
    setPhase('toss');
    trackEvent('autopilot_start', {});
  };

  if (NET.roomRef){
    const ref = NET.roomRef;
    ref.transaction(cur => {
      if (cur === null) return cur;
      if (cur.status !== 'waiting' || cur.p2) return;
      cur.status = 'autopilot';
      cur.p1 = p1Data; cur.p2 = botData;
      return cur;
    }).then(res => {
      const v = res.snapshot && res.snapshot.val();
      if (NET.roomRef !== ref || !NET.searching){ NET.autopilotStarting = false; return; }
      if (res.committed && v && v.status === 'autopilot') begin();
      else { NET.autopilotStarting = false; NET.autopilotRetryAt = performance.now() + 1500; }

let actx = null;
function beep(freq, dur, type='sine', vol=0.12){
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  } catch(e){}
}
function sweep(f1,f2,dur,type='square',vol=0.10){
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f1, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  } catch(e){}
}
function playCheer(intensity = 1){
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const dur = 0.5 + intensity * 0.6;
    const bufSize = Math.floor(actx.sampleRate * dur);
    const buffer = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++){
      const phase = i / bufSize;
      const env = Math.sin(phase * Math.PI) * (1 - phase * 0.4);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = actx.createBufferSource(); src.buffer = buffer;
    const filter = actx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800 + intensity * 800; filter.Q.value = 0.6;
    const gain = actx.createGain(); gain.gain.value = 0.055 * intensity;
    src.connect(filter).connect(gain).connect(actx.destination);
    src.start(); src.stop(actx.currentTime + dur);
  } catch(e){}
}

function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
const lerp  = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)+amt, g = ((n>>8)&0xff)+amt, b = (n&0xff)+amt;
  return '#' + ((clamp(r,0,255)<<16)|(clamp(g,0,255)<<8)|clamp(b,0,255)).toString(16).padStart(6,'0');
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);

}

function drawCrowdPerson(c, p, armRaise){
  const s = p.s;
  const headR = 4.6 * s, bodyH = 12.5 * s;
  const hipY = p.y - 2.5*s;
  const shoulderY = hipY - bodyH;
  const headY = shoulderY - headR*0.62;
  const raise = armRaise || 0;
  c.fillStyle = p.shirt;
  rr(c, p.x - 5.5*s, shoulderY, 11*s, bodyH + 3*s, 3.4*s); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.16)';
  rr(c, p.x + 1.5*s, shoulderY + 1*s, 4*s, bodyH + 1.5*s, 2.6*s); c.fill();
  c.strokeStyle = p.shirt; c.lineWidth = 2.5*s; c.lineCap = 'round';
  const handY = shoulderY + (raise > 0 ? -7*s*raise : 8*s);
  c.beginPath();
  c.moveTo(p.x - 4.6*s, shoulderY + 1.5*s); c.lineTo(p.x - 7.6*s, handY);
  c.moveTo(p.x + 4.6*s, shoulderY + 1.5*s); c.lineTo(p.x + 7.6*s, handY);
  c.stroke();
  c.fillStyle = p.skin;
  c.beginPath(); c.arc(p.x - 7.6*s, handY, 1.7*s, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(p.x + 7.6*s, handY, 1.7*s, 0, Math.PI*2); c.fill();
  c.fillStyle = p.skin;
  c.beginPath(); c.ellipse(p.x, headY, headR*0.9, headR, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = p.hair;
  c.beginPath(); c.ellipse(p.x, headY - headR*0.28, headR*0.98, headR*0.78, 0, Math.PI, Math.PI*2); c.fill();
  if (s > 0.95){
    c.fillStyle = 'rgba(20,15,10,0.75)';
    c.beginPath(); c.arc(p.x - headR*0.36, headY + headR*0.08, headR*0.13, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(p.x + headR*0.36, headY + headR*0.08, headR*0.13, 0, Math.PI*2); c.fill();
  }
  if (p.hat){
    c.fillStyle = shade(p.shirt, -45);
    c.beginPath(); c.ellipse(p.x, headY - headR*0.62, headR*1.18, headR*0.62, 0, Math.PI, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(p.x + headR*0.55, headY - headR*0.62, headR*0.9, headR*0.30, 0, 0, Math.PI*2); c.fill();
  }
}
function initCrowd(){
  const numPlayers = Math.max(G.players.length || 1, 1);
  const sectionWidth = W / numPlayers;
  crowdSections = [];
  for (let s = 0; s < numPlayers; s++){
    const p = G.players[s];
    crowdSections.push({ color: p ? p.color : '#7a8aa0', name: p ? p.name : 'FANS', x: s * sectionWidth, w: sectionWidth });
  }
  crowdCanvas = document.createElement('canvas');
  crowdCanvas.width = W; crowdCanvas.height = H;
  const c = crowdCanvas.getContext('2d');
  crowdRows = []; crowdDots = []; frontRowPeople = []; flashes = []; crowdFlags = [];
  const ROWS = 8;
  const startY = STADIUM_TOP + 6, endY = STADIUM_BOTTOM - 12;
  const rowH = (endY - startY) / ROWS;
  for (let row = 0; row < ROWS; row++){
    const depth = row / (ROWS - 1);
    const isFront = (row === ROWS - 1);
    const baseY = startY + row * rowH + rowH * 0.78;
    const scale = 0.50 + depth * 0.82;
    const gap = 21 - depth * 9;
    const dim = Math.floor(depth * 30) - 26;
    crowdRows.push({ y0: startY + row * rowH, h: rowH });
    for (let x = 3 + Math.random() * gap * 0.6; x < W - 3; x += gap * (0.70 + Math.random() * 0.55)){
      let secIdx = 0;
      for (let s = 0; s < crowdSections.length; s++){
        const cs = crowdSections[s];
        if (x >= cs.x && x < cs.x + cs.w){ secIdx = s; break; }
      }
      const sec = crowdSections[secIdx];
      const teamColors = Math.random() < 0.55;
      const rawShirt = teamColors ? shade(sec.color, Math.floor((Math.random() - 0.5) * 50)) : SHIRT_TONES[(Math.random() * SHIRT_TONES.length) | 0];
      const person = {
        x: x + (Math.random() - 0.5) * 3, y: baseY + (Math.random() - 0.5) * 3,
        s: scale * (0.88 + Math.random() * 0.26),
        skin: SKIN_TONES[(Math.random() * SKIN_TONES.length) | 0],
        hair: HAIR_TONES[(Math.random() * HAIR_TONES.length) | 0],
        shirt: shade(rawShirt, dim), hat: Math.random() < 0.11,
        phase: Math.random() * Math.PI * 2
      };
      if (isFront) frontRowPeople.push(person);
      else drawCrowdPerson(c, person, 0);
      crowdDots.push({ x: person.x, y: person.y - 20 * person.s, color: person.shirt });
    }
  }
  for (const sec of crowdSections){
    const n = Math.max(1, Math.round(sec.w / 210));
    for (let i = 0; i < n; i++){
      crowdFlags.push({ x: sec.x + sec.w * (i + 0.5) / n, color: sec.color, phase: Math.random() * Math.PI * 2, w: 46 + Math.random() * 26 });
    }
  }
}

    3: [{homeX: 480, patrol: 120}, {homeX: 850, patrol: 180}, {homeX: 1300, patrol: 280}],
    4: [{homeX: 450, patrol: 90 }, {homeX: 700, patrol: 120}, {homeX: 1000, patrol: 180}, {homeX: 1350, patrol: 280}]
  };
  return patterns[Math.min(n, 4)] || patterns[4];
}
function buildFielders(){

  if (G.mode === 'single' || G.mode === 'online'){
    fielders.push({ homeX: 575, patrol: 175, patrolSpeed: 1.7, patrolPhase: 0, x: 575, color:'#5c9ee0', skin:'#f0c49a', hair:'#3a2416', topSpeed: lv.speed[0], speed: lv.speed[0], runPhase:0, moving:false, facing:-1, isCatcher:false, chasing:false, number:'7', playerName:null });
    fielders.push({ homeX: 1200, patrol: 300, patrolSpeed: 1.3, patrolPhase: Math.PI, x: 1200, color:'#e0a95c', skin:'#c98d5e', hair:'#1a1a1a', topSpeed: lv.speed[1], speed: lv.speed[1], runPhase:0, moving:false, facing:-1, isCatcher:false, chasing:false, number:'9', playerName:null });
  } else {

    fieldingPlayers.forEach((fp, i) => {
      const pos = positions[i];
      const baseSpeed = lv.speed[0] + i * 40;
      fielders.push({
        homeX: pos.homeX, patrol: pos.patrol,
        patrolSpeed: 1.2 + Math.random() * 0.5, patrolPhase: Math.random() * Math.PI * 2,
        x: pos.homeX, color: fp.player.color,
        skin: skins[i % skins.length], hair: hairs[i % hairs.length],
        topSpeed: baseSpeed, speed: baseSpeed,
        runPhase: 0, moving: false, facing: -1, isCatcher: false, chasing: false,
        number: String(i + 1), playerName: fp.player.name, playerIndex: fp.index
      });
    });
  }
}

function prepareTurn(){

function beginBatting(){ G.phase = 'power'; beep(880, 0.10, 'triangle', 0.11); }
function commitName(){

function evalQuality(v){
  if (v>=SWEET_LO && v<=SWEET_HI){ const mid=(SWEET_LO+SWEET_HI)/2; return 0.88 + 0.12*(1-Math.abs(v-mid)/((SWEET_HI-SWEET_LO)/2)); }
  if (v<SWEET_LO) return Math.max(0, 0.88*(v/SWEET_LO));
  return Math.max(0, 0.88*((100-v)/(100-SWEET_HI)));
}
function lockPower(){
  G.quality = evalQuality(G.power);
  G.phase = 'air'; G.swingTimer = G.swingDur;
  gulli.grounded = false;
  gulli.vy = -(760 + G.quality*160);
  gulli.vx = 0;
  gulli.rotV = 9 * (Math.random()<0.5?1:-1);
  G.zonePop = 0;
  beep(320 + G.quality*220, 0.10, 'square', 0.09);
}
function swing(){
  if (gulli.vy <= 0) return;
  const dist = Math.abs(gulli.y - ZONE_Y);
  const acc = clamp(1 - dist/ZONE_R, 0, 1);
  G.accuracy = acc; G.swingTimer = G.swingDur; G.zonePop = 0;
  const shot = SHOTS[G.shotType];
  const power = 0.70 + acc * 0.55;
  const boost = getActiveBoost();
  const boostMul = 1 + boost.bonus;
  gulli.vy = shot.vyBase * power * boostMul;
  gulli.vx = shot.vxBase * power * boostMul;
  gulli.rotV = 20;
  G.phase = 'fly';
  shake = 0.35 + acc * 0.75;
  spawnBurst(gulli.x, gulli.y, acc);
  G.ring = { x:gulli.x, y:gulli.y, t:0, acc };
  const cheerLevel = acc * (G.shotType === 'LOFT' ? 1.4 : G.shotType === 'DRIVE' ? 1.1 : 0.7);
  crowdExcitement = Math.max(crowdExcitement, 0.6 + cheerLevel * 1.0);
  playCheer(0.5 + acc * 0.9);
  if (acc > 0.92) { 
    sweep(900,1800,0.18,'triangle',0.13); 
    G.banner='PERFECT!'; 
    speakVoice("Kamaal ka shot!");
  }
  else if (acc > 0.6) { 
    beep(700,0.12,'triangle',0.11); 
    G.banner='GREAT HIT!'; 
    speakVoice("Dhuandaar hit!");
  }
  else if (acc > 0.25) { 
    beep(500,0.12,'triangle',0.09); 
    G.banner='HIT'; 
    speakVoice("Badiya shot!");
  }
  else { 
    beep(360,0.12,'triangle',0.08); 
    G.banner='WEAK HIT'; 
    speakVoice("Halka shot!");
  }
  G.bannerTimer = 0.9;
}
function missGulli(){
  G.phase='result'; G.resultTimer=2.2; G.hitDistance=0;
  G.outcome='out'; G.outReason='miss';
  G.banner='MISS!'; G.bannerTimer=1.4;
  G.outs++;
  shake = 0.3;
  spawnDust(gulli.x, GROUND_Y);
  beep(180,0.22,'sawtooth',0.09);
  crowdExcitement = 1.0; playCheer(0.6);
  speakVoice("Chook gaye! Out!");
}
function beginFielding(){
  G.hitDistance = Math.max(0, (gulli.x - GULLI_START_X)/PPM);
  G.phase = 'fielding';
  let best=0, bestD=Infinity;
  for (let i=0;i<fielders.length;i++){ const d = Math.abs(fielders[i].x - gulli.x); if (d<bestD){ bestD=d; best=i; } }
  activeFielder = fielders[best];
  activeFielder.moving = true; activeFielder.chasing = true;
  const dist = Math.abs(gulli.x - activeFielder.x);
  activeFielder.catchUpSpeed = Math.min(3000, Math.max(activeFielder.topSpeed, dist / 0.5));
  activeFielder.speed = activeFielder.catchUpSpeed;
}
function finishRound(){
  if (G.outcome === 'out') G.outs++;
  else { const pts = Math.round(G.hitDistance); G.score += pts; if (G.score > G.best) G.best = G.score; }
  G.phase = 'result';
  G.resultTimer = 2.4;
}
function nextRound(){
  if (G.outcome === 'out'){
    if (G.mode === 'single' && ACCOUNT.lives > 0){
      ACCOUNT.lives--;

      G.power=0; G.powerDir=1;
      G.outcome=''; G.outReason='';
      G.phase='power';

    }

  }
  resetGulli(); resetFielders();
  G.power=0; G.powerDir=1;
  G.outcome=''; G.outReason='';
  G.phase='power';
}
function endTurn(){
  G.turnEndTimer = 0;
  G.players[G.currentPlayer].score = G.score;
  G.players[G.currentPlayer].outs = G.outs;

function advanceFromTurnEnd(){
  if (G.mode === 'online'){ reportOnlineScore(G.score); return; }
  if (G.mode === 'single'){
    const lv = getLevel(G.level);
    G.levelCleared = (G.score >= lv.target);
    G.gameOverWinner = G.levelCleared ? 0 : -1;
    G.gameOverMsg = G.levelCleared ? ('LEVEL ' + G.level + ' CLEARED!') : 'LEVEL FAILED';
    G.celebrationTimer = 0; G.confettiTimer = 0;
    const c = calcCoins(G.score, lv.target);
    G.coinsEarned = c.total;
    G.coinsBonus = c.bonus;
    updateStatsSingle(G.score, G.coinsEarned);
    if (G.levelCleared && G.level + 1 > ACCOUNT.highestUnlockedLevel){
      ACCOUNT.highestUnlockedLevel = G.level + 1;
      saveSession(); syncAccountStats();
    }
    setPhase('gameOver');
    if (G.levelCleared){
      crowdExcitement = 2.0; playCheer(1.4);
      beep(1200, 0.2, 'triangle', 0.13);
      setTimeout(()=>beep(1600, 0.2, 'triangle', 0.13), 180);
      setTimeout(()=>beep(2000, 0.25, 'triangle', 0.12), 360);
      if (G.coinsEarned > 0) setTimeout(()=>playCoinSound(), 500);
    } else { crowdExcitement = 0.3; beep(240, 0.3, 'sawtooth', 0.10); }
  } else {
    G.currentPlayer++;
    if (G.currentPlayer >= G.players.length){
      let bestIdx = 0, bestScore = -1;
      for (let i=0; i<G.players.length; i++){ if (G.players[i].score > bestScore){ bestScore = G.players[i].score; bestIdx = i; } }
      G.gameOverWinner = bestIdx;
      G.gameOverMsg = G.players[bestIdx].name + ' WINS!';
      G.celebrationTimer = 0; G.confettiTimer = 0;
      setPhase('gameOver');
      crowdExcitement = 2.0; playCheer(1.6);
      beep(1200, 0.2, 'triangle', 0.14);
      setTimeout(()=>beep(1600, 0.2, 'triangle', 0.14), 180);
      setTimeout(()=>beep(2000, 0.25, 'triangle', 0.13), 360);
      setTimeout(()=>beep(1600, 0.2, 'triangle', 0.13), 540);
    } else { prepareTurn(); }
  }
}

/* ==================== PARTICLES ==================== */
function spawnBurst(x,y,acc){
  const n = 12 + Math.round(acc*16);
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 120 + Math.random()*520*(0.5+acc);
    G.particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 100, life:0.55+Math.random()*0.4, max:0.95, size:2+Math.random()*4.5, c: Math.random()>0.45 ? '#ffd166' : '#ffffff' });
  }
}
function spawnDust(x,y){
  for (let i=0;i<12;i++){ G.particles.push({ x: x+(Math.random()-0.5)*24, y: y-4, vx: (Math.random()-0.5)*220, vy: -Math.random()*170, life: 0.4+Math.random()*0.35, max:0.75, size: 3+Math.random()*5, c:'#c8b48a' }); }
}
function spawnConfetti(){
  for (let i=0; i<4; i++){
    const x = Math.random() * W;
    const size = 4 + Math.random() * 5;
    G.particles.push({ x, y: 130 + Math.random()*60, vx: (Math.random()-0.5) * 100, vy: 60 + Math.random()*140, life: 2.5 + Math.random()*2, max: 4.5, size, c: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)], confetti: true, rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*8 });
  }
}
function spawnCheerParticles(){
  if (crowdDots.length === 0) return;
  const dot = crowdDots[Math.floor(Math.random() * crowdDots.length)];
  G.particles.push({ x: dot.x, y: dot.y - 4, vx: (Math.random() - 0.5) * 50, vy: -80 - Math.random() * 120, life: 0.7 + Math.random() * 0.5, max: 1.2, size: 2 + Math.random() * 3, c: dot.color, cheer: true });
}
function spawnSplashSpark(){
  const a = Math.random() * Math.PI * 2;
  const r = 60 + Math.random() * 320;
  G.particles.push({ x: W/2 + Math.cos(a) * r, y: H/2 + Math.sin(a) * r * 0.5, vx: Math.cos(a) * 20, vy: -30 - Math.random() * 60, life: 0.9 + Math.random() * 0.6, max: 1.5, size: 1.5 + Math.random() * 2.5, c: Math.random() > 0.4 ? '#ffd166' : '#fff6c8', spark: true });
}
function updateParticles(dt){
  for (let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    if (p.confetti) p.vy += 150 * dt;
    else if (p.cheer) p.vy += 180 * dt;
    else if (p.spark) p.vy += 20 * dt;
    else p.vy += 1000 * dt;
    if (p.confetti){ p.vx += Math.sin(performance.now()/300 + i) * 20 * dt; p.rot = (p.rot || 0) + (p.rotV || 0) * dt; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if (p.life<=0 || p.y > H + 60) G.particles.splice(i,1);
  }
  if (G.ring){ G.ring.t += dt*2.6; if (G.ring.t>=1) G.ring=null; }
}

/* ==================== UPDATE ==================== */
function update(dt){
  NET.lastSync = (NET.lastSync || 0) + dt;
  if (NET.lastSync > 0.10 && NET.roomRef && NET.role && G.mode === 'online' && !NET.autopilot){
    NET.lastSync = 0;
    let phaseLabel = G.phase;
    if (G.phase === 'power' || G.phase === 'air') phaseLabel = 'BATTING';
    else if (G.phase === 'fly') phaseLabel = 'HIT!';
    else if (G.phase === 'fielding') phaseLabel = 'FIELDING';
    else if (G.phase === 'throw') phaseLabel = 'THROWING';
    else if (G.phase === 'result') phaseLabel = 'RESULT';
    else if (G.phase === 'turnEnd') phaseLabel = 'INNINGS DONE';
    else if (G.phase === 'waitingOpp') phaseLabel = 'WAITING';
    else if (G.phase === 'turnIntro') phaseLabel = 'GETTING READY';

    const fs = [];
    for (let i = 0; i < fielders.length; i++){
      const f = fielders[i];
      fs.push([
        Math.round(f.x),
        Math.round((f.runPhase || 0) * 100) / 100,
        f.moving ? 1 : 0,
        f.facing > 0 ? 1 : -1,
        Math.round(f.speed || 0),
        f.color || '#5c9ee0',
        f.skin  || '#f0c49a',
        f.hair  || '#3a2416',
        f.number || ''
      ]);
    }

    const skin = getActiveSkin(), danda = getActiveDanda();
    NET.roomRef.child('live/' + NET.role).update({
      ph: G.phase,
      lb: phaseLabel,
      sc: G.score,
      ou: G.outs,
      gx: Math.round(gulli.x),
      gy: Math.round(gulli.y),
      gr: Math.round(gulli.rot * 100) / 100,
      gg: gulli.grounded ? 1 : 0,
      gv: gulli.vy > 0 ? 1 : 0,
      cx: Math.round(camX),
      pw: Math.round(G.power),
      sh: G.shotType,
      bd: Math.round(G.hitDistance || 0),
      bn: G.banner || '',
      bt: Math.round((G.bannerTimer || 0) * 10) / 10,
      oc: G.outcome || '',
      ql: Math.round((G.quality || 0) * 100) / 100,
      sk: skin.color,
      dn: danda.color,
      da: danda.accent,
      nm: NET.myName,
      fs: fs,
      ts: Date.now()
    }).catch(()=>{});
  }

  if (G.bannerTimer>0) G.bannerTimer -= dt;
  if (G.swingTimer>0) G.swingTimer -= dt;
  if (G.marketMsgTimer>0) G.marketMsgTimer -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3.0);
  updateParticles(dt);
  crowdExcitement = Math.max(0, crowdExcitement - dt * 0.7);
  if (crowdExcitement > 0.9 && Math.random() < crowdExcitement * 0.25) spawnCheerParticles();
  if (crowdCanvas && crowdDots.length){
    if (Math.random() < 0.04 + crowdExcitement * 0.55){ const d = crowdDots[(Math.random() * crowdDots.length) | 0]; flashes.push({ x: d.x, y: d.y, life: 0.32, max: 0.32 }); }
    for (let i = flashes.length - 1; i >= 0; i--){ flashes[i].life -= dt; if (flashes[i].life <= 0) flashes.splice(i, 1); }
  }
  if (G.phase === 'splash'){
    G.splashTimer += dt;
    if (Math.random() < 0.7) spawnSplashSpark();
    if (G.splashTimer >= SPLASH_DURATION){
      const session = loadSession();
      if (session){
        if (session.isGuest){
          ACCOUNT.loggedIn = true; ACCOUNT.isGuest = true;
          ACCOUNT.name = session.name || 'GUEST';
          ACCOUNT.highestUnlockedLevel = Math.max(1, session.highestUnlockedLevel || 1);
          ACCOUNT.coins = Math.max(0, session.coins || 0);
          ACCOUNT.lives = Math.max(0, session.lives || 0);
          ACCOUNT.ownedSkins = session.ownedSkins || ['red'];
          ACCOUNT.ownedDandas = session.ownedDandas || ['brown'];
          ACCOUNT.ownedBoosts = session.ownedBoosts || ['normal'];
          ACCOUNT.activeSkin = session.activeSkin || 'red';
          ACCOUNT.activeDanda = session.activeDanda || 'brown';
          ACCOUNT.activeBoost = session.activeBoost || 'normal';
          setPhase('menu');
        } else if (session.username && NET.ready){
          const key = usernameKey(session.username);
          NET.db.ref('accounts/' + key).once('value').then(snap => {
            if (snap.exists()){
              const data = snap.val();
              ACCOUNT.username = data.username || session.username;
              ACCOUNT.name = data.name || ACCOUNT.username;
              ACCOUNT.passwordHash = data.passwordHash;
              ACCOUNT.bestSingle = data.bestSingle || 0;
              ACCOUNT.bestOnline = data.bestOnline || 0;
              ACCOUNT.matchesPlayed = data.matchesPlayed || 0;
              ACCOUNT.onlineMatches = data.onlineMatches || 0;
              ACCOUNT.wins = data.wins || 0;
              ACCOUNT.losses = data.losses || 0;
              ACCOUNT.totalRuns = data.totalRuns || 0;
              ACCOUNT.highestUnlockedLevel = Math.max(1, data.highestUnlockedLevel || 1);
              ACCOUNT.coins = Math.max(0, data.coins || 0);
              ACCOUNT.lives = Math.max(0, data.lives || 0);
              ACCOUNT.ownedSkins = data.ownedSkins || ['red'];
              ACCOUNT.ownedDandas = data.ownedDandas || ['brown'];
              ACCOUNT.ownedBoosts = data.ownedBoosts || ['normal'];
              ACCOUNT.activeSkin = data.activeSkin || 'red';
              ACCOUNT.activeDanda = data.activeDanda || 'brown';
              ACCOUNT.activeBoost = data.activeBoost || 'normal';
              ACCOUNT.loggedIn = true; ACCOUNT.isGuest = false;
              setPhase('menu');
            } else { setPhase('login'); }
          }).catch(()=>{ setPhase('login'); });
        } else { setPhase('login'); }
      } else { setPhase('login'); }
      beep(880, 0.1, 'triangle', 0.08);
    }
    return;
  }

  if (G.phase === 'searching' && NET.searching){
    const elapsed = performance.now() - NET.searchStart;
    const remaining = Math.max(0, 30 - Math.floor(elapsed / 1000));
    NET.statusMsg = remaining > 0
      ? 'Searching... Auto-pilot in ' + remaining + 's'
      : 'Starting auto-pilot...';
    if (elapsed >= 30000){
      startAutopilotMode();
      return;
    }
  }

  if (NET.joinPopupTimer > 0){
    NET.joinPopupTimer -= dt;
    if (NET.joinPopupTimer <= 0){ NET.joinPopup = null; NET.joinPopupTimer = 0; }
  }

  NET.forfeitTimer += dt;
  if (NET.forfeitTimer > 1){ NET.forfeitTimer = 0; checkOppForfeit(); }

  if (G.phase === 'turnEnd' && G.mode === 'online'){
    G.turnEndTimer = (G.turnEndTimer || 0) + dt;
    if (G.turnEndTimer >= 2.2){ G.turnEndTimer = 0; advanceFromTurnEnd(); return; }
  }

  if (G.phase === 'botBatting'){
    G.botBattingTimer -= dt;
    if (G.botBattingTimer <= 0){ finishBotMatch(); }
    return;
  }

  if (G.phase === 'searching' || G.phase === 'waitingOpp' || G.phase === 'market'){ return; }
  if (G.phase === 'toss'){
    if (performance.now() - NET.tossStartTime > TOSS_DURATION){ NET.tossResultStart = performance.now(); setPhase('tossResult'); }
    return;
  }
  if (G.phase === 'tossResult'){
    if (performance.now() - NET.tossResultStart > TOSS_RESULT_DURATION){
      if (NET.tossWinner === NET.role) beginOnlineTurn();
      else setPhase('waitingOpp');
    }
    return;
  }
  if (G.phase==='turnEnd' || G.phase==='gameOver' || G.phase==='turnIntro'
      || G.phase==='menu' || G.phase==='levelSelect' || G.phase==='playerSelect'
      || G.phase==='nameEntry' || G.phase==='login' || G.phase==='register' || G.phase==='guest'
      || G.phase==='leaderboard' || G.phase==='profileView'){
    camX += (0 - camX) * Math.min(1, dt*3);
    if (G.phase === 'gameOver'){ G.celebrationTimer += dt; G.confettiTimer += dt; if (G.confettiTimer > 0.06){ G.confettiTimer = 0; spawnConfetti(); } }
    return;
  }
  let camTarget = 0;
  if (G.phase==='fly') camTarget = Math.max(0, gulli.x - W*0.35);
  else if ((G.phase==='fielding'||G.phase==='throw') && activeFielder) camTarget = Math.max(0, activeFielder.x - W*0.5);
  camX += (camTarget - camX) * Math.min(1, dt*5);
  for (const f of fielders){
    if (f.chasing) continue;
    f.patrolPhase += dt * f.patrolSpeed;
    f.x = f.homeX + Math.sin(f.patrolPhase) * f.patrol;
    f.facing = Math.cos(f.patrolPhase) > 0 ? 1 : -1;
    if (Math.abs(Math.cos(f.patrolPhase)) > 0.15){ f.moving = true; f.runPhase += dt * 12; f.speed = 180; }
    else { f.moving = false; f.runPhase = 0; f.speed = 0; }
  }
  switch (G.phase){
    case 'power':
      G.power += G.powerDir*128*dt;
      if (G.power>=100){G.power=100;G.powerDir=-1;}
      if (G.power<=0) {G.power=0; G.powerDir=1;}
      break;
    case 'air': {
      gulli.vy += GRAV*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
      if (gulli.vy>0) G.zonePop = Math.min(1, G.zonePop + dt*6);
      if (gulli.y > GROUND_Y-7){ gulli.y = GROUND_Y-7; gulli.grounded = true; missGulli(); }
      break;
    }
    case 'fly': {
      gulli.vy += GRAV*dt; gulli.x += gulli.vx*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
      const y0 = gulli.y, vy0 = gulli.vy;
      const targetY = GROUND_Y - 7;
      const disc = vy0*vy0 + 2*GRAV*(targetY - y0);
      if (disc > 0 && gulli.vx !== 0){
        const tLand = (-vy0 + Math.sqrt(disc)) / GRAV;
        if (tLand > 0 && tLand < 6){
          const landingX = gulli.x + gulli.vx * tLand;
          for (const f of fielders){
            const dx = landingX - f.x;
            const adist = Math.abs(dx);
            if (adist > 8){
              const spd = Math.min(f.topSpeed * 1.5, 1700);
              const step = Math.min(spd * dt, adist);
              f.x += Math.sign(dx) * step;
              f.moving = true; f.facing = Math.sign(dx);
              f.runPhase += dt * 18; f.speed = spd;
            }
          }
        }
      }
      if (!gulli.grounded){
        const hAbove = GROUND_Y - gulli.y;
        if (hAbove > 80 && hAbove < 280){
          for (const f of fielders){
            if (Math.abs(f.x - gulli.x) < 46){
              f.isCatcher = true;
              G.outcome='out'; G.outReason='caught';
              G.hitDistance = Math.max(0, (gulli.x-GULLI_START_X)/PPM);
              G.banner='CAUGHT!'; G.bannerTimer=1.6;
              shake = 0.6; spawnBurst(gulli.x, gulli.y, 1);
              sweep(500,120,0.35,'sawtooth',0.13);
              crowdExcitement = 1.8; playCheer(1.3);
              speakVoice("Lapak liya! Catch out!");
              finishRound(); return;
            }
          }
        }
      }
      if (gulli.y > GROUND_Y-7){
        gulli.y = GROUND_Y-7;
        if (Math.abs(gulli.vy)>230){ gulli.vy = -Math.abs(gulli.vy)*0.42; gulli.vx *= 0.80; spawnDust(gulli.x, GROUND_Y); beep(240,0.06,'sine',0.05); }
        else { gulli.vy = 0; gulli.vx *= Math.pow(0.012, dt); gulli.rotV *= Math.pow(0.05, dt); if (Math.abs(gulli.vx)<28){ gulli.vx=0; beginFielding(); } }
      }
      break;
    }
    case 'fielding': {
      if (!activeFielder){ beginFielding(); break; }
      const dx = gulli.x - activeFielder.x;
      const distToBall = Math.abs(dx);
      if (distToBall > 22){
        const minSpeed = distToBall / 0.5;
        const targetSpd = Math.max(activeFielder.topSpeed, minSpeed);
        activeFielder.speed += (targetSpd - activeFielder.speed) * Math.min(1, dt*25);
        const dir = Math.sign(dx);
        const step = Math.min(activeFielder.speed * dt, distToBall - 22);
        if (step > 0) activeFielder.x += dir * step;
        activeFielder.moving = true; activeFielder.facing = dir;
        activeFielder.runPhase += dt * (activeFielder.speed / 22);
      } else {
        activeFielder.moving = false; activeFielder.runPhase = 0;
        G.phase = 'throw'; throwTimer = 0.35; throwLaunched = false;
        beep(520,0.08,'triangle',0.08);
      }
      break;
    }
    case 'throw': {
      if (!throwLaunched){
        throwTimer -= dt;
        if (throwTimer<=0){
          const sx = activeFielder.x, sy = GROUND_Y - 92;
          const dist = Math.abs(sx - DANDA_X);
          const baseError = G.throwErrorBase + dist*0.07;
          const err = (Math.random()*2-1)*baseError;
          const target = DANDA_X + err;
          const T = clamp(dist/900, 0.55, 1.55);
          gulli.x = sx; gulli.y = sy;
          gulli.vx = (target - sx)/T;
          gulli.vy = (GROUND_Y-7 - sy - 0.5*GRAV*T*T)/T;
          gulli.rotV = 14; gulli.grounded = false;
          throwLaunched = true;
          beep(620,0.08,'square',0.09);
        }
      } else {
        gulli.vy += GRAV*dt; gulli.x += gulli.vx*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
        if (gulli.y > GROUND_Y-7){
          gulli.y = GROUND_Y-7; gulli.vy = 0; gulli.vx = 0;
          const diff = Math.abs(gulli.x - DANDA_X);
          if (diff < 40){
            G.outcome='out'; G.outReason='danda'; G.banner='OUT!';
            shake = 0.7; spawnBurst(DANDA_X, GROUND_Y-24, 1);
            sweep(760,140,0.38,'sawtooth',0.14); beep(120,0.4,'sawtooth',0.10);
            crowdExcitement = 1.6; playCheer(1.1);
            speakVoice("Seedha dande pe! Wicket!");
          } else {
            G.outcome='safe'; G.outReason=''; G.banner='SAFE!';
            spawnDust(gulli.x, GROUND_Y);
            beep(880,0.14,'triangle',0.11); beep(1180,0.14,'triangle',0.08);
            crowdExcitement = 0.5;
            speakVoice("Bach gaye! Not out!");
          }
          G.bannerTimer = 1.6;
          finishRound();
        }
      }
      break;
    }
    case 'result':
      G.resultTimer -= dt;
      if (G.resultTimer<=0) nextRound();
      break;
  }
}

function onInput(e){
  if (!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(err){} }
  if (G.phase === 'splash'){ if (G.splashTimer > 0.7){ G.splashTimer = SPLASH_DURATION; } return; }

  if (G.phase === 'toss' || G.phase === 'tossResult'){ return; }
  if (G.phase === 'botBatting') return;
  if (G.phase==='menu' || G.phase==='levelSelect' || G.phase==='playerSelect'
      || G.phase==='turnIntro' || G.phase==='turnEnd' || G.phase==='gameOver'
      || G.phase==='login' || G.phase==='register' || G.phase==='guest' || G.phase==='leaderboard'
      || G.phase==='profileView' || G.phase==='searching' || G.phase==='market'){
    if (e){ const {x,y} = canvasCoordsFromEvent(e); handleMenuClick(x, y); }
    return;
  }
  if (G.phase === 'waitingOpp') return;
  if (G.phase === 'nameEntry'){ if (e) commitName(); return; }
  const canPickShot = (G.phase==='power' || G.phase==='air');
  if (canPickShot && e){
    const {x,y} = canvasCoordsFromEvent(e);
    for (const b of shotButtons){ if (pointInButton(x,y,b)){ setShot(b.id); return; } }
  }
  switch (G.phase){
    case 'power': lockPower(); break;
    case 'air': swing(); break;
    case 'result': if (G.resultTimer<1.4) G.resultTimer=0; break;
  }
}
function handleNameEntryKey(e){
  if (e.key === 'Enter'){ commitName(); e.preventDefault(); return; }
  if (e.key === 'Backspace'){ G.nameEntry.currentText = G.nameEntry.currentText.slice(0, -1); e.preventDefault(); return; }
  if (e.key === 'Escape'){ setPhase('menu'); e.preventDefault(); return; }
  if (e.key.length === 1 && /[A-Za-z0-9 _-]/.test(e.key) && G.nameEntry.currentText.length < 10){ G.nameEntry.currentText += e.key.toUpperCase(); e.preventDefault(); }
}
function handleAuthKey(e){
  const focus = ACCOUNT.formFocus;
  if (e.key === 'Escape'){ setPhase('menu'); e.preventDefault(); return; }
  if (e.key === 'Tab'){
    if (G.phase === 'register'){ if (focus === 'username'){ ACCOUNT.formFocus = 'password'; suggestionsOpen = false; } else if (focus === 'password'){ ACCOUNT.formFocus = 'username'; suggestionsOpen = true; if (ACCOUNT.formUsername.length >= 2) onUsernameChange(); } }
    else if (G.phase === 'login'){ ACCOUNT.formFocus = focus === 'username' ? 'password' : 'username'; suggestionsOpen = (ACCOUNT.formFocus === 'username'); if (suggestionsOpen && ACCOUNT.formUsername.length >= 2) onUsernameChange(); }
    openMobileKeyboard(); e.preventDefault(); return;
  }
  if (e.key === 'Enter'){
    if (G.phase === 'login'){ loginUserAccount(ACCOUNT.formUsername, ACCOUNT.formPassword); }
    else if (G.phase === 'register'){ registerUserAccount(ACCOUNT.formUsername, ACCOUNT.formPassword); }
    else if (G.phase === 'guest'){ guestLogin(ACCOUNT.formName); }
    e.preventDefault(); return;
  }
  if (e.key === 'Backspace'){
    if (focus === 'username'){ ACCOUNT.formUsername = ACCOUNT.formUsername.slice(0, -1); onUsernameChange(); }
    else if (focus === 'password'){ ACCOUNT.formPassword = ACCOUNT.formPassword.slice(0, -1); }
    else if (focus === 'guestName'){ ACCOUNT.formName = ACCOUNT.formName.slice(0, -1); }
    e.preventDefault(); return;
  }
  if (e.key.length === 1){
    if (focus === 'username' && /[A-Za-z0-9_]/.test(e.key) && ACCOUNT.formUsername.length < 15){ ACCOUNT.formUsername += e.key.toUpperCase(); onUsernameChange(); e.preventDefault(); }
    else if (focus === 'password' && ACCOUNT.formPassword.length < 20){ ACCOUNT.formPassword += e.key; e.preventDefault(); }
    else if (focus === 'guestName' && /[A-Za-z0-9 _-]/.test(e.key) && ACCOUNT.formName.length < 12){ ACCOUNT.formName += e.key.toUpperCase(); e.preventDefault(); }
  }
}
window.addEventListener('keydown', e=>{
  if (G.phase === 'splash'){ if (e.code==='Space'||e.code==='Enter'||e.key===' '){ onInput(null); e.preventDefault(); } return; }
  if (G.phase === 'login' || G.phase === 'register' || G.phase === 'guest'){ handleAuthKey(e); return; }
  if (G.phase === 'toss' || G.phase === 'tossResult'){ return; }
  if (G.phase === 'searching'){ if (e.key==='Escape'){ NET.searching = false; cleanupOnline(); setPhase('menu'); e.preventDefault(); } return; }
  if (G.phase === 'waitingOpp'){ return; }
  if (G.phase === 'botBatting'){ return; }
  if (G.phase === 'nameEntry'){ handleNameEntryKey(e); return; }
  if (G.phase === 'menu'){
    if (e.key==='1'){ setPhase('levelSelect'); e.preventDefault(); return; }
    if (e.key==='2'){ setPhase('playerSelect'); e.preventDefault(); return; }
    if (e.key==='3'){ startOnlineMatchmaking(); e.preventDefault(); return; }
    if (e.key==='4'){ setPhase('market'); e.preventDefault(); return; }
    if (e.key==='5'){ LEADERBOARD.data = null; fetchLeaderboard(); setPhase('leaderboard'); e.preventDefault(); return; }
    if (e.key==='p' || e.key==='P'){ setPhase('profileView'); e.preventDefault(); return; }
    if (e.key==='l' || e.key==='L'){ cleanupOnline(); logoutUser(); e.preventDefault(); return; }
  }
  if (G.phase === 'market'){
    if (e.key==='Escape'){ setPhase('menu'); e.preventDefault(); return; }
    if (e.key==='1'){ G.marketTab = 'skins'; e.preventDefault(); return; }
    if (e.key==='2'){ G.marketTab = 'dandas'; e.preventDefault(); return; }
    if (e.key==='3'){ G.marketTab = 'boosts'; e.preventDefault(); return; }
    if (e.key==='4'){ G.marketTab = 'lives'; e.preventDefault(); return; }
  }
  if (G.phase === 'levelSelect'){
    if (e.key>='1' && e.key<='5'){
      const lvlNum = (G.levelPage || 0) * 5 + parseInt(e.key, 10);
      if (lvlNum > ACCOUNT.highestUnlockedLevel){ G.banner = 'LOCKED — CLEAR LEVEL ' + (lvlNum-1) + ' FIRST'; G.bannerTimer = 2.2; beep(200, 0.2, 'sawtooth', 0.10); e.preventDefault(); return; }
      startSinglePlayer(lvlNum); e.preventDefault(); return;
    }
    if (e.key==='ArrowLeft'){ G.levelPage = Math.max(0, (G.levelPage||0) - 1); rebuildMenuButtons(); e.preventDefault(); return; }
    if (e.key==='ArrowRight'){ G.levelPage = (G.levelPage||0) + 1; rebuildMenuButtons(); e.preventDefault(); return; }
    if (e.key==='Escape'){ setPhase('menu'); e.preventDefault(); return; }
  }
  if (G.phase === 'playerSelect'){
    if (e.key>='2' && e.key<='5'){ startMultiPlayer(parseInt(e.key,10)); e.preventDefault(); return; }
    if (e.key==='Escape'){ setPhase('menu'); e.preventDefault(); return; }
  }
  if (G.phase === 'leaderboard' || G.phase === 'profileView'){ if (e.key==='Escape'){ setPhase('menu'); e.preventDefault(); return; } }
  if (e.code==='Space' || e.code==='Enter'){ if (G.phase==='turnIntro'){ beginBatting(); e.preventDefault(); return; } if (G.phase==='turnEnd'){ advanceFromTurnEnd(); e.preventDefault(); return; } }
  if (G.phase==='gameOver' && (e.code==='Space'||e.code==='Enter')){
    if (G.mode==='onlineResults'){ cleanupOnline(); startOnlineMatchmaking(); e.preventDefault(); return; }
    if (G.mode==='single'){
      if (G.levelCleared){ const next = G.level + 1; if (next <= ACCOUNT.highestUnlockedLevel) startSinglePlayer(next); }
      else startSinglePlayer(G.level);
    } else { startMultiPlayer(G.players.length); }
    e.preventDefault(); return;
  }
  if (e.key==='1'){ setShot('PUSH');  e.preventDefault(); return; }
  if (e.key==='2'){ setShot('DRIVE'); e.preventDefault(); return; }
  if (e.key==='3'){ setShot('LOFT');  e.preventDefault(); return; }
  if (e.key==='ArrowLeft' || e.key==='ArrowRight'){
    const order = ['PUSH','DRIVE','LOFT'];
    let i = order.indexOf(G.shotType);
    i = e.key==='ArrowLeft' ? (i+order.length-1)%order.length : (i+1)%order.length;
    setShot(order[i]); e.preventDefault(); return;
  }
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.key===' '){ e.preventDefault(); onInput(null); }
});

function dandaAngle(){
  if (G.swingTimer>0){ 
    const t = 1 - G.swingTimer/G.swingDur;

  }
  return 0.72;
}

/* ==================== REALISTIC BATTER ANIMATION ==================== */
function drawPlayer(){
  const x = PLAYER_X - camX, y = GROUND_Y;
  const danda = getActiveDanda();
  const pcolor = G.players[G.currentPlayer] ? G.players[G.currentPlayer].color : '#e63946';

  let swingProgress = 0;
  if (G.swingTimer > 0) {
    swingProgress = 1 - (G.swingTimer / G.swingDur);
  }
  
  const lean = swingProgress > 0 ? Math.sin(swingProgress * Math.PI) * 16 : 0;
  const hipY = y - 70;
  const shoulderX = x + lean * 0.9;
  const shoulderY = y - 126 + Math.abs(lean) * 0.35;
  const headY = shoulderY - 21;

  ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse
ctx.beginPath(); ctx.ellipse(x + lean * 0.5, y + 3, 38 + Math.abs(lean), 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  // Dynamic Legs with Weight Transfer
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2d3142'; ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(x, hipY); ctx.lineTo(x - 22, y - 2);            // Back foot anchor
  ctx.moveTo(x, hipY); ctx.lineTo(x + 18 + lean, y - 2);     // Front lead foot step
  ctx.stroke();

  // Torso Rotation with Core Shift
  ctx.strokeStyle = pcolor; ctx.lineWidth = 19;
  ctx.beginPath(); ctx.moveTo(x, hipY); ctx.lineTo(shoulderX, shoulderY); ctx.stroke();

  // Head and Cap
  ctx.fillStyle = '#f0c49a';
  ctx.beginPath(); ctx.arc(shoulderX, headY, 19, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2d3142'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = '#2d3142';
  ctx.beginPath(); ctx.arc(shoulderX, headY - 3, 19, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();

  // Player Name Tag in Multiplayer
  if ((G.mode === 'multi' || G.mode === 'online' || G.mode === 'onlineResults') && G.players[G.currentPlayer]){
    const p = G.players[G.currentPlayer];
    ctx.save();
    ctx.font = '700 11px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(p.name).width;
    const pillW = tw + 14, pillH = 17;
    const pillY = headY - 19 - 32;
    rr(ctx, shoulderX - pillW/2, pillY, pillW, pillH, 8);
    ctx.fillStyle = 'rgba(20,25,40,0.8)'; ctx.fill();
    ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText(p.name, shoulderX, pillY + pillH/2);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  // Batting Arm and Danda Follow-Through
  if (G.phase!=='fielding' && G.phase!=='throw' && G.phase!=='turnIntro' && G.phase!=='turnEnd' && G.phase!=='gameOver' && G.phase!=='nameEntry' && G.phase!=='splash' && G.phase!=='waitingOpp' && G.phase!=='toss' && G.phase!=='tossResult' && G.phase!=='login' && G.phase!=='register' && G.phase!=='guest' && G.phase!=='leaderboard' && G.phase!=='profileView' && G.phase!=='market' && G.phase!=='botBatting'){
    const ang = dandaAngle();
    const handX = shoulderX + 8 + (lean * 0.4);
    const handY = shoulderY + 7;
    ctx.save(); ctx.translate(handX, handY); ctx.rotate(ang);

    // Forearm
    ctx.strokeStyle = '#2d3142'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(-6, -2); ctx.lineTo(24, 7); ctx.stroke();

    // Danda Barrel
    ctx.lineCap = 'round';
    ctx.strokeStyle = danda.color; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(18, 7); ctx.lineTo(122, 7); ctx.stroke();
    ctx.strokeStyle = danda.accent;
    ctx.beginPath(); ctx.moveTo(106, 7); ctx.lineTo(122, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, 7);  ctx.lineTo(26, 7);  ctx.stroke();
    ctx.restore();
  } else {
    // Resting Stance
    ctx.strokeStyle = '#2d3142'; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(shoulderX + 4, shoulderY + 4); ctx.lineTo(shoulderX + 26, shoulderY + 30);
    ctx.stroke();
  }
}

function drawFielder(f){
  const x = f.x - camX;
  if (x < -80 || x > W+80) return;
  const y = GROUND_Y;
  const dir = f.facing || 1;
  const speedFactor = clamp(f.speed / (f.topSpeed||1), 0, 1);
  if (f.moving && speedFactor > 0.7 && Math.random() < 0.35){
    G.particles.push({ x: f.x - dir*14, y: y - 4, vx: -dir*(40+Math.random()*60), vy: -30-Math.random()*60, life: 0.35, max: 0.35, size: 2+Math.random()*3, c: '#d4c096' });
  }
  ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x, y+3, 22, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  const bobAmp = 2 + speedFactor*3;
  const bob = f.moving ? Math.sin(f.runPhase*2) * bobAmp : 0;
  const hipY = y-58+bob, shoulderY = y-100+bob, headY = y-120+bob;
  const headR = 15;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#3a4152'; ctx.lineWidth=6;
  ctx.beginPath();
  if (f.moving){
    const sw = Math.sin(f.runPhase) * (8 + speedFactor*10);
    ctx.moveTo(x, hipY); ctx.lineTo(x - 12 + sw, y - 2);
    ctx.moveTo(x, hipY); ctx.lineTo(x + 12 - sw, y - 2);
  } else { ctx.moveTo(x, hipY); ctx.lineTo(x - 12, y - 2); ctx.moveTo(x, hipY); ctx.lineTo(x + 12, y - 2); }
  ctx.stroke();
  ctx.fillStyle = '#1a1a1a';
  const shoeL = f.moving ? Math.sin(f.runPhase)*(8+speedFactor*10) : 0;
  const shoeR = f.moving ? -Math.sin(f.runPhase)*(8+speedFactor*10) : 0;
  rr(ctx, x - 18 + shoeL, y - 5, 14, 6, 3); ctx.fill();
  rr(ctx, x + 4 + shoeR,  y - 5, 14, 6, 3); ctx.fill();
  ctx.strokeStyle=f.color; ctx.lineWidth=17;
  ctx.beginPath(); ctx.moveTo(x,hipY); ctx.lineTo(x,shoulderY); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=4;

  ctx.beginPath(); ctx.ellipse(x - headR*0.85, headY - 2, 3.5, 6, 0.2, 0, Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.ellipse(x + 4.5 + fdx*0.4, eyeY, 2.4, 2.1, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(x - 4.5 + fdx*0.4 + dir*0.7, eyeY, 1.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4.5 + fdx*0.4 + dir*0.7, eyeY, 1.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle=f.color;
  ctx.beginPath(); ctx.arc(x, headY - 3, headR * 0.95, Math.PI*1.05, Math.PI*1.95); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';

  if (f === activeFielder && (G.phase==='fielding'||G.phase==='throw')){
    const pulse = 0.5 + 0.5*Math.sin(performance.now()/150);
    ctx.save(); ctx.globalAlpha = 0.4 + pulse*0.5;

function drawZone(){

function drawEffects(){
  for (const p of G.particles){
    const a = clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    if (p.confetti){
      ctx.save(); ctx.translate(p.x-camX, p.y); ctx.rotate(p.rot || 0);
      ctx.fillStyle = p.c; ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2); ctx.restore();
    } else if (p.spark){
      ctx.fillStyle = p.c;
      const s = p.size * (0.4 + a * 0.6);
      ctx.beginPath();
      ctx.moveTo(p.x-camX, p.y - s*2);
      ctx.lineTo(p.x-camX + s*0.5, p.y - s*0.5);
      ctx.lineTo(p.x-camX + s*2, p.y);
      ctx.lineTo(p.x-camX + s*0.5, p.y + s*0.5);
      ctx.lineTo(p.x-camX, p.y + s*2);
      ctx.lineTo(p.x-camX - s*0.5, p.y + s*0.5);
      ctx.lineTo(p.x-camX - s*2, p.y);
      ctx.lineTo(p.x-camX - s*0.5, p.y - s*0.5);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x-camX, p.y, p.size*a, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  if (G.ring){
    const t=G.ring.t;
    ctx.save(); ctx.globalAlpha=(1-t)*0.85;
    ctx.strokeStyle = G.ring.acc>0.9 ? '#ffd166' : '#ffffff';
    ctx.lineWidth = 6*(1-t)+1;
    ctx.beginPath(); ctx.arc(G.ring.x-camX, G.ring.y, 20+t*110, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawStickers(dt){
  for (let i = activeStickers.length - 1; i >= 0; i--){
    const s = activeStickers[i];
    s.y += s.vy * dt;
    s.life -= dt;
    s.scale = Math.min(1.4, s.scale + dt * 3.5);
    const alpha = clamp(s.life / 0.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${Math.round(44 * s.scale)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.emoji, s.x, s.y);
    ctx.restore();
    if (s.life <= 0) activeStickers.splice(i, 1);
  }
}

  ctx.fillStyle=color;
  ctx.fillText(text, W/2, y);

function drawStar(cx, cy, outer, inner, points){
  ctx.beginPath();
  for (let i=0; i<points*2; i++){
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / points) * i - Math.PI/2;
    const x = cx + Math.cos(a) * r; const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

function drawMarketItem(rect, item, opts){

  const affordable = ACCOUNT.coins >= item.price;

  ctx.save();
  rr(ctx, x, y, w, h, 14);
  const grd = ctx.createLinearGradient(x, y, x, y+h);
  if (active){
    grd.addColorStop(0, 'rgba(138,255,160,0.25)');
    grd.addColorStop(1, 'rgba(138,255,160,0.06)');
  } else if (owned){
    grd.addColorStop(0, 'rgba(255,209,102,0.20)');
    grd.addColorStop(1, 'rgba(255,209,102,0.05)');

    grd.addColorStop(0, 'rgba(92,158,224,0.18)');
    grd.addColorStop(1, 'rgba(92,158,224,0.05)');
  } else {
    grd.addColorStop(0, 'rgba(20,25,40,0.75)');
    grd.addColorStop(1, 'rgba(20,25,40,0.55)');
  }
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = active ? '#8affa0' : owned ? '#ffd166' : affordable ? '#5c9ee0' : 'rgba(255,255,255,0.15)';

function drawSpectatorScene(live, dt){
  if (!live || !live.ph){
    ctx.fillStyle = 'rgba(12,16,28,0.92)';
    ctx.fillRect(0,0,W,H);
    const dots = '.'.repeat(1 + (Math.floor(performance.now()/400) % 3));
    centerText('Connecting to opponent stream' + dots, H/2, 22, 'rgba(255,255,255,0.75)');
    return;
  }

  if (!SPEC.ready){
    SPEC.gx = SPEC.tgx = live.gx || 0;
    SPEC.gy = SPEC.tgy = live.gy || (GROUND_Y - 7);
    SPEC.gr = SPEC.tgr = live.gr || 0;
    SPEC.cx = SPEC.tcx = live.cx || 0;
    SPEC.ready = true;
  }
  SPEC.tgx = live.gx || 0;
  SPEC.tgy = live.gy || (GROUND_Y - 7);
  SPEC.tgr = live.gr || 0;
  SPEC.tcx = live.cx || 0;

  const k = Math.min(1, dt * 20);
  SPEC.gx += (SPEC.tgx - SPEC.gx) * k;
  SPEC.gy += (SPEC.tgy - SPEC.gy) * k;
  SPEC.gr += (SPEC.tgr - SPEC.gr) * k;
  SPEC.cx += (SPEC.tcx - SPEC.cx) * Math.min(1, dt * 10);

  const fList = live.fs || [];
  for (let i = 0; i < fList.length; i++){
    const tx = fList[i][0] || 0;
    if (SPEC.fX[i] === undefined) SPEC.fX[i] = tx;
    else SPEC.fX[i] += (tx - SPEC.fX[i]) * k;
  }
  SPEC.fX.length = fList.length;

  const bakCamX = camX;
  const bakFielders = fielders.slice();
  const bakGulli = { x:gulli.x, y:gulli.y, vx:gulli.vx, vy:gulli.vy, rot:gulli.rot, rotV:gulli.rotV, grounded:gulli.grounded };
  const bakPlayers = G.players, bakCurrent = G.currentPlayer;
  const bakParticles = G.particles, bakRing = G.ring;
  const bakBanner = G.banner, bakBannerT = G.bannerTimer;
  const bakPhase = G.phase, bakPower = G.power, bakShot = G.shotType;
  const bakHit = G.hitDistance, bakOutcome = G.outcome, bakZonePop = G.zonePop;
  const bakOn = SPEC_ON, bakSkin = SPEC_SKIN, bakDanda = SPEC_DANDA;

  camX = SPEC.cx;
  fielders.length = 0;
  for (let i = 0; i < fList.length; i++){
    const f = fList[i];
    fielders.push({
      homeX: f[0], x: SPEC.fX[i] !== undefined ? SPEC.fX[i] : f[0],
      patrol: 0, patrolSpeed: 0, patrolPhase: 0,
      color: f[5] || '#5c9ee0', skin: f[6] || '#f0c49a', hair: f[7] || '#3a2416',
      topSpeed: 700, speed: f[4] || 0,
      runPhase: f[1] || 0, moving: !!f[2], facing: f[3] > 0 ? 1 : -1,
      isCatcher: false, chasing: false, number: f[8] || '', playerName: null
    });
  }
  gulli.x = SPEC.gx;
  gulli.y = SPEC.gy;
  gulli.rot = SPEC.gr;
  gulli.vx = 0;
  gulli.vy = live.gv ? 120 : 0;
  gulli.grounded = live.gg !== 0;
  G.players = [{ name: live.nm || NET.oppName || 'OPPONENT', color: live.sk || '#3a86ff' }];
  G.currentPlayer = 0;
  G.particles = [];
  G.ring = null;
  G.banner = live.bn || '';
  G.bannerTimer = live.bt || 0;
  G.phase = live.ph || 'power';
  G.power = live.pw || 0;
  G.shotType = live.sh || 'DRIVE';
  G.hitDistance = live.bd || 0;
  G.outcome = live.oc || '';
  G.zonePop = 0.6;
  SPEC_ON = true;
  SPEC_SKIN = { id:'spec', name:'', color: live.sk || '#3a86ff', price:0 };
  SPEC_DANDA = { id:'spec', name:'', color: live.dn || '#b07c42', accent: live.da || '#8a5a2b', price:0 };

  try {
    drawSky();
    drawStadium();
    drawField();
    drawDistanceMarkers();
    if (G.phase === 'fielding' || G.phase === 'throw' || G.phase === 'result') drawDandaOnGround();
    drawZone();
    for (const f of fielders) drawFielder(f);
    drawGulli();
    drawPlayer();
    drawPowerMeter('OPPONENT BATTING');
    drawShotSelector(true);
    if (G.bannerTimer > 0 && G.banner){
      let c = '#ffffff';
      if (G.banner === 'MISS!' || G.banner === 'OUT!' || G.banner === 'CAUGHT!') c = '#ff8a8a';
      else if (G.banner === 'PERFECT!') c = '#ffd166';
      else if (G.banner === 'SAFE!') c = '#8affa0';
      centerText(G.banner, 380, 54, c);
    }
    if (G.phase === 'air' && live.gv) centerText('HIT NOW!', 372, 22, '#ffd166');
    if (G.phase === 'fly') centerText(Math.round(G.hitDistance) + ' m', 350, 44, '#ffffff');
    if (G.phase === 'fielding') centerText('FIELDING…', 380, 18, 'rgba(255,255,255,0.9)');
    if (G.phase === 'throw') centerText('THROWING AT THE DANDA!', 380, 18, 'rgba(255,209,102,0.95)');
  } finally {
    camX = bakCamX;
    fielders.length = 0; for (const f of bakFielders) fielders.push(f);
    Object.assign(gulli, bakGulli);
    G.players = bakPlayers; G.currentPlayer = bakCurrent;
    G.particles = bakParticles; G.ring = bakRing;
    G.banner = bakBanner; G.bannerTimer = bakBannerT;
    G.phase = bakPhase; G.power = bakPower; G.shotType = bakShot;
    G.hitDistance = bakHit; G.outcome = bakOutcome; G.zonePop = bakZonePop;
    SPEC_ON = bakOn; SPEC_SKIN = bakSkin; SPEC_DANDA = bakDanda;
  }
}
