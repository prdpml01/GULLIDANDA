function initFirebase(){
  try {
    if (typeof firebase === 'undefined') return false;
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    NET.db = firebase.database();
    NET.ready = true;

function genRoomId(){ return 'GD-' + Math.random().toString(36).slice(2,7).toUpperCase(); }

function startOnlineMatchmaking(){
  if (!ACCOUNT.loggedIn){ setPhase('login'); return; }
  NET.myName = ACCOUNT.name;
  NET.myDone = false; NET.oppDone = false; NET.oppScore = null; NET.oppName = '';
  NET.oppLive = null;
  NET.tossWinner = null; NET.currentBatsman = null;
  NET.tossDecided = false; NET.turnHandedOver = false;
  if (!NET.ready && !initFirebase()){ G.banner = 'NETWORK ERROR'; G.bannerTimer = 2.5; setPhase('menu'); return; }
  setPhase('searching');
  NET.searching = true;
  NET.searchStart = performance.now();
  NET.statusMsg = 'Searching for players...';
  tryFindRoom();
}

function tryFindRoom(){
  if (!NET.searching) return;
  NET.db.ref('rooms').orderByChild('status').equalTo('waiting').limitToFirst(5).once('value').then(snap => {
    if (!NET.searching) return;
    let joined = false;
    snap.forEach(child => {
      if (joined) return;
      const room = child.val();
      if (room && room.p1 && room.p1.name !== NET.myName && !room.p2){
        joined = true; joinRoom(child.key, room);
      }
    });
    if (!joined){
      if (performance.now() - NET.searchStart > 4000){ createRoom(); }
      else { setTimeout(()=>{ if (NET.searching) tryFindRoom(); }, 1800); }
    }
  }).catch(()=>{ createRoom(); });
}

function createRoom(){
  if (!NET.searching) return;
  const id = genRoomId();
  NET.roomId = id; NET.role = 'p1';
  NET.roomRef = NET.db.ref('rooms/' + id);
  NET.roomRef.set({
    status: 'waiting', createdAt: Date.now(),
    p1: { name: NET.myName, score: 0, done: false },
    p2: null
  }).then(()=>{ NET.statusMsg = 'Room created. Waiting for opponent...'; watchRoom(); })
    .catch(err => console.error(err));
}

function joinRoom(id, room){
  NET.roomId = id; NET.role = 'p2';
  NET.oppName = room.p1 ? room.p1.name : '';
  NET.roomRef = NET.db.ref('rooms/' + id);
  NET.roomRef.update({
    status: 'playing',
    p2: { name: NET.myName, score: 0, done: false }
  }).then(()=>{ watchRoom(); });
}

function watchRoom(){
  if (NET.listener && NET.roomRef) NET.roomRef.off('value', NET.listener);
  NET.listener = NET.roomRef.on('value', snap => {
    const data = snap.val();
    if (!data) return;
    const opp = NET.role === 'p1' ? data.p2 : data.p1;
    if (opp){
      NET.oppName = opp.name || NET.oppName;
      NET.oppScore = typeof opp.score === 'number' ? opp.score : null;
      NET.oppDone = !!opp.done;
    }
    if (NET.role === 'p1' && data.p2 && !data.tossWinner && !NET.tossDecided){
      NET.tossDecided = true; NET.searching = false;
      const winner = Math.random() < 0.5 ? 'p1' : 'p2';
      NET.roomRef.update({ tossWinner: winner, currentBatsman: winner }).catch(()=>{});
    }
    if (data.tossWinner && !NET.tossWinner){
      NET.tossWinner = data.tossWinner;
      NET.currentBatsman = data.currentBatsman || data.tossWinner;
      NET.searching = false;
      if (G.phase !== 'toss' && G.phase !== 'tossResult'){
        NET.tossStartTime = performance.now();
        setPhase('toss');
      }
    }
    if (data.currentBatsman && data.currentBatsman !== NET.currentBatsman){
      NET.currentBatsman = data.currentBatsman;
      if (NET.currentBatsman === NET.role && !NET.myDone && G.phase === 'waitingOpp'){
        beginOnlineTurn();
      }
    }
    if (data.p1 && data.p2 && data.p1.done && data.p2.done){
      showOnlineResults(data);
    }
  });
  const oppRole = NET.role === 'p1' ? 'p2' : 'p1';
  if (NET.liveRef) NET.liveRef.off();
  NET.liveRef = NET.roomRef.child('live/' + oppRole);
  NET.liveRef.on('value', snap => { NET.oppLive = snap.val(); });
}

function beginOnlineTurn(){
  G.mode = 'online';
  G.players = [{ name: NET.myName, color: PLAYER_COLORS[0], score:0, outs:0 }];

function reportOnlineScore(score){
  if (!NET.roomRef) return;
  NET.myDone = true;
  const update = {};
  update[NET.role + '/score'] = score;
  update[NET.role + '/done'] = true;
  if (NET.currentBatsman === NET.role && !NET.turnHandedOver){
    NET.turnHandedOver = true;
    update['currentBatsman'] = (NET.role === 'p1') ? 'p2' : 'p1';
  }
  NET.roomRef.update(update).then(()=>{
    NET.statusMsg = 'Waiting for ' + (NET.oppName || 'opponent') + '...';
    setPhase('waitingOpp'); checkFinish();
  }).catch(()=>{ setPhase('waitingOpp'); });

function checkFinish(){
  if (!NET.roomRef) return;
  NET.roomRef.once('value').then(snap => {
    const d = snap.val();
    if (d && d.p1 && d.p2 && d.p1.done && d.p2.done) showOnlineResults(d);
  });

function showOnlineResults(data){
  if (G.phase === 'gameOver' && G.mode === 'onlineResults') return;
  G.mode = 'onlineResults';
  const myScore  = (data[NET.role] && data[NET.role].score) || 0;
  const oppScore = ((NET.role === 'p1' ? data.p2 : data.p1)?.score) || 0;
  const myName   = (data[NET.role] && data[NET.role].name) || NET.myName || 'YOU';
  const oppName  = ((NET.role === 'p1' ? data.p2 : data.p1)?.name) || NET.oppName || 'OPPONENT';

    { name: myName,  color: PLAYER_COLORS[0], score: myScore },
    { name: oppName, color: PLAYER_COLORS[1], score: oppScore }
  ];
  G.gameOverWinner = myScore > oppScore ? 0 : (myScore < oppScore ? 1 : -1);
  G.gameOverMsg = (myScore === oppScore) ? 'DRAW!' : (myScore > oppScore ? 'YOU WIN!' : 'YOU LOSE');

  setPhase('gameOver');

  else { beep(240,0.3,'sawtooth',0.10); }
}

let actx = null;
function beep(freq, dur, type='sine', vol=0.12){
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  } catch(e){}
}
function sweep(f1,f2,dur,type='square',vol=0.10){
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f1, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime+dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  } catch(e){}
}
function playCheer(intensity = 1){
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const dur = 0.5 + intensity * 0.6;
    const bufSize = Math.floor(actx.sampleRate * dur);
    const buffer = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++){
      const phase = i / bufSize;
      const env = Math.sin(phase * Math.PI) * (1 - phase * 0.4);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = actx.createBufferSource(); src.buffer = buffer;
    const filter = actx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800 + intensity * 800; filter.Q.value = 0.6;
    const gain = actx.createGain(); gain.gain.value = 0.055 * intensity;
    src.connect(filter).connect(gain).connect(actx.destination);
    src.start(); src.stop(actx.currentTime + dur);
  } catch(e){}
}

/* ==================== HELPERS ==================== */
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
const lerp  = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)+amt, g = ((n>>8)&0xff)+amt, b = (n&0xff)+amt;
  return '#' + ((clamp(r,0,255)<<16)|(clamp(g,0,255)<<8)|clamp(b,0,255)).toString(16).padStart(6,'0');
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return 'rgba(' + (n>>16) + ',' + ((n>>8)&0xff) + ',' + (n&0xff) + ',' + a + ')';
}

/* ==================== CROWD ==================== */
function drawCrowdPerson(c, p, armRaise){
  const s = p.s;
  const headR = 4.6 * s, bodyH = 12.5 * s;
  const hipY = p.y - 2.5*s;
  const shoulderY = hipY - bodyH;
  const headY = shoulderY - headR*0.62;
  const raise = armRaise || 0;
  c.fillStyle = p.shirt;
  rr(c, p.x - 5.5*s, shoulderY, 11*s, bodyH + 3*s, 3.4*s); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.16)';
  rr(c, p.x + 1.5*s, shoulderY + 1*s, 4*s, bodyH + 1.5*s, 2.6*s); c.fill();
  c.strokeStyle = p.shirt; c.lineWidth = 2.5*s; c.lineCap = 'round';
  const handY = shoulderY + (raise > 0 ? -7*s*raise : 8*s);
  c.beginPath();
  c.moveTo(p.x - 4.6*s, shoulderY + 1.5*s); c.lineTo(p.x - 7.6*s, handY);
  c.moveTo(p.x + 4.6*s, shoulderY + 1.5*s); c.lineTo(p.x + 7.6*s, handY);
  c.stroke();
  c.fillStyle = p.skin;
  c.beginPath(); c.arc(p.x - 7.6*s, handY, 1.7*s, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(p.x + 7.6*s, handY, 1.7*s, 0, Math.PI*2); c.fill();
  c.fillStyle = p.skin;
  c.beginPath(); c.ellipse(p.x, headY, headR*0.9, headR, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = p.hair;
  c.beginPath(); c.ellipse(p.x, headY - headR*0.28, headR*0.98, headR*0.78, 0, Math.PI, Math.PI*2); c.fill();
  if (s > 0.95){
    c.fillStyle = 'rgba(20,15,10,0.75)';
    c.beginPath(); c.arc(p.x - headR*0.36, headY + headR*0.08, headR*0.13, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(p.x + headR*0.36, headY + headR*0.08, headR*0.13, 0, Math.PI*2); c.fill();
  }
  if (p.hat){
    c.fillStyle = shade(p.shirt, -45);
    c.beginPath(); c.ellipse(p.x, headY - headR*0.62, headR*1.18, headR*0.62, 0, Math.PI, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(p.x + headR*0.55, headY - headR*0.62, headR*0.9, headR*0.30, 0, 0, Math.PI*2); c.fill();
  }
}

function initCrowd(){
  const numPlayers = Math.max(G.players.length || 1, 1);
  const sectionWidth = W / numPlayers;
  crowdSections = [];
  for (let s = 0; s < numPlayers; s++){
    const p = G.players[s];
    crowdSections.push({
      color: p ? p.color : '#7a8aa0',
      name: p ? p.name : 'FANS',
      x: s * sectionWidth, w: sectionWidth
    });
  }
  crowdCanvas = document.createElement('canvas');
  crowdCanvas.width = W; crowdCanvas.height = H;
  const c = crowdCanvas.getContext('2d');
  crowdRows = []; crowdDots = []; frontRowPeople = []; flashes = []; crowdFlags = [];
  const ROWS = 8;
  const startY = STADIUM_TOP + 6, endY = STADIUM_BOTTOM - 12;
  const rowH = (endY - startY) / ROWS;
  for (let row = 0; row < ROWS; row++){
    const depth = row / (ROWS - 1);
    const isFront = (row === ROWS - 1);
    const baseY = startY + row * rowH + rowH * 0.78;
    const scale = 0.50 + depth * 0.82;
    const gap = 21 - depth * 9;
    const dim = Math.floor(depth * 30) - 26;
    crowdRows.push({ y0: startY + row * rowH, h: rowH });
    for (let x = 3 + Math.random() * gap * 0.6; x < W - 3; x += gap * (0.70 + Math.random() * 0.55)){
      let secIdx = 0;
      for (let s = 0; s < crowdSections.length; s++){
        const cs = crowdSections[s];
        if (x >= cs.x && x < cs.x + cs.w){ secIdx = s; break; }
      }
      const sec = crowdSections[secIdx];
      const teamColors = Math.random() < 0.55;
      const rawShirt = teamColors
        ? shade(sec.color, Math.floor((Math.random() - 0.5) * 50))
        : SHIRT_TONES[(Math.random() * SHIRT_TONES.length) | 0];
      const person = {
        x: x + (Math.random() - 0.5) * 3,
        y: baseY + (Math.random() - 0.5) * 3,
        s: scale * (0.88 + Math.random() * 0.26),
        skin: SKIN_TONES[(Math.random() * SKIN_TONES.length) | 0],
        hair: HAIR_TONES[(Math.random() * HAIR_TONES.length) | 0],
        shirt: shade(rawShirt, dim),
        hat: Math.random() < 0.11,
        phase: Math.random() * Math.PI * 2
      };
      if (isFront) frontRowPeople.push(person);
      else drawCrowdPerson(c, person, 0);
      crowdDots.push({ x: person.x, y: person.y - 20 * person.s, color: person.shirt });
    }
  }
  for (const sec of crowdSections){
    const n = Math.max(1, Math.round(sec.w / 210));
    for (let i = 0; i < n; i++){
      crowdFlags.push({
        x: sec.x + sec.w * (i + 0.5) / n,
        color: sec.color, phase: Math.random() * Math.PI * 2,
        w: 46 + Math.random() * 26
      });
    }
  }
}

/* ==================== GAME FLOW ==================== */
function resetGulli(){
  gulli.x = GULLI_START_X; gulli.y = GROUND_Y - 7;
  gulli.vx = 0; gulli.vy = 0; gulli.rot = 0; gulli.rotV = 0; gulli.grounded = true;
}
function resetFielders(){
  for (const f of fielders){
    f.x = f.homeX; f.moving = false; f.runPhase = 0;
    f.isCatcher = false; f.chasing = false;
    f.facing = -1; f.speed = f.topSpeed;
  }
  activeFielder = null;
}
function getFieldingPositions(n){
  const patterns = {
    1: [{homeX: 750,  patrol: 250}],
    2: [{homeX: 575,  patrol: 175}, {homeX: 1200, patrol: 300}],
    3: [{homeX: 480,  patrol: 120}, {homeX: 850,  patrol: 180}, {homeX: 1300, patrol: 280}],
    4: [{homeX: 450,  patrol: 90 }, {homeX: 700,  patrol: 120}, {homeX: 1000, patrol: 180}, {homeX: 1350, patrol: 280}]
  };
  return patterns[Math.min(n, 4)] || patterns[4];
}
function buildFielders(){
  fielders.length = 0;
  const lv = LEVELS[clamp(G.level - 1, 0, LEVELS.length - 1)];
  G.throwErrorBase = lv.error;
  if (G.mode === 'single' || G.mode === 'online'){
    fielders.push({
      homeX: 575, patrol: 175, patrolSpeed: 1.7, patrolPhase: 0,
      x: 575, color:'#5c9ee0', skin:'#f0c49a', hair:'#3a2416',
      topSpeed: lv.speed[0], speed: lv.speed[0],
      runPhase:0, moving:false, facing:-1, isCatcher:false, chasing:false,
      number:'7', playerName:null
    });
    fielders.push({
      homeX: 1200, patrol: 300, patrolSpeed: 1.3, patrolPhase: Math.PI,
      x: 1200, color:'#e0a95c', skin:'#c98d5e', hair:'#1a1a1a',
      topSpeed: lv.speed[1], speed: lv.speed[1],
      runPhase:0, moving:false, facing:-1, isCatcher:false, chasing:false,
      number:'9', playerName:null
    });
  } else {
    const fieldingPlayers = [];
    for (let i = 0; i < G.players.length; i++){
      if (i !== G.currentPlayer) fieldingPlayers.push({ player: G.players[i], index: i });
    }
    const positions = getFieldingPositions(fieldingPlayers.length);
    const skins = ['#f0c49a','#e8b98a','#c98d5e','#d9b48a','#f5d0a9'];
    const hairs = ['#3a2416','#1a1a1a','#2d1810','#4a2a10','#2a1810'];
    fieldingPlayers.forEach((fp, i) => {
      const pos = positions[i];
      const baseSpeed = lv.speed[0] + i * 40;
      fielders.push({
        homeX: pos.homeX, patrol: pos.patrol,
        patrolSpeed: 1.2 + Math.random() * 0.5,
        patrolPhase: Math.random() * Math.PI * 2,
        x: pos.homeX, color: fp.player.color,
        skin: skins[i % skins.length], hair: hairs[i % hairs.length],
        topSpeed: baseSpeed, speed: baseSpeed,
        runPhase: 0, moving: false, facing: -1,
        isCatcher: false, chasing: false,
        number: String(i + 1), playerName: fp.player.name, playerIndex: fp.index
      });
    });
  }
}

    G.players.push({ name: PLAYER_NAMES[i], color: PLAYER_COLORS[i], score:0, outs:0 });

function prepareTurn(){
  G.score = 0; G.outs = 0;
  G.outcome = ''; G.outReason = '';
  G.power = 0; G.powerDir = 1;
  G.shotType = 'DRIVE';
  G.banner = ''; G.bannerTimer = 0;
  resetGulli(); buildFielders(); resetFielders();
  camX = 0;
  G.particles.length = 0; G.ring = null;
  crowdExcitement = 0.3;
  setPhase('turnIntro');
  beep(600, 0.10, 'triangle', 0.10);
}
function beginBatting(){ G.phase = 'power'; beep(880, 0.10, 'triangle', 0.11); }
function commitName(){
  const idx = G.nameEntry.playerIndex;
  const typed = G.nameEntry.currentText.trim();
  G.players[idx].name = typed || PLAYER_NAMES[idx];
  initCrowd();
  if (idx === G.players.length - 1){ prepareTurn(); }
  else {
    G.nameEntry.playerIndex = idx + 1;
    G.nameEntry.currentText = '';
  }
  beep(880, 0.08, 'triangle', 0.10);
}
function evalQuality(v){
  if (v>=SWEET_LO && v<=SWEET_HI){
    const mid=(SWEET_LO+SWEET_HI)/2;
    return 0.88 + 0.12*(1-Math.abs(v-mid)/((SWEET_HI-SWEET_LO)/2));
  }
  if (v<SWEET_LO) return Math.max(0, 0.88*(v/SWEET_LO));
  return Math.max(0, 0.88*((100-v)/(100-SWEET_HI)));
}
function lockPower(){
  G.quality = evalQuality(G.power);
  G.phase = 'air'; G.swingTimer = G.swingDur;
  gulli.grounded = false;
  gulli.vy = -(760 + G.quality*160);
  gulli.vx = 0;
  gulli.rotV = 9 * (Math.random()<0.5?1:-1);
  G.zonePop = 0;
  beep(320 + G.quality*220, 0.10, 'square', 0.09);
}
function swing(){
  if (gulli.vy <= 0) return;
  const dist = Math.abs(gulli.y - ZONE_Y);
  const acc = clamp(1 - dist/ZONE_R, 0, 1);
  G.accuracy = acc; G.swingTimer = G.swingDur; G.zonePop = 0;
  const shot = SHOTS[G.shotType];
  const power = 0.70 + acc * 0.55;
  gulli.vy = shot.vyBase * power;
  gulli.vx = shot.vxBase * power;
  gulli.rotV = 20;
  G.phase = 'fly';
  shake = 0.35 + acc * 0.75;
  spawnBurst(gulli.x, gulli.y, acc);
  G.ring = { x:gulli.x, y:gulli.y, t:0, acc };
  const cheerLevel = acc * (G.shotType === 'LOFT' ? 1.4 : G.shotType === 'DRIVE' ? 1.1 : 0.7);
  crowdExcitement = Math.max(crowdExcitement, 0.6 + cheerLevel * 1.0);
  playCheer(0.5 + acc * 0.9);
  if (acc > 0.92) { sweep(900,1800,0.18,'triangle',0.13); G.banner='PERFECT!'; }
  else if (acc > 0.6) { beep(700,0.12,'triangle',0.11); G.banner='GREAT HIT!'; }
  else if (acc > 0.25) { beep(500,0.12,'triangle',0.09); G.banner='HIT'; }
  else { beep(360,0.12,'triangle',0.08); G.banner='WEAK HIT'; }
  G.bannerTimer = 0.9;
}
function missGulli(){
  G.phase='result'; G.resultTimer=2.2;
  G.hitDistance=0;
  G.outcome='out'; G.outReason='miss';
  G.banner='MISS!'; G.bannerTimer=1.4;
  G.outs++;
  shake = 0.3;
  spawnDust(gulli.x, GROUND_Y);
  beep(180,0.22,'sawtooth',0.09);
  crowdExcitement = 1.0; playCheer(0.6);
}
function beginFielding(){
  G.hitDistance = Math.max(0, (gulli.x - GULLI_START_X)/PPM);
  G.phase = 'fielding';
  let best=0, bestD=Infinity;
  for (let i=0;i<fielders.length;i++){
    const d = Math.abs(fielders[i].x - gulli.x);
    if (d<bestD){ bestD=d; best=i; }
  }
  activeFielder = fielders[best];
  activeFielder.moving = true; activeFielder.chasing = true;
  const dist = Math.abs(gulli.x - activeFielder.x);
  activeFielder.catchUpSpeed = Math.min(3000, Math.max(activeFielder.topSpeed, dist / 0.5));
  activeFielder.speed = activeFielder.catchUpSpeed;
}
function finishRound(){
  if (G.outcome === 'out') G.outs++;
  else {
    const pts = Math.round(G.hitDistance);
    G.score += pts;
    if (G.score > G.best) G.best = G.score;
  }
  G.phase = 'result';
  G.resultTimer = 2.4;
}
function nextRound(){
  if (G.outcome === 'out'){ endTurn(); return; }
  resetGulli(); resetFielders();
  G.power=0; G.powerDir=1;
  G.outcome=''; G.outReason='';
  G.phase='power';
}
function endTurn(){
  G.players[G.currentPlayer].score = G.score;
  G.players[G.currentPlayer].outs = G.outs;
  setPhase('turnEnd');
  beep(880,0.18,'triangle',0.11);
}
function advanceFromTurnEnd(){
  if (G.mode === 'online'){ reportOnlineScore(G.score); return; }
  if (G.mode === 'single'){
    const lv = LEVELS[clamp(G.level-1,0,4)];
    G.levelCleared = (G.score >= lv.target);
    G.gameOverWinner = G.levelCleared ? 0 : -1;
    G.gameOverMsg = G.levelCleared ? 'LEVEL ' + G.level + ' CLEARED!' : 'LEVEL FAILED';
    G.celebrationTimer = 0; G.confettiTimer = 0;
    updateStatsSingle(G.score);
    setPhase('gameOver');
    if (G.levelCleared){
      crowdExcitement = 2.0; playCheer(1.4);
      beep(1200, 0.2, 'triangle', 0.13);
      setTimeout(()=>beep(1600, 0.2, 'triangle', 0.13), 180);
      setTimeout(()=>beep(2000, 0.25, 'triangle', 0.12), 360);
    } else { crowdExcitement = 0.3; beep(240, 0.3, 'sawtooth', 0.10); }
  } else {
    G.currentPlayer++;
    if (G.currentPlayer >= G.players.length){
      let bestIdx = 0, bestScore = -1;
      for (let i=0; i<G.players.length; i++){
        if (G.players[i].score > bestScore){ bestScore = G.players[i].score; bestIdx = i; }
      }
      G.gameOverWinner = bestIdx;
      G.gameOverMsg = G.players[bestIdx].name + ' WINS!';
      G.celebrationTimer = 0; G.confettiTimer = 0;
      setPhase('gameOver');
      crowdExcitement = 2.0; playCheer(1.6);
      beep(1200, 0.2, 'triangle', 0.14);
      setTimeout(()=>beep(1600, 0.2, 'triangle', 0.14), 180);
      setTimeout(()=>beep(2000, 0.25, 'triangle', 0.13), 360);
      setTimeout(()=>beep(1600, 0.2, 'triangle', 0.13), 540);
    } else { prepareTurn(); }
  }
}

/* ==================== PARTICLES ==================== */
function spawnBurst(x,y,acc){
  const n = 12 + Math.round(acc*16);
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 120 + Math.random()*520*(0.5+acc);
    G.particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 100,
      life:0.55+Math.random()*0.4, max:0.95, size:2+Math.random()*4.5,
      c: Math.random()>0.45 ? '#ffd166' : '#ffffff' });
  }
}
function spawnDust(x,y){
  for (let i=0;i<12;i++){
    G.particles.push({ x: x+(Math.random()-0.5)*24, y: y-4,
      vx: (Math.random()-0.5)*220, vy: -Math.random()*170,
      life: 0.4+Math.random()*0.35, max:0.75, size: 3+Math.random()*5, c:'#c8b48a' });
  }
}
function spawnConfetti(){
  for (let i=0; i<4; i++){
    const x = Math.random() * W;
    const size = 4 + Math.random() * 5;
    G.particles.push({
      x, y: 130 + Math.random()*60,
      vx: (Math.random()-0.5) * 100, vy: 60 + Math.random()*140,
      life: 2.5 + Math.random()*2, max: 4.5, size,
      c: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      confetti: true, rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*8
    });
  }
}
function spawnCheerParticles(){
  if (crowdDots.length === 0) return;
  const dot = crowdDots[Math.floor(Math.random() * crowdDots.length)];
  G.particles.push({
    x: dot.x, y: dot.y - 4,
    vx: (Math.random() - 0.5) * 50, vy: -80 - Math.random() * 120,
    life: 0.7 + Math.random() * 0.5, max: 1.2,
    size: 2 + Math.random() * 3, c: dot.color, cheer: true
  });
}
function spawnSplashSpark(){
  const a = Math.random() * Math.PI * 2;
  const r = 60 + Math.random() * 320;
  G.particles.push({
    x: W/2 + Math.cos(a) * r, y: H/2 + Math.sin(a) * r * 0.5,
    vx: Math.cos(a) * 20, vy: -30 - Math.random() * 60,
    life: 0.9 + Math.random() * 0.6, max: 1.5,
    size: 1.5 + Math.random() * 2.5,
    c: Math.random() > 0.4 ? '#ffd166' : '#fff6c8', spark: true
  });
}
function updateParticles(dt){
  for (let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    if (p.confetti) p.vy += 150 * dt;
    else if (p.cheer) p.vy += 180 * dt;
    else if (p.spark) p.vy += 20 * dt;
    else p.vy += 1000 * dt;
    if (p.confetti){
      p.vx += Math.sin(performance.now()/300 + i) * 20 * dt;
      p.rot = (p.rot || 0) + (p.rotV || 0) * dt;
    }
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if (p.life<=0 || p.y > H + 60) G.particles.splice(i,1);
  }
  if (G.ring){ G.ring.t += dt*2.6; if (G.ring.t>=1) G.ring=null; }
}

/* ==================== UPDATE ==================== */
function update(dt){
  NET.lastSync = (NET.lastSync || 0) + dt;
  if (NET.lastSync > 0.15 && NET.roomRef && NET.role && G.mode === 'online'){
    NET.lastSync = 0;
    let phaseLabel = G.phase;
    if (G.phase === 'power' || G.phase === 'air') phaseLabel = 'BATTING';
    else if (G.phase === 'fly') phaseLabel = 'HIT!';
    else if (G.phase === 'fielding') phaseLabel = 'FIELDING';
    else if (G.phase === 'throw') phaseLabel = 'THROWING';
    else if (G.phase === 'result') phaseLabel = 'RESULT';
    else if (G.phase === 'turnEnd') phaseLabel = 'INNINGS DONE';
    else if (G.phase === 'waitingOpp') phaseLabel = 'WAITING';
    NET.roomRef.child('live/' + NET.role).update({
      phase: phaseLabel, score: G.score,
      gulliX: Math.round(gulli.x), gulliY: Math.round(gulli.y),
      ballDist: Math.round(G.hitDistance || 0), ts: Date.now()
    }).catch(()=>{});
  }

  if (G.bannerTimer>0) G.bannerTimer -= dt;
  if (G.swingTimer>0) G.swingTimer -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3.0);
  updateParticles(dt);
  crowdExcitement = Math.max(0, crowdExcitement - dt * 0.7);
  if (crowdExcitement > 0.9 && Math.random() < crowdExcitement * 0.25) spawnCheerParticles();
  if (crowdCanvas && crowdDots.length){
    if (Math.random() < 0.04 + crowdExcitement * 0.55){
      const d = crowdDots[(Math.random() * crowdDots.length) | 0];
      flashes.push({ x: d.x, y: d.y, life: 0.32, max: 0.32 });
    }
    for (let i = flashes.length - 1; i >= 0; i--){
      flashes[i].life -= dt;
      if (flashes[i].life <= 0) flashes.splice(i, 1);
    }
  }

  if (G.phase === 'splash'){
    G.splashTimer += dt;
    if (Math.random() < 0.7) spawnSplashSpark();
    if (G.splashTimer >= SPLASH_DURATION){
      const session = loadSession();
      if (session && session.phone && NET.ready){
        NET.db.ref('accounts/user_' + session.phone).once('value').then(snap => {
          if (snap.exists()){
            const data = snap.val();
            Object.assign(ACCOUNT, data);
            ACCOUNT.loggedIn = true;
            saveSession();
            setPhase('menu');
          } else { setPhase('login'); }
        }).catch(()=>{ setPhase('login'); });
      } else { setPhase('login'); }
      beep(880, 0.1, 'triangle', 0.08);
    }
    return;
  }
  if (G.phase === 'searching' || G.phase === 'waitingOpp'){ return; }

  if (G.phase === 'toss'){
    if (performance.now() - NET.tossStartTime > TOSS_DURATION){
      NET.tossResultStart = performance.now();
      setPhase('tossResult');
    }
    return;
  }
  if (G.phase === 'tossResult'){
    if (performance.now() - NET.tossResultStart > TOSS_RESULT_DURATION){
      if (NET.tossWinner === NET.role) beginOnlineTurn();
      else setPhase('waitingOpp');
    }
    return;
  }

  if (G.phase==='turnEnd' || G.phase==='gameOver' || G.phase==='turnIntro'
      || G.phase==='menu' || G.phase==='levelSelect' || G.phase==='playerSelect'
      || G.phase==='nameEntry' || G.phase==='login' || G.phase==='register'
      || G.phase==='leaderboard' || G.phase==='profileView'){
    camX += (0 - camX) * Math.min(1, dt*3);
    if (G.phase === 'gameOver'){
      G.celebrationTimer += dt; G.confettiTimer += dt;
      if (G.confettiTimer > 0.06){ G.confettiTimer = 0; spawnConfetti(); }
    }
    return;
  }

  let camTarget = 0;
  if (G.phase==='fly') camTarget = Math.max(0, gulli.x - W*0.35);
  else if ((G.phase==='fielding'||G.phase==='throw') && activeFielder)
    camTarget = Math.max(0, activeFielder.x - W*0.5);
  camX += (camTarget - camX) * Math.min(1, dt*5);

  for (const f of fielders){
    if (f.chasing) continue;
    f.patrolPhase += dt * f.patrolSpeed;
    f.x = f.homeX + Math.sin(f.patrolPhase) * f.patrol;
    f.facing = Math.cos(f.patrolPhase) > 0 ? 1 : -1;
    if (Math.abs(Math.cos(f.patrolPhase)) > 0.15){
      f.moving = true; f.runPhase += dt * 12; f.speed = 180;
    } else { f.moving = false; f.runPhase = 0; f.speed = 0; }
  }

  switch (G.phase){
    case 'power':
      G.power += G.powerDir*128*dt;
      if (G.power>=100){G.power=100;G.powerDir=-1;}
      if (G.power<=0) {G.power=0; G.powerDir=1;}
      break;
    case 'air': {
      gulli.vy += GRAV*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
      if (gulli.vy>0) G.zonePop = Math.min(1, G.zonePop + dt*6);
      if (gulli.y > GROUND_Y-7){ gulli.y = GROUND_Y-7; gulli.grounded = true; missGulli(); }
      break;
    }
    case 'fly': {
      gulli.vy += GRAV*dt; gulli.x += gulli.vx*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
      const y0 = gulli.y, vy0 = gulli.vy;
      const targetY = GROUND_Y - 7;
      const disc = vy0*vy0 + 2*GRAV*(targetY - y0);
      if (disc > 0 && gulli.vx !== 0){
        const tLand = (-vy0 + Math.sqrt(disc)) / GRAV;
        if (tLand > 0 && tLand < 6){
          const landingX = gulli.x + gulli.vx * tLand;
          for (const f of fielders){
            const dx = landingX - f.x;
            const adist = Math.abs(dx);
            if (adist > 8){
              const spd = Math.min(f.topSpeed * 1.5, 1700);
              const step = Math.min(spd * dt, adist);
              f.x += Math.sign(dx) * step;
              f.moving = true; f.facing = Math.sign(dx);
              f.runPhase += dt * 18; f.speed = spd;
            }
          }
        }
      }
      if (!gulli.grounded){
        const hAbove = GROUND_Y - gulli.y;
        if (hAbove > 80 && hAbove < 280){
          for (const f of fielders){
            if (Math.abs(f.x - gulli.x) < 46){
              f.isCatcher = true;
              G.outcome='out'; G.outReason='caught';
              G.hitDistance = Math.max(0, (gulli.x-GULLI_START_X)/PPM);
              G.banner='CAUGHT!'; G.bannerTimer=1.6;
              shake = 0.6;
              spawnBurst(gulli.x, gulli.y, 1);
              sweep(500,120,0.35,'sawtooth',0.13);
              crowdExcitement = 1.8; playCheer(1.3);
              finishRound(); return;
            }
          }
        }
      }
      if (gulli.y > GROUND_Y-7){
        gulli.y = GROUND_Y-7;
        if (Math.abs(gulli.vy)>230){
          gulli.vy = -Math.abs(gulli.vy)*0.42;
          gulli.vx *= 0.80;
          spawnDust(gulli.x, GROUND_Y);
          beep(240,0.06,'sine',0.05);
        } else {
          gulli.vy = 0;
          gulli.vx *= Math.pow(0.012, dt);
          gulli.rotV *= Math.pow(0.05, dt);
          if (Math.abs(gulli.vx)<28){ gulli.vx=0; beginFielding(); }
        }
      }
      break;
    }
    case 'fielding': {
      if (!activeFielder){ beginFielding(); break; }
      const dx = gulli.x - activeFielder.x;
      const distToBall = Math.abs(dx);
      if (distToBall > 22){
        const minSpeed = distToBall / 0.5;
        const targetSpd = Math.max(activeFielder.topSpeed, minSpeed);
        activeFielder.speed += (targetSpd - activeFielder.speed) * Math.min(1, dt*25);
        const dir = Math.sign(dx);
        const step = Math.min(activeFielder.speed * dt, distToBall - 22);
        if (step > 0) activeFielder.x += dir * step;
        activeFielder.moving = true; activeFielder.facing = dir;
        activeFielder.runPhase += dt * (activeFielder.speed / 22);
      } else {
        activeFielder.moving = false; activeFielder.runPhase = 0;
        G.phase = 'throw'; throwTimer = 0.35; throwLaunched = false;
        beep(520,0.08,'triangle',0.08);
      }
      break;
    }
    case 'throw': {
      if (!throwLaunched){
        throwTimer -= dt;
        if (throwTimer<=0){
          const sx = activeFielder.x, sy = GROUND_Y - 92;
          const dist = Math.abs(sx - DANDA_X);
          const baseError = G.throwErrorBase + dist*0.07;
          const err = (Math.random()*2-1)*baseError;
          const target = DANDA_X + err;
          const T = clamp(dist/900, 0.55, 1.55);
          gulli.x = sx; gulli.y = sy;
          gulli.vx = (target - sx)/T;
          gulli.vy = (GROUND_Y-7 - sy - 0.5*GRAV*T*T)/T;
          gulli.rotV = 14; gulli.grounded = false;
          throwLaunched = true;
          beep(620,0.08,'square',0.09);
        }
      } else {
        gulli.vy += GRAV*dt; gulli.x += gulli.vx*dt; gulli.y += gulli.vy*dt; gulli.rot += gulli.rotV*dt;
        if (gulli.y > GROUND_Y-7){
          gulli.y = GROUND_Y-7; gulli.vy = 0; gulli.vx = 0;
          const diff = Math.abs(gulli.x - DANDA_X);
          if (diff < 40){
            G.outcome='out'; G.outReason='danda'; G.banner='OUT!';
            shake = 0.7;
            spawnBurst(DANDA_X, GROUND_Y-24, 1);
            sweep(760,140,0.38,'sawtooth',0.14);
            beep(120,0.4,'sawtooth',0.10);
            crowdExcitement = 1.6; playCheer(1.1);
          } else {
            G.outcome='safe'; G.outReason=''; G.banner='SAFE!';
            spawnDust(gulli.x, GROUND_Y);
            beep(880,0.14,'triangle',0.11);
            beep(1180,0.14,'triangle',0.08);
            crowdExcitement = 0.5;
          }
          G.bannerTimer = 1.6;
          finishRound();
        }
      }
      break;
    }
    case 'result':
      G.resultTimer -= dt;
      if (G.resultTimer<=0) nextRound();
      break;
  }
}

/* ==================== INPUT ==================== */
function pointInButton(px, py, b){
  return px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h;
}
function canvasCoordsFromEvent(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left)*(W/r.width), y:(e.clientY - r.top)*(H/r.height) };
}
function setShot(id){
  if (G.shotType !== id){ G.shotType = id; beep(720, 0.05, 'sine', 0.06); }
}
function handleMenuClick(x, y){
  for (const b of menuButtons){
    if (pointInButton(x, y, b)){
      beep(880, 0.06, 'triangle', 0.09);
      if (b.id === 'single'){ setPhase('levelSelect'); return true; }
      if (b.id === 'multi'){ setPhase('playerSelect'); return true; }
      if (b.id === 'online'){ startOnlineMatchmaking(); return true; }
      if (b.id === 'leaderboard'){ LEADERBOARD.data = null; fetchLeaderboard(); setPhase('leaderboard'); return true; }
      if (b.id === 'doLogin'){
        const p = normalizePhone(ACCOUNT.formPhone);
        if (p.length !== 10){ ACCOUNT.error = 'Enter valid 10-digit number'; return true; }
        loginUser(p); return true;
      }
      if (b.id === 'doRegister'){
        const nm = (ACCOUNT.formName || '').trim().toUpperCase().slice(0,10);
        const p = normalizePhone(ACCOUNT.formPhone);
        if (!nm){ ACCOUNT.error = 'Enter your name'; return true; }
        if (p.length !== 10){ ACCOUNT.error = 'Enter valid 10-digit number'; return true; }
        registerUser(nm, p); return true;
      }
      if (b.id === 'goRegister'){ ACCOUNT.mode = 'register'; ACCOUNT.error = ''; ACCOUNT.formFocus='name'; setPhase('register'); return true; }
      if (b.id === 'goLogin'){ ACCOUNT.mode = 'login'; ACCOUNT.error = ''; ACCOUNT.formFocus='phone'; setPhase('login'); return true; }
      if (b.id === 'logout'){ cleanupOnline(); logoutUser(); return true; }
      if (b.id === 'cancelSearch'){ NET.searching = false; cleanupOnline(); setPhase('menu'); return true; }
      if (b.id === 'onlineAgain'){ cleanupOnline(); startOnlineMatchmaking(); return true; }
      if (b.id.startsWith('level')){ startSinglePlayer(parseInt(b.id.slice(5),10)); return true; }
      if (b.id.startsWith('pc')){ startMultiPlayer(parseInt(b.id.slice(2),10)); return true; }
      if (b.id === 'back'){ setPhase('menu'); return true; }
      if (b.id === 'startBat'){ beginBatting(); return true; }
      if (b.id === 'continue'){ advanceFromTurnEnd(); return true; }
      if (b.id === 'nextLevel'){ startSinglePlayer(Math.min(G.level+1,5)); return true; }
      if (b.id === 'retry'){ startSinglePlayer(G.level); return true; }
      if (b.id === 'playAgain'){
        if (G.mode === 'single') startSinglePlayer(G.level);
        else startMultiPlayer(G.players.length);
        return true;
      }
      if (b.id === 'menu'){
        if (G.mode === 'onlineResults') cleanupOnline();
        setPhase('menu'); return true;
      }
    }
  }
  // Login/register field taps
  if (G.phase === 'login' || G.phase === 'register'){
    const nameBox = { x: W/2 - 220, y: 210, w: 440, h: 56 };
    const phoneBox = { x: W/2 - 220, y: 290, w: 440, h: 56 };
    if (G.phase === 'register' && pointInButton(x,y,nameBox)){ ACCOUNT.formFocus = 'name'; openMobileKeyboard(); return true; }
    if (pointInButton(x,y,phoneBox)){ ACCOUNT.formFocus = 'phone'; openMobileKeyboard(); return true; }
  }
  return false;
}
function onInput(e){
  if (!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(err){} }
  if (G.phase === 'splash'){ if (G.splashTimer > 0.7){ G.splashTimer = SPLASH_DURATION; } return; }
  if (G.phase === 'toss' || G.phase === 'tossResult'){ return; }
  if (G.phase==='menu' || G.phase==='levelSelect' || G.phase==='playerSelect'
      || G.phase==='turnIntro' || G.phase==='turnEnd' || G.phase==='gameOver'
      || G.phase==='login' || G.phase==='register' || G.phase==='leaderboard'
      || G.phase==='profileView' || G.phase==='searching'){
    if (e){ const {x,y} = canvasCoordsFromEvent(e); handleMenuClick(x, y); }
    return;
  }
  if (G.phase === 'waitingOpp') return;
  if (G.phase === 'nameEntry'){ if (e) commitName(); return; }
  const canPickShot = (G.phase==='power' || G.phase==='air');
  if (canPickShot && e){
    const {x,y} = canvasCoordsFromEvent(e);
    for (const b of shotButtons){
      if (pointInButton(x,y,b)){ setShot(b.id); return; }
    }
  }
  switch (G.phase){
    case 'power': lockPower(); break;
    case 'air': swing(); break;
    case 'result': if (G.resultTimer<1.4) G.resultTimer=0; break;
  }
}
function handleNameEntryKey(e){
  if (e.key === 'Enter'){ commitName(); e.preventDefault(); return; }
  if (e.key === 'Backspace'){ G.nameEntry.currentText = G.nameEntry.currentText.slice(0, -1); e.preventDefault(); return; }
  if (e.key === 'Escape'){ setPhase('menu'); e.preventDefault(); return; }
  if (e.key.length === 1 && /[A-Za-z0-9 _-]/.test(e.key) && G.nameEntry.currentText.length < 10){
    G.nameEntry.currentText += e.key.toUpperCase(); e.preventDefault();
  }
}
function handleAuthKey(e){
  if (e.key === 'Escape'){ setPhase('menu'); e.preventDefault(); return; }
  const target = ACCOUNT.formFocus;
  if (e.key === 'Tab'){
    ACCOUNT.formFocus = target === 'name' ? 'phone' : 'name';
    openMobileKeyboard(); e.preventDefault(); return;
  }
  if (e.key === 'Enter'){
    if (G.phase === 'login'){
      const p = normalizePhone(ACCOUNT.formPhone);
      if (p.length === 10) loginUser(p);
      else ACCOUNT.error = 'Enter valid 10-digit number';
    } else if (G.phase === 'register'){
      const nm = (ACCOUNT.formName || '').trim().toUpperCase().slice(0,10);
      const p = normalizePhone(ACCOUNT.formPhone);
      if (!nm) ACCOUNT.error = 'Enter your name';
      else if (p.length !== 10) ACCOUNT.error = 'Enter valid 10-digit number';
      else registerUser(nm, p);
    }
    e.preventDefault(); return;
  }
  if (e.key === 'Backspace'){
    if (target === 'name') ACCOUNT.formName = ACCOUNT.formName.slice(0, -1);
    else ACCOUNT.formPhone = ACCOUNT.formPhone.slice(0, -1);
    e.preventDefault(); return;
  }
  if (e.key.length === 1){
    if (target === 'name' && /[A-Za-z0-9 _-]/.test(e.key) && ACCOUNT.formName.length < 10){
      ACCOUNT.formName += e.key.toUpperCase(); e.preventDefault();
    } else if (target === 'phone' && /[0-9]/.test(e.key) && ACCOUNT.formPhone.length < 10){
      ACCOUNT.formPhone += e.key; e.preventDefault();
    }
  }
}

window.addEventListener('keydown', e=>{
  if (G.phase === 'splash'){
    if (e.code==='Space'||e.code==='Enter'||e.key===' '){ onInput(null); e.preventDefault(); }
    return;
  }
  if (G.phase === 'login' || G.phase === 'register'){ handleAuthKey(e); return; }
  if (G.phase === 'toss' || G.phase === 'tossResult'){ return; }
  if (G.phase === 'searching'){
    if (e.key==='Escape'){ NET.searching = false; cleanupOnline(); setPhase('menu'); e.preventDefault(); }
    return;
  }
  if (G.phase === 'waitingOpp'){ return; }
  if (G.phase === 'nameEntry'){ handleNameEntryKey(e); return; }
  if (G.phase === 'menu'){
    if (e.key==='1'){ setPhase('levelSelect'); e.preventDefault(); return; }
    if (e.key==='2'){ setPhase('playerSelect'); e.preventDefault(); return; }
    if (e.key==='3'){ startOnlineMatchmaking(); e.preventDefault(); return; }
    if (e.key==='4'){ LEADERBOARD.data = null; fetchLeaderboard(); setPhase('leaderboard'); e.preventDefault(); return; }
    if (e.key==='p' || e.key==='P'){ setPhase('profileView'); e.preventDefault(); return; }
    if (e.key==='l' || e.key==='L'){ cleanupOnline(); logoutUser(); e.preventDefault(); return; }
  }
  if (G.phase === 'levelSelect'){
    if (e.key>='1' && e.key<='5'){ startSinglePlayer(parseInt(e.key,10)); e.preventDefault(); return; }
    if (e.key==='Escape'){ setPhase('menu'); e.preventDefault(); return; }
  }
  if (G.phase === 'playerSelect'){
    if (e.key>='2' && e.key<='5'){ startMultiPlayer(parseInt(e.key,10)); e.preventDefault(); return; }
    if (e.key==='Escape'){ setPhase('menu'); e.preventDefault(); return; }
  }
  if (G.phase === 'leaderboard' || G.phase === 'profileView'){
    if (e.key==='Escape'){ setPhase('menu'); e.preventDefault(); return; }
  }
  if (e.code==='Space' || e.code==='Enter'){
    if (G.phase==='turnIntro'){ beginBatting(); e.preventDefault(); return; }
    if (G.phase==='turnEnd'){ advanceFromTurnEnd(); e.preventDefault(); return; }
  }
  if (G.phase==='gameOver' && (e.code==='Space'||e.code==='Enter')){
    if (G.mode==='onlineResults'){ cleanupOnline(); startOnlineMatchmaking(); e.preventDefault(); return; }
    if (G.mode==='single'){
      if (G.levelCleared && G.level<5) startSinglePlayer(G.level+1);
      else if (!G.levelCleared) startSinglePlayer(G.level);
      else setPhase('menu');
    } else { startMultiPlayer(G.players.length); }
    e.preventDefault(); return;
  }
  if (e.key==='1'){ setShot('PUSH');  e.preventDefault(); return; }
  if (e.key==='2'){ setShot('DRIVE'); e.preventDefault(); return; }
  if (e.key==='3'){ setShot('LOFT');  e.preventDefault(); return; }
  if (e.key==='ArrowLeft' || e.key==='ArrowRight'){
    const order = ['PUSH','DRIVE','LOFT'];
    let i = order.indexOf(G.shotType);
    i = e.key==='ArrowLeft' ? (i+order.length-1)%order.length : (i+1)%order.length;
    setShot(order[i]); e.preventDefault(); return;
  }
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.key===' '){
    e.preventDefault(); onInput(null);
  }
});

/* ========== MOBILE KEYBOARD ========== */
const mobileInput = document.getElementById('mobileNameInput');
function isTypingPhase(){ return G.phase === 'nameEntry' || G.phase === 'login' || G.phase === 'register'; }
function openMobileKeyboard(){
  mobileInput.style.pointerEvents = 'auto';
  mobileInput.style.zIndex = '999';
  if (G.phase === 'login' || G.phase === 'register'){
    mobileInput.value = (ACCOUNT.formFocus === 'name') ? ACCOUNT.formName : ACCOUNT.formPhone;
    mobileInput.setAttribute('inputmode', ACCOUNT.formFocus === 'phone' ? 'numeric' : 'text');
  } else if (G.phase === 'nameEntry'){
    mobileInput.value = G.nameEntry.currentText || '';
    mobileInput.setAttribute('inputmode', 'text');
  }
  try { mobileInput.focus({ preventScroll: true }); } catch(err){ mobileInput.focus(); }
  setTimeout(()=>{ try{ mobileInput.focus(); }catch(e){} }, 50);
}

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if (isTypingPhase()){
    if (G.phase === 'login' || G.phase === 'register'){
      const {x,y} = canvasCoordsFromEvent(e);
      const nameBox = { x: W/2 - 220, y: 210, w: 440, h: 56 };
      const phoneBox = { x: W/2 - 220, y: 290, w: 440, h: 56 };
      if (G.phase === 'register' && pointInButton(x,y,nameBox)) ACCOUNT.formFocus = 'name';
      else if (pointInButton(x,y,phoneBox)) ACCOUNT.formFocus = 'phone';
    }
    openMobileKeyboard();
  }
  onInput(e);
});

mobileInput.addEventListener('input', ()=>{
  const raw = mobileInput.value || '';
  if (G.phase === 'login' || G.phase === 'register'){
    if (ACCOUNT.formFocus === 'name'){
      ACCOUNT.formName = raw.toUpperCase().slice(0,10);
      mobileInput.value = ACCOUNT.formName;
    } else {
      ACCOUNT.formPhone = raw.replace(/\D/g,'').slice(0,10);
      mobileInput.value = ACCOUNT.formPhone;
    }
  } else if (G.phase === 'nameEntry'){
    G.nameEntry.currentText = raw.toUpperCase().slice(0,10);
    mobileInput.value = G.nameEntry.currentText;
  }
});

mobileInput.addEventListener('keydown', e=>{
  if (e.key === 'Enter'){
    mobileInput.blur();
    mobileInput.style.pointerEvents = 'none';
    mobileInput.style.zIndex = '-1';
    if (G.phase === 'login'){
      const p = normalizePhone(ACCOUNT.formPhone);
      if (p.length === 10) loginUser(p);
      else ACCOUNT.error = 'Enter valid 10-digit number';
    } else if (G.phase === 'register'){
      const nm = (ACCOUNT.formName || '').trim().toUpperCase().slice(0,10);
      const p = normalizePhone(ACCOUNT.formPhone);
      if (!nm) ACCOUNT.error = 'Enter your name';
      else if (p.length !== 10) ACCOUNT.error = 'Enter valid 10-digit number';
      else registerUser(nm, p);
    } else if (G.phase === 'nameEntry'){ commitName(); }
    e.preventDefault();
  }
});

function drawEffects(){
