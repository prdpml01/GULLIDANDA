function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rr(c,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);
  c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function hexA(hex,a){
  const c = hex.replace('#','');
  let r,g,b;
  if (c.length===3){ r=parseInt(c[0]+c[0],16); g=parseInt(c[1]+c[1],16); b=parseInt(c[2]+c[2],16); }
  else { r=parseInt(c.substring(0,2),16); g=parseInt(c.substring(2,4),16); b=parseInt(c.substring(4,6),16); }
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function shade(hex,amt){
  const c = hex.replace('#','');
  let r,g,b;
  if (c.length===3){ r=parseInt(c[0]+c[0],16); g=parseInt(c[1]+c[1],16); b=parseInt(c[2]+c[2],16); }
  else { r=parseInt(c.substring(0,2),16); g=parseInt(c.substring(2,4),16); b=parseInt(c.substring(4,6),16); }
  r = clamp(Math.round(r+amt),0,255);
  g = clamp(Math.round(g+amt),0,255);
  b = clamp(Math.round(b+amt),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

let audioCtx = null;
function beep(freq, dur, type, vol){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur + 0.02);
  }catch(e){}
}

function pushLeaderboard(username, score){
  try{
    let lb = JSON.parse(localStorage.getItem(LB_KEY) || '[]');
    const idx = lb.findIndex(x=>x.username===username);
    if (idx >= 0) lb[idx].bestOnline = Math.max(lb[idx].bestOnline||0, score||0);
    else lb.push({username, bestOnline: score||0});
    lb.sort((a,b)=>(b.bestOnline||0)-(a.bestOnline||0));
    lb = lb.slice(0,20);
    localStorage.setItem(LB_KEY, JSON.stringify(lb));
  }catch(e){}
}
function loadLeaderboard(){
  let lb = [];
  try{ lb = JSON.parse(localStorage.getItem(LB_KEY) || '[]'); }catch(e){ lb = []; }
  const seeds = [
    {username:'gulli_master', bestOnline:184},
    {username:'danda_king',   bestOnline:161},
    {username:'streetpro',    bestOnline:143},
    {username:'pradeep_s',    bestOnline:127},
    {username:'gully_goat',   bestOnline:98}
  ];
  for (const s of seeds) if (!lb.find(x=>x.username===s.username)) lb.push(s);
  lb.sort((a,b)=>(b.bestOnline||0)-(a.bestOnline||0));
  LEADERBOARD.data = lb.slice(0,10);
}

function initCrowd(){
  crowdSections = [
    { x:0,          w:W*0.25, color:'#e63946' },
    { x:W*0.25,     w:W*0.25, color:'#3a86ff' },
    { x:W*0.5,      w:W*0.25, color:'#ffb703' },
    { x:W*0.75,     w:W*0.25, color:'#2ec4b6' }
  ];

  crowdCanvas = document.createElement('canvas');
  crowdCanvas.width = W + 60;
  crowdCanvas.height = STADIUM_BOTTOM + 30;

  crowdLayers = [];
  const rows = 3;
  for (let r=0; r<rows; r++){
    const c = document.createElement('canvas');
    c.width = W + 60;
    c.height = STADIUM_BOTTOM + 30;
    const cx = c.getContext('2d');
    const y = STADIUM_TOP + 26 + r*60;
    const step = 24 - r*5;
    for (let x = 12; x < c.width; x += step){
      const secIdx = clamp(Math.floor((x/W)*4), 0, 3);
      const base = crowdSections[secIdx].color;
      const tone = -35 + ((x*37)%70);
      cx.fillStyle = shade(base, tone);
      cx.beginPath(); cx.arc(x, y, 6 + r*1.4, 0, Math.PI*2); cx.fill();
      cx.fillStyle = 'rgba(0,0,0,0.30)';
      cx.beginPath(); cx.ellipse(x, y + 12 + r*2, 7 + r*1.6, 8 + r*1.6, 0, 0, Math.PI*2); cx.fill();
    }
    crowdLayers.push(c);
  }

  frontRowPeople = [];
  for (let x = 14; x < W; x += 30 + Math.random()*16){
    const secIdx = clamp(Math.floor((x/W)*4), 0, 3);
    frontRowPeople.push({
      x, phase: Math.random()*6.28,
      color: crowdSections[secIdx].color,
      skin: ['#f0c49a','#d9a066','#a86b3c','#8a5a2b'][Math.floor(Math.random()*4)],
      hair: ['#1a1a1a','#3a2416','#5a3a1a','#0d0d0d'][Math.floor(Math.random()*4)]
    });
  }

  crowdFlags = [
    { x: 240,  color:'#e63946', w:52, phase:0.0 },
    { x: 620,  color:'#3a86ff', w:44, phase:1.2 },
    { x: 990,  color:'#ffb703', w:50, phase:2.4 },
    { x: 1330, color:'#2ec4b6', w:46, phase:3.6 }
  ];
}

function drawCrowdPerson(c, p, raise){
  const baseY = STADIUM_BOTTOM - 8;
  const x = p.x;
  const armUp = raise;
  c.strokeStyle = p.skin;
  c.lineWidth = 4.5;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x - 6, baseY - 18);
  c.lineTo(x - 12, baseY - 18 - armUp*20);
  c.moveTo(x + 6, baseY - 18);
  c.lineTo(x + 12, baseY - 18 - armUp*20);
  c.stroke();
  c.fillStyle = p.color;
  c.beginPath(); c.ellipse(x, baseY - 12, 8, 13, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = p.skin;
  c.beginPath(); c.arc(x, baseY - 30, 9, 0, Math.PI*2); c.fill();
  c.fillStyle = p.hair;
  c.beginPath(); c.arc(x, baseY - 32, 9, Math.PI*1.05, Math.PI*2.05); c.fill();
}

    fielders.push({
      homeX: spots[i] + rand(-40, 40),

      patrol: 0, patrolSpeed: 0.5, patrolPhase: Math.random()*6.28,

      skin: skins[i % skins.length],
      hair: hairs[i % hairs.length],
      topSpeed: 340 + Math.random()*200,

      moving: false,
      facing: 1,
      isCatcher: i === 0,
      chasing: false,
      number: String(i + 1),
      playerName: null
    });
  }
  activeFielder = null;
}

/* ==================== INPUT ==================== */
function pointerPos(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / (r.width || 1)),
    y: (e.clientY - r.top)  * (H / (r.height || 1))
  };
}

function hitButton(p){
  for (let i = menuButtons.length-1; i>=0; i--){
    const b = menuButtons[i];
    if (p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h) return b;
  }
  for (let i = extraHits.length-1; i>=0; i--){
    const b = extraHits[i];
    if (p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h) return { id:b.id };
  }
  return null;
}

function onPointerDown(e){
  e.preventDefault();
  const p = pointerPos(e);

  // ---- splash skip ----
  if (G.phase === 'splash'){
    G.splashTimer = SPLASH_DURATION;
    return;
  }

  // ---- name entry is tap-anywhere ----
  if (G.phase === 'nameEntry'){
    const btnX = W/2 - 150, btnY = 415, btnW = 300, btnH = 56;
    if (p.x >= btnX && p.x <= btnX+btnW && p.y >= btnY && p.y <= btnY+btnH){
      commitNameEntry();
    } else {
      hiddenInput.value = G.nameEntry.currentText;
      hiddenInput.focus();
      hiddenInput.maxLength = 10;
    }
    return;
  }

  // ---- buttons ----
  const b = hitButton(p);
  if (b){ handleButton(b.id); return; }

  // ---- gameplay taps ----
  if (G.phase === 'power'){ lockPower(); return; }
  if (G.phase === 'air'){ swingAtGulli(); return; }
  if (G.phase === 'turnIntro'){
    if (G.turnIntroTimer > 0.5) startBall();
    return;
  }
  if (G.phase === 'turnEnd'){
    if (G.turnEndTimer > 0.8) advanceAfterTurn();
    return;
  }
}

function onKeyDown(e){
  if (G.phase === 'splash'){ G.splashTimer = SPLASH_DURATION; return; }

  if (G.phase === 'login' || G.phase === 'register' || G.phase === 'guest'){
    if (e.key === 'Enter'){
      if (ACCOUNT.formFocus === 'password' && G.phase === 'login') handleButton('doLogin');
      else if (ACCOUNT.formFocus === 'password' && G.phase === 'register') handleButton('doRegister');
      else if (G.phase === 'guest') handleButton('doGuest');
      else if (G.phase === 'login'){ ACCOUNT.formFocus = 'password'; syncHiddenInput(); }
      else { ACCOUNT.formFocus = 'password'; syncHiddenInput(); }
    }
    return;
  }

  if (G.phase === 'nameEntry'){
    if (e.key === 'Enter') commitNameEntry();
    else if (e.key === 'Backspace'){ G.nameEntry.currentText = G.nameEntry.currentText.slice(0,-1); }
    else if (e.key.length === 1 && G.nameEntry.currentText.length < 10){
      G.nameEntry.currentText += e.key.toUpperCase();
    }
    return;
  }

  if (e.code === 'Space' || e.key === 'Enter'){
    e.preventDefault();
    if (G.phase === 'power') lockPower();
    else if (G.phase === 'air') swingAtGulli();
    else if (G.phase === 'turnIntro' && G.turnIntroTimer > 0.5) startBall();
    else if (G.phase === 'turnEnd' && G.turnEndTimer > 0.8) advanceAfterTurn();
    return;
  }

  if (G.phase === 'power' || G.phase === 'air'){
    if (e.key === '1') G.shotType = 'PUSH';
    if (e.key === '2') G.shotType = 'DRIVE';
    if (e.key === '3') G.shotType = 'LOFT';
  }
}

function syncHiddenInput(){
  hiddenInput.type = (ACCOUNT.formFocus === 'password') ? 'password' : 'text';
  if (ACCOUNT.formFocus === 'username'){ hiddenInput.value = ACCOUNT.formUsername; hiddenInput.maxLength = 15; }
  else if (ACCOUNT.formFocus === 'password'){ hiddenInput.value = ACCOUNT.formPassword; hiddenInput.maxLength = 20; }
  else if (ACCOUNT.formFocus === 'guestName'){ hiddenInput.value = ACCOUNT.formName; hiddenInput.maxLength = 14; }
  try{ hiddenInput.focus({ preventScroll:true }); }catch(err){ hiddenInput.focus(); }
}

hiddenInput.addEventListener('input', function(){
  const v = hiddenInput.value;
  if (ACCOUNT.formFocus === 'username'){ ACCOUNT.formUsername = v.replace(/[^A-Za-z0-9_]/g,'').slice(0,15); hiddenInput.value = ACCOUNT.formUsername; }
  else if (ACCOUNT.formFocus === 'password'){ ACCOUNT.formPassword = v.slice(0,20); }
  else if (ACCOUNT.formFocus === 'guestName'){ ACCOUNT.formName = v.slice(0,14); }
  updateSuggestions();
});

function updateSuggestions(){
  suggestionsOpen = false;
  usernameSuggestions = [];
  if (ACCOUNT.formFocus !== 'username' || ACCOUNT.formUsername.length < 1) return;
  const q = ACCOUNT.formUsername.toLowerCase();
  const all = Object.keys(getAccounts());
  usernameSuggestions = all.filter(u=>u.toLowerCase().startsWith(q) && u.toLowerCase() !== q).slice(0,4);
  suggestionsOpen = usernameSuggestions.length > 0;
}

/* ==================== BUTTON ACTIONS ==================== */
function handleButton(id){
  // market items
  if (id.indexOf('item_') === 0){
    marketClick(parseInt(id.slice(5),10));
    return;
  }
  // level buttons
  if (id.indexOf('lvl_') === 0){
    startLevel(parseInt(id.slice(4),10));
    return;
  }
  // market tabs
  if (id.indexOf('tab_') === 0){
    G.marketTab = id.slice(4);
    rebuildMenuButtons();
    return;
  }

  switch(id){
    case 'doLogin': doLogin(); break;
    case 'gotoRegister': ACCOUNT.error=''; ACCOUNT.formPassword=''; ACCOUNT.formFocus='username'; setPhase('register'); break;
    case 'backToLogin': ACCOUNT.error=''; ACCOUNT.formFocus='username'; setPhase('login'); break;
    case 'doRegister': doRegister(); break;
    case 'doGuest': doGuest(); break;
    case 'guestbox': ACCOUNT.error=''; ACCOUNT.formFocus='guestName'; setPhase('guest'); break;
    case 'back': goBack(); break;
    case 'logout':
      ACCOUNT.isGuest = true; ACCOUNT.username=''; ACCOUNT.name=''; ACCOUNT.formUsername=''; ACCOUNT.formPassword='';
      ACCOUNT.formFocus = 'username'; ACCOUNT.error='';
      setPhase('login');
      break;
    case 'single': G.levelPage = 0; setPhase('levelSelect'); break;
    case 'multi': setPhase('playerSelect'); break;
    case 'online': startOnlineSearch(); break;
    case 'market': G.marketMsg=''; G.marketMsgTimer=0; setPhase('market'); break;
    case 'leaderboard': loadLeaderboard(); setPhase('leaderboard'); break;
    case 'pagePrev': G.levelPage = Math.max(0, G.levelPage-1); rebuildMenuButtons(); break;
    case 'pageNext': G.levelPage = Math.min(19, G.levelPage+1); rebuildMenuButtons(); break;
    case 'p2': startLocalMulti(2); break;
    case 'p3': startLocalMulti(3); break;
    case 'p4': startLocalMulti(4); break;
    case 'start': startBall(); break;
    case 'continue': advanceAfterTurn(); break;
    case 'retry':
      if (G.mode === 'single') startLevel(G.level);
      else if (G.mode === 'onlineResults') startOnlineSearch();
      break;
    case 'nextLevel': startLevel(G.level + 1); break;
    case 'levelSelect': G.levelPage = Math.floor((G.level-1)/5); setPhase('levelSelect'); break;
    case 'rematch':
      if (G.mode === 'onlineResults') startOnlineSearch();
      else setPhase('menu');
      break;
    case 'menu': setPhase('menu'); break;
    case 'cancel': setPhase('menu'); break;
    case 'focus_username':
      ACCOUNT.formFocus = 'username'; ACCOUNT.error=''; syncHiddenInput(); updateSuggestions(); break;
    case 'focus_password':
      ACCOUNT.formFocus = 'password'; ACCOUNT.error=''; suggestionsOpen=false; syncHiddenInput(); break;
    case 'focus_guestName':
      ACCOUNT.formFocus = 'guestName'; ACCOUNT.error=''; suggestionsOpen=false; syncHiddenInput(); break;
    case 'profileCard':
      if (!ACCOUNT.isGuest || ACCOUNT.name) setPhase('profileView');
      break;
    case 'logoutCard':
      handleButton('logout');
      break;
    case 'privacy': toast('Privacy: we store data locally on your device.'); break;
    case 'about': toast('Gulli Danda Championship — powered by PRADEEP SINGH'); break;
    case 'contact': toast('Contact: support@gullidanda.game'); break;
  }
}

let toastMsg = '', toastTimer = 0;
function toast(m){ toastMsg = m; toastTimer = 3; }

function goBack(){
  if (G.phase === 'levelSelect' || G.phase === 'playerSelect' || G.phase === 'market' ||
      G.phase === 'leaderboard' || G.phase === 'profileView'){ setPhase('menu'); return; }
  if (G.phase === 'register' || G.phase === 'guest'){ setPhase('login'); return; }
  setPhase('menu');
}

/* ==================== AUTH ==================== */
function doLogin(){
  const u = ACCOUNT.formUsername.trim();
  const p = ACCOUNT.formPassword;
  ACCOUNT.error = '';
  if (!u || !p){ ACCOUNT.error = 'Enter username and password'; return; }
  ACCOUNT.loading = true;
  setTimeout(function(){
    const all = getAccounts();
    ACCOUNT.loading = false;
    const rec = all[u];
    if (!rec){ ACCOUNT.error = 'No such account — create one'; return; }
    if (rec.password && rec.password !== p){ ACCOUNT.error = 'Wrong password'; return; }
    applyAccountData(rec);
    ACCOUNT.formPassword = '';
    ACCOUNT.formFocus = null;
    loadLeaderboard();
    setPhase('menu');
  }, 350);
}

function doRegister(){
  const u = ACCOUNT.formUsername.trim();
  const p = ACCOUNT.formPassword;
  ACCOUNT.error = '';
  if (!/^[A-Za-z0-9_]{3,15}$/.test(u)){ ACCOUNT.error = 'Username: 3-15 letters/numbers/_'; return; }
  if (p.length < 4 || p.length > 20){ ACCOUNT.error = 'Password: 4-20 characters'; return; }
  ACCOUNT.loading = true;
  setTimeout(function(){
    const all = getAccounts();
    ACCOUNT.loading = false;
    if (all[u]){ ACCOUNT.error = 'Username already taken'; return; }
    all[u] = {
      username:u, name:u, password:p,
      coins:200, lives:1, bestSingle:0, bestOnline:0,
      wins:0, losses:0, matchesPlayed:0, totalRuns:0,
      highestUnlockedLevel:1,
      ownedSkins:['classic'], activeSkin:'classic',
      ownedDandas:['wood'], activeDanda:'wood',
      ownedBoosts:['none'], activeBoost:'none'
    };
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(all));
    applyAccountData(all[u]);
    ACCOUNT.formPassword = '';
    ACCOUNT.formFocus = null;
    loadLeaderboard();
    setPhase('menu');
  }, 400);
}

function doGuest(){
  const n = (ACCOUNT.formName || '').trim();
  ACCOUNT.error = '';
  if (n.length < 2){ ACCOUNT.error = 'Type a name (2+ chars)'; return; }
  ACCOUNT.isGuest = true;
  ACCOUNT.username = '';
  ACCOUNT.name = n.toUpperCase();
  ACCOUNT.coins = 100;
  ACCOUNT.lives = 1;
  ACCOUNT.highestUnlockedLevel = 1;
  ACCOUNT.ownedSkins = ['classic']; ACCOUNT.activeSkin = 'classic';
  ACCOUNT.ownedDandas = ['wood'];   ACCOUNT.activeDanda = 'wood';
  ACCOUNT.ownedBoosts = ['none'];   ACCOUNT.activeBoost = 'none';
  ACCOUNT.formFocus = null;
  try{ hiddenInput.blur(); }catch(e){}
  loadLeaderboard();
  setPhase('menu');
}

/* ==================== MARKET ==================== */
function marketClick(idx){
  const tab = G.marketTab;
  if (tab === 'lives'){
    if (ACCOUNT.coins >= LIFE_PRICE){
      ACCOUNT.coins -= LIFE_PRICE;
      ACCOUNT.lives += 1;
      sfxCoin(); saveAccount();
      marketMsg('❤️ Extra life purchased! You now have ' + ACCOUNT.lives);
    } else marketMsg('❌ Not enough coins (need ' + LIFE_PRICE + ')');
    return;
  }
  if (tab === 'skins'){
    const item = SHOP_SKINS[idx]; if (!item) return;
    if (ACCOUNT.ownedSkins.indexOf(item.id) >= 0){ ACCOUNT.activeSkin = item.id; marketMsg('✓ Equipped ' + item.name); }
    else if (ACCOUNT.coins >= item.price){
      ACCOUNT.coins -= item.price; ACCOUNT.ownedSkins.push(item.id); ACCOUNT.activeSkin = item.id;
      sfxCoin(); marketMsg('🎉 Purchased ' + item.name + '!');
    } else marketMsg('❌ Not enough coins (need ' + item.price + ')');
    saveAccount(); rebuildMenuButtons(); return;
  }
  if (tab === 'dandas'){
    const item = SHOP_DANDAS[idx]; if (!item) return;
    if (ACCOUNT.ownedDandas.indexOf(item.id) >= 0){ ACCOUNT.activeDanda = item.id; marketMsg('✓ Equipped ' + item.name); }
    else if (ACCOUNT.coins >= item.price){
      ACCOUNT.coins -= item.price; ACCOUNT.ownedDandas.push(item.id); ACCOUNT.activeDanda = item.id;
      sfxCoin(); marketMsg('🎉 Purchased ' + item.name + '!');
    } else marketMsg('❌ Not enough coins (need ' + item.price + ')');
    saveAccount(); rebuildMenuButtons(); return;
  }
  if (tab === 'boosts'){
    const item = SHOP_BOOSTS[idx]; if (!item) return;
    if (ACCOUNT.ownedBoosts.indexOf(item.id) >= 0){ ACCOUNT.activeBoost = item.id; marketMsg('✓ Equipped ' + item.name); }
    else if (ACCOUNT.coins >= item.price){
      ACCOUNT.coins -= item.price; ACCOUNT.ownedBoosts.push(item.id); ACCOUNT.activeBoost = item.id;
      sfxCoin(); marketMsg('🎉 Purchased ' + item.name + '!');
    } else marketMsg('❌ Not enough coins (need ' + item.price + ')');
    saveAccount(); rebuildMenuButtons(); return;
  }
}
function marketMsg(m){ G.marketMsg = m; G.marketMsgTimer = 2.2; }

/* ==================== GAME FLOW ==================== */
function startLevel(n){
  G.mode = 'single';
  G.level = n;
  G.score = 0; G.best = 0; G.outs = 0;
  G.currentPlayer = 0;
  G.players = [{ name: ACCOUNT.name || 'YOU', color: getActiveSkin().color, score: 0 }];
  G.levelCleared = false;
  G.coinsEarned = 0;
  G.turnEndDone = false;
  buildFielders();
  resetGulli();
  G.turnIntroTimer = 0;
  setPhase('turnIntro');
}

function startLocalMulti(count){
  G.mode = 'multi';
  G.players = [];
  for (let i=0; i<count; i++){
    G.players.push({ name: PLAYER_NAMES[i], color: PLAYER_COLORS[i], score: 0 });
  }
  G.currentPlayer = 0;
  G.score = 0; G.best = 0; G.outs = 0;
  G.nameEntry = { playerIndex: 0, currentText: '' };
  buildFielders();
  resetGulli();
  setPhase('nameEntry');
}

function commitNameEntry(){
  const idx = G.nameEntry.playerIndex;
  const txt = (G.nameEntry.currentText || '').trim();
  if (txt) G.players[idx].name = txt;
  G.nameEntry.currentText = '';
  try{ hiddenInput.blur(); }catch(e){}

  if (idx === G.players.length - 1){
    // all named -> start match
    G.currentPlayer = 0;
    G.score = 0; G.outs = 0;
    for (const p of G.players) p.score = 0;
    buildFielders();
    resetGulli();
    G.turnIntroTimer = 0;
    setPhase('turnIntro');
  } else {
    G.nameEntry.playerIndex = idx + 1;
  }
}

function startOnlineSearch(){
  G.mode = 'online';
  NET.myName = ACCOUNT.name || 'YOU';
  NET.oppName = '';
  NET.statusMsg = 'Searching...';
  NET.searching = true;
  NET.searchStart = performance.now();
  NET.botResult = false;
  NET.playerBatted = false;
  NET.myScore = 0;
  NET.oppScore = 0;
  setPhase('searching');
}

function randomOpponentName(){
  const a = ['GULLI','DANDA','STREET','GULLY','POWER','TURBO','MEGA','SUPER','ROCKET','THUNDER'];
  const b = ['KING','MASTER','PRO','STAR','HERO','BOSS','LEGEND','CHAMP','ACE','WOLF'];
  return a[Math.floor(Math.random()*a.length)] + '_' + b[Math.floor(Math.random()*b.length)];
}

function startOnlineInnings(){
  G.mode = 'online';
  G.score = 0; G.best = 0; G.outs = 0;
  G.currentPlayer = 0;
  G.players = [{ name: ACCOUNT.name || 'YOU', color: getActiveSkin().color, score: 0 }];
  G.turnEndDone = false;
  buildFielders();
  resetGulli();
  G.turnIntroTimer = 0;
  setPhase('turnIntro');
}

function simulateBotScore(){
  const base = Math.max(35, NET.myScore || 50);
  return Math.round(base * rand(0.55, 1.35));
}

function finishOnline(){
  G.players = [
    { name: ACCOUNT.name || 'YOU', color: getActiveSkin().color, score: NET.myScore },
    { name: NET.oppName || 'OPPONENT', color: '#3a86ff', score: NET.oppScore }
  ];
  if (NET.myScore > NET.oppScore){ G.gameOverWinner = 0; G.gameOverMsg = 'YOU WIN!'; ACCOUNT.wins++; }
  else if (NET.myScore < NET.oppScore){ G.gameOverWinner = 1; G.gameOverMsg = (NET.oppName||'OPPONENT') + ' WINS!'; ACCOUNT.losses++; }
  else { G.gameOverWinner = -1; G.gameOverMsg = 'DRAW'; }

  ACCOUNT.matchesPlayed++;
  ACCOUNT.bestOnline = Math.max(ACCOUNT.bestOnline, NET.myScore);
  ACCOUNT.coins += Math.max(0, Math.floor(NET.myScore / COIN_DIVISOR));
  saveAccount();
  loadLeaderboard();
  setPhase('onlineResults');
}

/* ---------- BALL LOOP ---------- */
function startBall(){
  resetGulli();
  G.power = 0; G.powerDir = 1;
  G.outcome = ''; G.outReason = '';
  G.hitDistance = 0; G.hitAcc = 0;
  G.resultTimer = 0; G.resultScored = false;
  G.fieldTimer = 0; G.throwTimer = 0;
  G.zonePop = 0;
  for (const f of fielders){ f.x = f.homeX; f.moving = false; }
  activeFielder = null;
  setPhase('power');
}

function lockPower(){
  if (G.phase !== 'power') return;
  G.swingTimer = G.swingDur;
  sfxHit(0.5);
  gulli.x = GULLI_START_X;
  gulli.y = GROUND_Y - 40;
  gulli.vx = 0;
  gulli.vy = -1050;
  gulli.rot = 0;
  gulli.rotV = 14;
  gulli.grounded = false;
  setPhase('air');
}

function swingAtGulli(){
  if (G.phase !== 'air') return;
  const d = Math.hypot(gulli.x - ZONE_X, gulli.y - ZONE_Y);
  const acc = clamp(1 - d / (ZONE_R * 1.2), 0, 1);

  const shot = SHOTS[G.shotType] || SHOTS.DRIVE;
  const boost = getActiveBoost().bonus;
  const pf = 0.62 + (G.power / 100) * 0.55;
  const af = 0.55 + acc * 0.55;

  const sp = shot.speed * pf * af * (1 + boost);
  const lf = shot.loft  * pf * (0.70 + acc * 0.45) * (1 + boost * 0.6);

  gulli.vx = sp;
  gulli.vy = -lf;
  gulli.rotV = 8 + Math.random() * 6;
  gulli.grounded = false;

  G.swingTimer = G.swingDur;
  G.hitAcc = acc;
  G.ring = { x: gulli.x, y: gulli.y, t: 0, acc: acc };
  shake = Math.min(1, 0.3 + acc * 0.6);
  sfxHit(acc);

  for (let i=0; i<20; i++){
    G.particles.push({
      x: gulli.x, y: gulli.y,
      vx: (Math.random()-0.2) * 420,
      vy: (Math.random()-0.7) * 420,
      life: 0.6, max: 0.6,
      size: 2 + Math.random()*3,
      c: acc > 0.85 ? '#ffd166' : '#ffffff',
      g: 900, spark: true
    });
  }

  if (acc > 0.9){
    G.banner = 'PERFECT!'; G.bannerTimer = 1.3;
    crowdWave = 1;
    shake = 1;
  } else if (acc > 0.65){
    G.banner = 'GREAT!'; G.bannerTimer = 0.9;
  }
  setPhase('fly');
}

function startFielding(){
  G.fieldTimer = 0;
  let best = null, bestD = Infinity;
  for (const f of fielders){
    const d = Math.abs(f.x - gulli.x);
    if (d < bestD){ bestD = d; best = f; }
  }
  activeFielder = best;
  if (!best){ endShot(G.hitDistance, 'safe', ''); return; }
  setPhase('fielding');
}

function endShot(dist, outcome, reason){
  G.hitDistance = dist;
  G.outcome = outcome;
  G.outReason = reason || '';
  G.resultTimer = 0;
  G.resultScored = false;
  G.resultFocus = gulli.x;
  if (outcome === 'out'){
    G.banner = reason === 'caught' ? 'CAUGHT!' : reason === 'danda' ? 'OUT!' : 'MISS!';
    sfxOut();
    shake = 0.8;
  } else {
    G.banner = 'SAFE!';
  }
  G.bannerTimer = 1.7;
  setPhase('result');
}

function nextBall(){
  resetGulli();
  G.power = 0; G.powerDir = 1;
  G.outcome = ''; G.outReason = '';
  G.hitDistance = 0;
  G.resultTimer = 0; G.resultScored = false;
  G.zonePop = 0;
  for (const f of fielders){ f.x = f.homeX; f.moving = false; }
  activeFielder = null;
  setPhase('power');
}

function advanceAfterTurn(){
  if (G.mode === 'single'){
    setPhase('gameOver');
    return;
  }
  if (G.mode === 'multi'){
    // next player
    for (let i=G.currentPlayer+1; i<G.players.length; i++){
      if (!G.players[i].done){
        G.currentPlayer = i;
        G.score = 0; G.outs = 0;
        G.turnEndDone = false;
        buildFielders();
        resetGulli();
        G.turnIntroTimer = 0;
        setPhase('turnIntro');
        return;
      }
    }
    // all done -> finish
    let winIdx = 0;
    for (let i=1; i<G.players.length; i++) if (G.players[i].score > G.players[winIdx].score) winIdx = i;
    G.gameOverWinner = winIdx;
    setPhase('gameOver');
    return;
  }
  if (G.mode === 'online'){
    if (NET.botResult) finishOnline();
    else { G.botBattingTimer = 0; setPhase('botBatting'); }
    return;
  }
  setPhase('menu');
}

/* ==================== UPDATE ==================== */
function update(dt){
  const t = performance.now() / 1000;

  if (toastTimer > 0) toastTimer -= dt;
  if (G.bannerTimer > 0) G.bannerTimer -= dt;
  if (G.marketMsgTimer > 0) G.marketMsgTimer -= dt;
  if (G.swingTimer > 0) G.swingTimer = Math.max(0, G.swingTimer - dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);

  // ---- particles ----
  for (let i = G.particles.length-1; i >= 0; i--){
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0){ G.particles.splice(i,1); continue; }
    p.x += (p.vx || 0) * dt;
    p.y += (p.vy || 0) * dt;
    if (p.g) p.vy += p.g * dt;
    if (p.rotV) p.rot = (p.rot || 0) + p.rotV * dt;
    if (p.confetti && p.y > GROUND_Y){ p.y = GROUND_Y; p.vy *= -0.35; p.vx *= 0.7; }
  }
  if (G.ring){ G.ring.t += dt * 2.4; if (G.ring.t >= 1) G.ring = null; }

  // ---- crowd ----
  let ce = 0.18;
  if (G.phase === 'fly') ce = 0.8;
  else if (G.phase === 'fielding') ce = 0.6;
  else if (G.phase === 'throw') ce = 0.9;
  else if (G.phase === 'result') ce = G.outcome === 'out' ? 0.4 : 0.85;
  else if (G.phase === 'air') ce = 0.42;
  else if (G.phase === 'power') ce = 0.3;
  else if (G.phase === 'gameOver' || G.phase === 'onlineResults') ce = 1;
  crowdExcitement += (ce - crowdExcitement) * Math.min(1, dt * 2.5);
  if (crowdWave > 0) crowdWave = Math.max(0, crowdWave - dt * 0.55);

  if (Math.random() < crowdExcitement * 0.35 && flashes.length < 30){
    flashes.push({
      x: 40 + Math.random() * (W - 80),
      y: STADIUM_TOP + 20 + Math.random() * (STADIUM_BOTTOM - STADIUM_TOP - 40),
      life: 0.35, max: 0.35
    });
  }
  for (let i = flashes.length-1; i >= 0; i--){
    flashes[i].life -= dt;
    if (flashes[i].life <= 0) flashes.splice(i,1);
  }

  // ---- camera ----
  let camTarget = PLAYER_X - 340;
  if (G.phase === 'fly' || G.phase === 'fielding' || G.phase === 'throw'){
    camTarget = Math.max(PLAYER_X - 340, gulli.x - 820);
  } else if (G.phase === 'result'){
    camTarget = Math.max(PLAYER_X - 340, G.resultFocus - 820);
  }
  camX += (camTarget - camX) * Math.min(1, dt * 3.2);

  // ---- phases ----
  switch (G.phase){

    case 'splash':
      G.splashTimer += dt;
      if (G.splashTimer >= SPLASH_DURATION){
        if (ACCOUNT.username && !ACCOUNT.isGuest){ loadLeaderboard(); setPhase('menu'); }
        else { ACCOUNT.formFocus = 'username'; setPhase('login'); }
      }
      break;

    case 'searching':
      if (performance.now() - NET.searchStart > 3000){
        NET.oppName = randomOpponentName();
        NET.searching = false;
        NET.tossStartTime = performance.now();
        NET.tossWinner = Math.random() < 0.5 ? 'me' : 'opp';
        setPhase('toss');
      }
      break;

    case 'toss':
      if (performance.now() - NET.tossStartTime > TOSS_DURATION * 1000){
        NET.tossResultStart = performance.now();
        setPhase('tossResult');
      }
      break;

    case 'tossResult':
      if (performance.now() - NET.tossResultStart > TOSS_RESULT_DURATION * 1000){
        if (NET.tossWinner === 'me'){
          NET.playerBatted = false;
          NET.botResult = false;
          startOnlineInnings();
        } else {
          NET.playerBatted = false;
          NET.botResult = false;
          NET.myScore = 0;
          G.score = 0;
          G.botBattingTimer = 0;
          setPhase('botBatting');
        }
      }
      break;

    case 'botBatting':
      G.botBattingTimer += dt;
      if (G.botBattingTimer > 5.0){
        NET.oppScore = simulateBotScore();
        NET.botResult = true;
        if (NET.playerBatted) finishOnline();
        else startOnlineInnings();
      }
      break;

    case 'turnIntro':
      G.turnIntroTimer += dt;
      if (G.turnIntroTimer > 2.8) startBall();
      break;

    case 'power': {
      G.power += G.powerDir * dt * 120;
      if (G.power >= 100){ G.power = 100; G.powerDir = -1; }
      if (G.power <= 0){ G.power = 0; G.powerDir = 1; }
      gulli.x = GULLI_START_X;
      gulli.y = GROUND_Y - 8;
      gulli.rot = 0;
      break;
    }

    case 'air': {
      gulli.vy += GRAVITY * dt;
      gulli.y += gulli.vy * dt;
      gulli.rot += gulli.rotV * dt;
      G.zonePop = clamp(1 - Math.abs(gulli.y - ZONE_Y) / (ZONE_R * 1.8), 0, 1);
      if (gulli.vy > 0 && gulli.y > GROUND_Y - 8){
        gulli.y = GROUND_Y - 8;
        gulli.vy = 0;
        gulli.grounded = true;
        endShot(0, 'out', 'miss');
      }
      break;
    }

    case 'fly': {
      gulli.vy += GRAVITY * dt;
      gulli.x += gulli.vx * dt;
      gulli.y += gulli.vy * dt;
      gulli.rot += gulli.rotV * dt;
      if (gulli.x > GULLI_START_X) G.hitDistance = (gulli.x - GULLI_START_X) / PPM;

      // catch check
      if (gulli.vy > 0 && gulli.y > GROUND_Y - 200 && G.hitDistance > 4){
        for (const f of fielders){
          if (Math.abs(f.x - gulli.x) < 30){
            gulli.grounded = true;
            endShot(G.hitDistance, 'out', 'caught');
            return;
          }
        }
      }

      if (!gulli.rolling && gulli.vy > 0 && gulli.y >= GROUND_Y - 8){
        gulli.y = GROUND_Y - 8;
        gulli.vy = 0;
        gulli.grounded = true;
        gulli.rolling = true;
        shake = Math.max(shake, 0.25);
      }
      if (gulli.rolling){
        gulli.x += gulli.vx * dt;
        gulli.vx *= Math.pow(0.30, dt);
        gulli.rot += gulli.rotV * dt * 0.5;
        if (Math.abs(gulli.vx) < 45){
          gulli.vx = 0;
          gulli.rolling = false;
          G.hitDistance = (gulli.x - GULLI_START_X) / PPM;
          startFielding();
        }
      }
      break;
    }

    case 'fielding': {
      if (!activeFielder){ startFielding(); break; }
      const f = activeFielder;
      const dx = gulli.x - f.x;
      f.moving = true;
      f.facing = dx >= 0 ? 1 : -1;
      f.runPhase += dt * 15;
      f.speed = f.topSpeed;
      const step = f.topSpeed * dt;
      if (Math.abs(dx) <= step) f.x = gulli.x;
      else f.x += Math.sign(dx) * step;

      G.fieldTimer += dt;
      if (Math.abs(gulli.x - f.x) < 14){
        f.moving = false;
        f.speed = 0;
        G.throwTimer = 0;
        G.throwFrom = { x: f.x, y: GROUND_Y - 60 };
        setPhase('throw');
      } else if (G.fieldTimer > 7){
        endShot(G.hitDistance, 'safe', '');
      }
      break;
    }

    case 'throw': {
      G.throwTimer += dt;
      const dur = 0.85;
      const p = clamp(G.throwTimer / dur, 0, 1);
      const fx = G.throwFrom.x, fy = G.throwFrom.y;
      const tx = DANDA_X, ty = GROUND_Y - 4;
      gulli.x = lerp(fx, tx, p);
      gulli.y = lerp(fy, ty, p) - Math.sin(p * Math.PI) * 140;
      gulli.rot += dt * 22;

      if (p >= 1){
        const distPx = Math.abs(fx - DANDA_X);
        const chance = clamp(0.78 - distPx / 2600, 0.12, 0.78);
        if (Math.random() < chance){
          gulli.x = DANDA_X;
          gulli.y = GROUND_Y - 8;
          endShot(G.hitDistance, 'out', 'danda');
        } else {
          gulli.x = DANDA_X + rand(-70, 70);
          gulli.y = GROUND_Y - 8;
          G.outcome = 'safe';
          endShot(G.hitDistance, 'safe', '');
        }
      }
      break;
    }

    case 'result': {
      G.resultTimer += dt;
      if (G.resultTimer > 0.25 && !G.resultScored){
        G.resultScored = true;
        if (G.outcome !== 'out'){
          const pts = Math.max(1, Math.round(G.hitDistance));
          G.score += pts;
          G.best = Math.max(G.best, G.score);
          for (let i=0; i<26; i++){
            G.particles.push({
              x: camX + Math.random() * W, y: -30 - Math.random() * 220,
              vx: (Math.random()-0.5) * 90, vy: 60 + Math.random() * 140,
              life: 2.6, max: 2.6, size: 5 + Math.random() * 7,
              c: ['#ffd166','#e63946','#3a86ff','#2ec4b6','#ff4d9d'][i % 5],
              confetti: true, rot: Math.random()*6.28, rotV: (Math.random()-0.5)*8
            });
          }
          crowdWave = 1;
        } else {
          G.outs += 1;
          if (G.mode === 'single' && ACCOUNT.lives > 0){
            ACCOUNT.lives -= 1;
            G.outs = 0;
            G.banner = '❤️ LIFE USED!';
            G.bannerTimer = 2.0;
            saveAccount();
          }
        }
      }
      if (G.resultTimer > 2.5){
        if (G.outs >= 1){
          G.turnEndTimer = 0;
          G.turnEndDone = false;
          if (G.mode === 'multi') G.players[G.currentPlayer].done = true;
          setPhase('turnEnd');
        } else {
          nextBall();
        }
      }
      break;
    }

    case 'turnEnd': {
      G.turnEndTimer += dt;
      if (G.mode === 'single'){
        if (G.turnEndTimer > 1.6 && !G.turnEndDone){
          G.turnEndDone = true;
          const lv = getLevel(G.level);
          G.levelCleared = G.score >= lv.target;
          const c = calcCoins(G.score, lv.target);
          ACCOUNT.coins += G.levelCleared ? c.total : c.base;
          G.coinsEarned = G.levelCleared ? c.total : c.base;
          ACCOUNT.totalRuns += G.score;
          if (G.levelCleared){
            ACCOUNT.bestSingle = Math.max(ACCOUNT.bestSingle, G.score);
            if (G.level >= ACCOUNT.highestUnlockedLevel && ACCOUNT.highestUnlockedLevel < 999)
              ACCOUNT.highestUnlockedLevel = G.level + 1;
          }
          saveAccount();
          setPhase('gameOver');
        }
      } else if (G.mode === 'online'){
        if (G.turnEndTimer > 2.2 && !G.turnEndDone){
          G.turnEndDone = true;
          NET.myScore = G.score;
          NET.playerBatted = true;
          if (NET.botResult) finishOnline();
          else { G.botBattingTimer = 0; setPhase('botBatting'); }
        }
      }
      break;
    }

    default: break;
  }
}

function drawStadium(){
  const t = performance.now() / 1000;
  const wallGrd = ctx.createLinearGradient(0, STADIUM_TOP - 16, 0, STADIUM_BOTTOM);
  wallGrd.addColorStop(0, '#28304a'); wallGrd.addColorStop(0.45,'#161d2e'); wallGrd.addColorStop(1, '#080d16');
  ctx.fillStyle = wallGrd; ctx.fillRect(0, STADIUM_TOP - 16, W, STADIUM_BOTTOM - STADIUM_TOP + 16);
  for (const sec of crowdSections){
    const g = ctx.createLinearGradient(0, STADIUM_TOP, 0, STADIUM_BOTTOM);
    g.addColorStop(0, hexA(sec.color, 0.04)); g.addColorStop(1, hexA(sec.color, 0.28));
    ctx.fillStyle = g; ctx.fillRect(sec.x, STADIUM_TOP, sec.w, STADIUM_BOTTOM - STADIUM_TOP);
  }

  /* ---------- NAYA CROWD ANIMATION ---------- */
  const exc = crowdExcitement;
  // peeche ki rows: har row apni alag taal me uchhalti aur jhoomti hai
  for (let r = 0; r < crowdLayers.length; r++){
    if (!crowdLayers[r]) continue;
    const hop  = Math.abs(Math.sin(t*(2.8 + exc*3.2) + r*0.9)) * exc * (2.5 + r*0.5);
    const sway = Math.sin(t*1.3 + r*1.7) * (0.6 + exc*1.5);
    ctx.drawImage(crowdLayers[r], sway, -hop);
  }
  // aage ke log: alag-alag uchhalte, taali bajate, hath uthate, wave me shamil
  for (const p of frontRowPeople){
    const idle = Math.sin(t*1.8 + p.phase) * 0.8;
    const hop  = Math.abs(Math.sin(t*(3 + exc*7) + p.phase*1.7)) * exc * 9;
    const wv   = crowdWave > 0 ? Math.max(0, Math.sin(p.x*0.012 - t*5)) * crowdWave : 0;
    let raise = 0;
    if (exc > 0.45) raise = clamp((exc - 0.45)*1.6 + Math.sin(t*7 + p.phase)*0.35, 0, 1);
    else if (exc > 0.15) raise = 0.25 + 0.2*Math.sin(t*9 + p.phase);
    raise = Math.max(raise, wv);
    ctx.save();
    ctx.translate(Math.sin(t*1.5 + p.phase) * 0.8 * (1 + exc), idle - hop - wv*7);
    drawCrowdPerson(ctx, p, raise);
    ctx.restore();
  }
  /* ------------------------------------------- */

  for (const f of flashes){
    const a = f.life / f.max; const r = 10 + (1 - a) * 16;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0, 'rgba(255,255,255,' + (a * 0.95) + ')');
    g.addColorStop(0.4, 'rgba(210,235,255,' + (a * 0.45) + ')');
    g.addColorStop(1, 'rgba(180,220,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI*2); ctx.fill();
  }
  for (const f of crowdFlags){
    const wob = Math.sin(t * 1.6 + f.phase) * 0.10;
    ctx.save(); ctx.translate(f.x, STADIUM_BOTTOM - 26); ctx.rotate(wob);
    ctx.globalAlpha = 0.9; ctx.fillStyle = f.color;
    rr(ctx, -f.w/2, 0, f.w, 16, 3); ctx.fill();
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#000';
    rr(ctx, -f.w/2, 11, f.w, 5, 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(10,14,24,0.95)'; ctx.fillRect(0, STADIUM_BOTTOM - 6, W, 18);
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(0, STADIUM_BOTTOM - 6, W, 2);
  ctx.fillStyle = '#0d1220'; ctx.fillRect(0, STADIUM_TOP - 16, W, 18);
  ctx.fillStyle = '#1e2736'; ctx.fillRect(0, STADIUM_TOP - 2, W, 3);
  for (let lx = 60; lx < W; lx += 180){
    ctx.fillStyle = 'rgba(255,240,180,0.18)'; ctx.beginPath(); ctx.arc(lx, STADIUM_TOP - 6, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,248,215,0.95)'; ctx.beginPath(); ctx.arc(lx, STADIUM_TOP - 6, 3.2, 0, Math.PI*2); ctx.fill();
  }
}
function drawField(){
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#7cb85c'); g.addColorStop(0.35, '#8fcb6e'); g.addColorStop(1, '#4a8f3c');
  ctx.fillStyle = g; ctx.fillRect(0, HORIZON, W, H - HORIZON);

function drawStar(cx, cy, outer, inner, points){
  ctx.beginPath();
  for (let i=0; i<points*2; i++){
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / points) * i - Math.PI/2;
    const x = cx + Math.cos(a) * r; const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

    { label:'Matches', value: ACCOUNT.matchesPlayed, color:'#e0a95c' },
    { label:'Total Runs', value: ACCOUNT.totalRuns + 'm', color:'#a06bff' }
  ];
  const cols = 3, bw = 170, bh = 54, gap = 12;
  const totalW = cols*bw + (cols-1)*gap;
  const startX = W/2 - totalW/2, startY = 262;
  for (let i=0; i<stats.length; i++){
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col*(bw+gap);
    const y = startY + row*(bh+gap);
    ctx.save();
    rr(ctx, x, y, bw, bh, 10);
    ctx.fillStyle = 'rgba(20,25,40,0.75)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = '700 11px system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';

    ctx.fillText(stats[i].label.toUpperCase(), x + bw/2, y + 15);
    ctx.font = '900 19px system-ui,sans-serif';
    ctx.fillStyle = stats[i].color;
    ctx.fillText(String(stats[i].value), x + bw/2, y + 36);
    ctx.restore();
  }

}

function drawMarketItem(rect, item, opts){
  const { x, y, w, h } = rect;
  const owned = opts.owned;
  const active = opts.active;
  const affordable = ACCOUNT.coins >= item.price;

  ctx.save();
  rr(ctx, x, y, w, h, 14);
  const grd = ctx.createLinearGradient(x, y, x, y+h);
  if (active){
    grd.addColorStop(0, 'rgba(138,255,160,0.25)');
    grd.addColorStop(1, 'rgba(138,255,160,0.06)');
  } else if (owned){
    grd.addColorStop(0, 'rgba(255,209,102,0.20)');
    grd.addColorStop(1, 'rgba(255,209,102,0.05)');
  } else if (affordable){
    grd.addColorStop(0, 'rgba(92,158,224,0.18)');
    grd.addColorStop(1, 'rgba(92,158,224,0.05)');
  } else {
    grd.addColorStop(0, 'rgba(20,25,40,0.75)');
    grd.addColorStop(1, 'rgba(20,25,40,0.55)');
  }
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = active ? '#8affa0' : owned ? '#ffd166' : affordable ? '#5c9ee0' : 'rgba(255,255,255,0.15)';
  ctx.lineWidth = active ? 3 : 2; ctx.stroke();

  if (opts.previewKind === 'skin'){
    const pcx = x + w/2, pcy = y + 42;
    ctx.fillStyle = opts.color;
    rr(ctx, pcx - 9, pcy - 10, 18, 30, 5); ctx.fill();
    ctx.fillStyle = '#f0c49a';
    ctx.beginPath(); ctx.arc(pcx, pcy - 18, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2d3142';
    ctx.beginPath(); ctx.arc(pcx, pcy - 20, 10, Math.PI*1.05, Math.PI*2.05); ctx.fill();
    const d = getActiveDanda();
    ctx.strokeStyle = d.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pcx + 18, pcy - 8); ctx.lineTo(pcx + 40, pcy + 6); ctx.stroke();
  } else if (opts.previewKind === 'danda'){
    const dcx = x + w/2, dcy = y + 42;
    ctx.save(); ctx.translate(dcx, dcy); ctx.rotate(-0.3);
    ctx.fillStyle = opts.color;
    rr(ctx, -45, -5, 90, 10, 5); ctx.fill();
    ctx.fillStyle = opts.accent;
    rr(ctx, -45, -5, 16, 10, 5); ctx.fill();
    rr(ctx, 30, -5, 15, 10, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    rr(ctx, -30, -3, 55, 3, 1.5); ctx.fill();
    ctx.restore();
  } else if (opts.previewKind === 'boost'){
    const bcx = x + w/2, bcy = y + 42;
    ctx.fillStyle = '#c08544';
    rr(ctx, bcx - 20, bcy - 5, 40, 10, 5); ctx.fill();
    ctx.fillStyle = '#8a5a2b';
    rr(ctx, bcx - 20, bcy - 5, 10, 10, 4); ctx.fill();
    ctx.fillStyle = opts.color;
    ctx.font = '900 22px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(opts.speedIcon, bcx, bcy);
    ctx.strokeStyle = opts.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.6;
    for (let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.moveTo(bcx - 28 - i*6, bcy - 8 + i*8);
      ctx.lineTo(bcx - 12 - i*6, bcy - 8 + i*8);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  } else if (opts.previewKind === 'life'){
    const lcx = x + w/2, lcy = y + 38;
    ctx.font = '900 40px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const pulse = 0.9 + 0.1*Math.sin(performance.now()/300);
    ctx.save();
    ctx.translate(lcx, lcy); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ff6b8a';
    ctx.shadowColor = 'rgba(255,107,138,0.7)'; ctx.shadowBlur = 18;
    ctx.fillText('❤️', 0, 0);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  ctx.font = '900 14px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(item.name, x + w/2, y + 84);

  ctx.font = '700 11px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(opts.desc || '', x + w/2, y + 101);

  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

/* ==================== LIVE SPECTATOR ==================== */
function drawSpectatorScene(live, dt){
  if (!live || !live.ph){
    ctx.fillStyle = 'rgba(12,16,28,0.92)';
    ctx.fillRect(0,0,W,H);
    const dots = '.'.repeat(1 + (Math.floor(performance.now()/400) % 3));
    centerText('Connecting to opponent stream' + dots, H/2, 22, 'rgba(255,255,255,0.75)');
    return;
  }

  if (!SPEC.ready){
    SPEC.gx = SPEC.tgx = live.gx || 0;
    SPEC.gy = SPEC.tgy = live.gy || (GROUND_Y - 7);
    SPEC.gr = SPEC.tgr = live.gr || 0;
    SPEC.cx = SPEC.tcx = live.cx || 0;
    SPEC.ready = true;
  }
  SPEC.tgx = live.gx || 0;
  SPEC.tgy = live.gy || (GROUND_Y - 7);
  SPEC.tgr = live.gr || 0;
  SPEC.tcx = live.cx || 0;

  const k = Math.min(1, dt * 20);
  SPEC.gx += (SPEC.tgx - SPEC.gx) * k;
  SPEC.gy += (SPEC.tgy - SPEC.gy) * k;
  SPEC.gr += (SPEC.tgr - SPEC.gr) * k;
  SPEC.cx += (SPEC.tcx - SPEC.cx) * Math.min(1, dt * 10);

  const fList = live.fs || [];
  for (let i = 0; i < fList.length; i++){
    const tx = fList[i][0] || 0;
    if (SPEC.fX[i] === undefined) SPEC.fX[i] = tx;
    else SPEC.fX[i] += (tx - SPEC.fX[i]) * k;
  }
  SPEC.fX.length = fList.length;

  const bakCamX = camX;
  const bakFielders = fielders.slice();
  const bakGulli = { x:gulli.x, y:gulli.y, vx:gulli.vx, vy:gulli.vy, rot:gulli.rot, rotV:gulli.rotV, grounded:gulli.grounded };
  const bakPlayers = G.players, bakCurrent = G.currentPlayer;
  const bakParticles = G.particles, bakRing = G.ring;
  const bakBanner = G.banner, bakBannerT = G.bannerTimer;
  const bakPhase = G.phase, bakPower = G.power, bakShot = G.shotType;
  const bakHit = G.hitDistance, bakOutcome = G.outcome, bakZonePop = G.zonePop;
  const bakOn = SPEC_ON, bakSkin = SPEC_SKIN, bakDanda = SPEC_DANDA;

  camX = SPEC.cx;
  fielders.length = 0;
  for (let i = 0; i < fList.length; i++){
    const f = fList[i];
    fielders.push({
      homeX: f[0], x: SPEC.fX[i] !== undefined ? SPEC.fX[i] : f[0],
      patrol: 0, patrolSpeed: 0, patrolPhase: 0,
      color: f[5] || '#5c9ee0', skin: f[6] || '#f0c49a', hair: f[7] || '#3a2416',
      topSpeed: 700, speed: f[4] || 0,
      runPhase: f[1] || 0, moving: !!f[2], facing: f[3] > 0 ? 1 : -1,
      isCatcher: false, chasing: false, number: f[8] || '', playerName: null
    });
  }
  gulli.x = SPEC.gx;
  gulli.y = SPEC.gy;
  gulli.rot = SPEC.gr;
  gulli.vx = 0;
  gulli.vy = live.gv ? 120 : 0;
  gulli.grounded = live.gg !== 0;
  G.players = [{ name: live.nm || NET.oppName || 'OPPONENT', color: live.sk || '#3a86ff' }];
  G.currentPlayer = 0;
  G.particles = [];
  G.ring = null;
  G.banner = live.bn || '';
  G.bannerTimer = live.bt || 0;
  G.phase = live.ph || 'power';
  G.power = live.pw || 0;
  G.shotType = live.sh || 'DRIVE';
  G.hitDistance = live.bd || 0;
  G.outcome = live.oc || '';
  G.zonePop = 0.6;
  SPEC_ON = true;
  SPEC_SKIN = { id:'spec', name:'', color: live.sk || '#3a86ff', price:0 };
  SPEC_DANDA = { id:'spec', name:'', color: live.dn || '#b07c42', accent: live.da || '#8a5a2b', price:0 };

  try {
    drawSky();
    drawStadium();
    drawField();
    drawDistanceMarkers();
    if (G.phase === 'fielding' || G.phase === 'throw' || G.phase === 'result') drawDandaOnGround();
    drawZone();
    for (const f of fielders) drawFielder(f);
    drawGulli();
    drawPlayer();
    drawPowerMeter('OPPONENT BATTING');
    drawShotSelector(true);
    if (G.bannerTimer > 0 && G.banner){
      let c = '#ffffff';
      if (G.banner === 'MISS!' || G.banner === 'OUT!' || G.banner === 'CAUGHT!') c = '#ff8a8a';
      else if (G.banner === 'PERFECT!') c = '#ffd166';
      else if (G.banner === 'SAFE!') c = '#8affa0';
      centerText(G.banner, 380, 54, c);
    }
    if (G.phase === 'air' && live.gv) centerText('HIT NOW!', 372, 22, '#ffd166');
    if (G.phase === 'fly') centerText(Math.round(G.hitDistance) + ' m', 350, 44, '#ffffff');
    if (G.phase === 'fielding') centerText('FIELDING…', 380, 18, 'rgba(255,255,255,0.9)');
    if (G.phase === 'throw') centerText('THROWING AT THE DANDA!', 380, 18, 'rgba(255,209,102,0.95)');
  } finally {
    camX = bakCamX;
    fielders.length = 0; for (const f of bakFielders) fielders.push(f);
    Object.assign(gulli, bakGulli);
    G.players = bakPlayers; G.currentPlayer = bakCurrent;
    G.particles = bakParticles; G.ring = bakRing;
    G.banner = bakBanner; G.bannerTimer = bakBannerT;
    G.phase = bakPhase; G.power = bakPower; G.shotType = bakShot;
    G.hitDistance = bakHit; G.outcome = bakOutcome; G.zonePop = bakZonePop;
    SPEC_ON = bakOn; SPEC_SKIN = bakSkin; SPEC_DANDA = bakDanda;
  }
}

      ctx.save();
      rr(ctx, x, y, bw, bh, 12);
      ctx.fillStyle = isWinner ? 'rgba(255,209,102,0.20)' : 'rgba(20,25,40,0.78)';
      ctx.fill();
      ctx.strokeStyle = p.color;
      ctx.lineWidth = isWinner ? 3.5 : 2; ctx.stroke();
      ctx.font='900 12px system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = p.color;
      ctx.fillText(i === 0 ? 'YOU' : 'OPPONENT', x + bw/2, y + 17);
      ctx.font='900 26px system-ui,sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(p.score + ' pts', x + bw/2, y + 40);
      ctx.restore();
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    centerText('Coins earned: 🪙 ' + Math.floor(NET.myScore/COIN_DIVISOR), 350, 16, 'rgba(255,209,102,0.85)');
    if (NET.roomRef && !NET.botResult){
      const on = NET.oppName || 'OPPONENT';
      centerText('Series:  YOU ' + NET.series.me + '  –  ' + NET.series.opp + '  ' + on, 385, 16, 'rgba(255,255,255,0.75)');
      let note = '';
      if (NET.forfeitWin || NET.oppLeft) note = on + ' left the match';
      else if (NET.rematchSent) note = 'Waiting for ' + on + ' to accept the rematch...';
      else if (NET.oppRematch) note = on + ' wants a REMATCH!';
      if (note) centerText(note, 415, 17, '#ffd166');
    } else if (NET.forfeitWin){
      centerText((NET.oppName || 'Opponent') + ' left the match', 415, 17, '#ffd166');
    }
    for (const b of menuButtons) drawMenuButton(b, '#ffd166');
    return;
  }
  if (G.mode === 'single'){
    const lv = getLevel(G.level);
    if (G.levelCleared){
      drawTrophy(W/2, 105, 0.75, t);
      const pulse = 0.85 + 0.15*Math.sin(t*4);
      ctx.save(); ctx.globalAlpha = pulse;
      centerText('✨  LEVEL ' + G.level + ' CLEARED!  ✨', 195, 28, '#ffd166');
      ctx.restore();
      centerText('Level ' + G.level + ': ' + G.score + ' pts (target ' + lv.target + ')', 232, 15, 'rgba(255,255,255,0.85)');
      centerText('🔓 UNLOCKED: Level ' + (G.level + 1) + ' — ' + getLevel(G.level+1).name, 256, 14, '#8affa0');
      const c = calcCoins(G.score, lv.target);
      const cx = W/2, cy = 305;
      drawCoinIcon(cx - 90, cy, 22, 1);
      ctx.font = '900 22px system-ui,sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd166';
      ctx.fillText('+ ' + c.total + ' COINS', cx - 60, cy - 8);
      ctx.font = '700 13px system-ui,sans-serif';
      if (c.bonus){
        ctx.fillStyle = '#8affa0';
        ctx.fillText('🎉 BONUS! 2x coins for 2x target!', cx - 60, cy + 14);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('Get ' + (lv.target*2) + ' pts for 2x coins!', cx - 60, cy + 14);
      }
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    } else {
      centerText('LEVEL ' + G.level + ' FAILED', 130, 38, '#ff8a8a');
      centerText('You scored ' + G.score + ' pts — needed ' + lv.target + ' pts', 178, 18, 'rgba(255,255,255,0.85)');
      centerText('Try again to unlock next level!', 208, 15, 'rgba(255,255,255,0.6)');
      if (G.coinsEarned > 0){
        const cx = W/2, cy = 260;
        drawCoinIcon(cx - 80, cy, 18, 0.85);
        ctx.font = '900 18px system-ui,sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffd166';
        ctx.fillText('+ ' + G.coinsEarned + ' COINS earned (kept)', cx - 55, cy);
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      }
    }
  } else {
    const w = G.players[G.gameOverWinner];
    const glowPulse = 0.55 + 0.45 * Math.sin(t * 2.5);
    ctx.save(); ctx.globalAlpha = glowPulse * 0.45;
    const glow = ctx.createRadialGradient(W/2, 105, 5, W/2, 105, 260);
    glow.addColorStop(0, w.color); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, 280);
    ctx.restore();
    drawTrophy(W/2, 100, 0.85, t);
    const pulse = 0.88 + 0.12*Math.sin(t*5);
    ctx.save(); ctx.globalAlpha = pulse;
    centerText('✨  CONGRATULATIONS  ✨', 200, 32, '#ffd166');
    ctx.restore();
    ctx.save();
    ctx.font = '900 78px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.lineWidth = 14; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(20,25,45,0.7)';
    ctx.strokeText(w.name, W/2, 275);
    ctx.shadowColor = w.color; ctx.shadowBlur = 30;
    ctx.fillStyle = w.color; ctx.fillText(w.name, W/2, 275);
    ctx.shadowBlur = 0; ctx.restore();
    centerText('WINS THE MATCH!', 315, 26, '#ffffff');
    const sorted = G.players.map((p, i)=>({p, i})).sort((a,b)=>b.p.score - a.p.score);
    const bw = 240, bh = 34, gap = 8;
    const startY = 335;
    for (let k=0; k<sorted.length; k++){
      const s = sorted[k];
      const p = s.p, i = s.i;
      const y = startY + k*(bh + gap);
      const isWinner = (i === G.gameOverWinner);
      ctx.save();
      rr(ctx, W/2 - bw/2, y, bw, bh, 8);
      ctx.fillStyle = isWinner ? 'rgba(255,209,102,0.20)' : 'rgba(20,25,40,0.78)';
      ctx.fill();
      ctx.strokeStyle = p.color;
      ctx.lineWidth = isWinner ? 3 : 1.5; ctx.stroke();
      ctx.font = '900 14px system-ui,sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillStyle = p.color;
      const medal = k===0 ? '🥇' : k===1 ? '🥈' : k===2 ? '🥉' : '  ';
      ctx.fillText(medal + '  ' + p.name, W/2 - bw/2 + 16, y + bh/2);
      ctx.textAlign='right';
      ctx.fillStyle = isWinner ? '#ffd166' : '#ffffff';
      ctx.font = '900 16px system-ui,sans-serif';
      ctx.fillText(p.score + ' pts', W/2 + bw/2 - 16, y + bh/2);
      ctx.restore();
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  for (const b of menuButtons) drawMenuButton(b, '#ffd166');
}
function drawSearching(){
  ctx.fillStyle = 'rgba(12,16,28,0.88)';
  ctx.fillRect(0,0,W,H);
  centerText('🌐  SEARCHING FOR PLAYERS', 170, 38, '#ffd166');
  const dots = '.'.repeat(1 + (Math.floor(performance.now()/300) % 3));
  centerText('Looking for an opponent' + dots, 235, 22, 'rgba(255,255,255,0.85)');
  centerText('Name: ' + NET.myName, 285, 17, 'rgba(255,209,102,0.9)');
  const t = performance.now()/1000;
  const r = 34, cx = W/2, cy = 380;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,209,102,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx, cy, r, t*4, t*4 + Math.PI*1.2); ctx.stroke();
  ctx.restore();
  centerText(NET.statusMsg || 'Searching...', 460, 14, 'rgba(255,209,102,0.85)');
  const elapsed = performance.now() - NET.searchStart;
  const remain = Math.max(0, 30 - Math.floor(elapsed / 1000));
  const barW = 300, barH = 5, barX = W/2 - barW/2, barY = 485;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  rr(ctx, barX, barY, barW, barH, 2); ctx.fill();
  ctx.fillStyle = remain > 10 ? '#8affa0' : remain > 5 ? '#ffbe0b' : '#ff8a8a';
  rr(ctx, barX, barY, barW * (elapsed / 30000 > 1 ? 1 : elapsed / 30000), barH, 2); ctx.fill();
  centerText(NET.searching ? ('Auto-pilot bot in ' + remain + 's') : 'Linking with opponent...', 510, 12, 'rgba(255,255,255,0.65)');
  for (const b of menuButtons) drawMenuButton(b);
}

/* ==================== JOIN POPUP + BOT BATTING ==================== */
function drawJoinPopup(){
  if (!NET.joinPopup || NET.joinPopupTimer <= 0) return;
  const popup = NET.joinPopup;
  const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 200);
  const bw = 440, bh = 80;
  const bx = W/2 - bw/2, by = 90;

  ctx.save();
  ctx.globalAlpha = Math.min(1, NET.joinPopupTimer / 2);

  ctx.shadowColor = 'rgba(138,255,160,' + (pulse * 0.9) + ')';
  ctx.shadowBlur = 26 + pulse * 8;

  rr(ctx, bx, by, bw, bh, 16);
  const grd = ctx.createLinearGradient(bx, by, bx, by+bh);
  grd.addColorStop(0, 'rgba(35,70,50,0.97)');
  grd.addColorStop(1, 'rgba(15,30,25,0.97)');
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = '#8affa0'; ctx.lineWidth = 3; ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.font = '900 26px system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd166';
  ctx.fillText('🔔', bx + 18, by + bh/2);

  ctx.font = '900 22px system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8affa0';
  ctx.fillText(popup.name + ' IS ONLINE!', bx + 58, by + 26);

  ctx.font = '700 13px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('Linked automatically — match is on!', bx + 58, by + 54);

  const ax = bx + bw - 36 + Math.sin(performance.now()/280) * 5;
  ctx.fillStyle = '#8affa0';
  ctx.font = '900 30px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▶', ax, by + bh/2);

  const pbW = bw - 40, pbX = bx + 20, pbY = by + bh - 8;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  rr(ctx, pbX, pbY, pbW, 4, 2); ctx.fill();
  ctx.fillStyle = '#8affa0';
  rr(ctx, pbX, pbY, pbW * (NET.joinPopupTimer / 4), 4, 2); ctx.fill();

  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function drawBotBattingOverlay(){
  if (G.phase !== 'botBatting') return;
  ctx.fillStyle = 'rgba(12,16,28,0.88)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;
  const cx = W/2, cy = 200;
  const bob = Math.sin(t * 3) * 6;

  ctx.save();
  ctx.translate(cx, cy + bob);

  const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 100);
  glow.addColorStop(0, 'rgba(92,158,224,0.5)');
  glow.addColorStop(1, 'rgba(92,158,224,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI*2); ctx.fill();

  ctx.font = '900 84px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🤖', 0, 0);
  ctx.restore();

  centerText('🤖 AUTO-PILOT IS BATTING...', 320, 30, '#5c9ee0');
  centerText('Your score: ' + G.score + ' pts', 360, 22, '#ffd166');

  const dots = '.'.repeat(1 + (Math.floor(performance.now()/400) % 3));
  centerText('Simulating opponent innings' + dots, 400, 16, 'rgba(255,255,255,0.75)');

  const pbW = 380, pbH = 6, pbX = W/2 - pbW/2, pbY = 440;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  rr(ctx, pbX, pbY, pbW, pbH, 3); ctx.fill();
  const progress = 1 - clamp(G.botBattingTimer / 5.0, 0, 1);
  const pbGrd = ctx.createLinearGradient(pbX, 0, pbX + pbW, 0);
  pbGrd.addColorStop(0, '#5c9ee0'); pbGrd.addColorStop(1, '#ffd166');
  ctx.fillStyle = pbGrd;
  rr(ctx, pbX, pbY, pbW * progress, pbH, 3); ctx.fill();

  centerText('Get ready for results...', 480, 14, 'rgba(255,209,102,0.8)');
}

/* ==================== CHAT / WIND EXTRAS ==================== */
const chatFeed = [];
function drawChatFeed(){
  if (chatFeed.length === 0) return;
  ctx.save();
  ctx.font = '700 13px system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i=0;i<chatFeed.length;i++){
    const c = chatFeed[i];
    const alpha = clamp(c.life / 1.0, 0, 1);
    ctx.globalAlpha = alpha * 0.9;
    const tw = ctx.measureText(c.text).width;
    rr(ctx, 18, 90 + i*30, tw + 22, 24, 8);
    ctx.fillStyle = 'rgba(12,16,28,0.7)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(c.text, 30, 102 + i*30);
  }
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}
function drawChatPanel(){
  // minimal emoji bar shown while spectating
  ctx.save();
  ctx.globalAlpha = 0.9;
  const emojis = ['👍','😂','🔥','😮','❤️'];
  const bw = 46, gap = 10;
  const total = emojis.length*bw + (emojis.length-1)*gap;
  let sx = W/2 - total/2;
  for (let i=0;i<emojis.length;i++){
    rr(ctx, sx, H - 100, bw, bw, 10);
    ctx.fillStyle = 'rgba(20,25,40,0.75)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = '900 22px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(emojis[i], sx + bw/2, H - 100 + bw/2);
    sx += bw + gap;
  }
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}
function drawWind(){
  const t = performance.now()/1000;
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  for (let i=0;i<7;i++){
    const y = HORIZON + 30 + i*42;
    const off = (t*70 + i*180) % 260;
    const x = ((i*263 + off) % (W+300)) - 150;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x+90, y);
    ctx.stroke();
  }
  ctx.restore();
}

/* ==================== MAIN RENDER ==================== */
function draw(){
  ctx.clearRect(0,0,W,H);
  if (G.phase === 'splash'){ drawSplash(); return; }
  if (G.phase === 'login'){ drawLoginScreen(); return; }
  if (G.phase === 'register'){ drawRegisterScreen(); return; }
  if (G.phase === 'guest'){ drawGuestScreen(); return; }
  if (G.phase === 'leaderboard'){ drawLeaderboard(); return; }
  if (G.phase === 'profileView'){ drawProfileView(); return; }
  if (G.phase === 'market'){ drawMarket(); return; }
  ctx.save();
  if (shake > 0.002){ const m = shake * shake * 9; ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m); }
  if (G.phase === 'waitingOpp'){
    drawWaitingOpp();
  } else {
    drawSky();
    if (G.players.length > 0){ drawStadium(); }
    else { ctx.fillStyle = '#2a3142'; ctx.fillRect(0, STADIUM_TOP, W, STADIUM_BOTTOM - STADIUM_TOP); }
    drawField();
    if (G.phase === 'menu' || G.phase === 'levelSelect' || G.phase === 'playerSelect'){
      if (G.phase === 'menu') drawMenuScreen();
      else if (G.phase === 'levelSelect') drawLevelSelect();
      else drawPlayerSelect();
    }
    else if (G.phase === 'searching'){ drawSearching(); }
    else if (G.phase === 'toss'){ drawToss(); }
    else if (G.phase === 'tossResult'){ drawTossResult(); }
    else if (G.phase === 'botBatting'){ drawBotBattingOverlay(); }
    else if (G.phase === 'nameEntry'){ if (fielders.length === 0) buildFielders(); for (const f of fielders) drawFielder(f); drawPlayer(); drawNameEntry(); }
    else if (G.phase === 'turnIntro'){ drawDistanceMarkers(); for (const f of fielders) drawFielder(f); drawPlayer(); drawEffects(); drawTurnIntro(); }
    else if (G.phase === 'turnEnd'){ drawDistanceMarkers(); for (const f of fielders) drawFielder(f); drawPlayer(); drawEffects(); drawTurnEnd(); }
    else if (G.phase === 'gameOver' || G.phase === 'onlineResults'){
      drawDistanceMarkers(); for (const f of fielders) drawFielder(f); drawPlayer(); drawEffects(); drawGameOver();
    }
    else {
      drawDistanceMarkers();
      if (G.phase==='fielding'||G.phase==='throw'||G.phase==='result') drawDandaOnGround();
      drawZone();
      for (const f of fielders) drawFielder(f);
      drawGulli(); drawPlayer(); drawEffects(); drawWind();
      drawPowerMeter(); drawShotSelector(false); drawCurrentPlayerBadge(); drawOverlays();
    }
  }
  ctx.restore();
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*1.0);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.32)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);
  drawChatFeed();
  drawJoinPopup();
}

/* ==================== HUD ==================== */
const uiScore = document.getElementById('uiScore');
const uiBest = document.getElementById('uiBest');
const uiOuts = document.getElementById('uiOuts');
const uiTurn = document.getElementById('uiTurn');
const uiCoins = document.getElementById('uiCoins');
const uiLives = document.getElementById('uiLives');
function updateHUD(){
  const hud = document.getElementById('hud');
  if (G.phase === 'menu' || G.phase === 'levelSelect' || G.phase === 'playerSelect'
      || G.phase === 'nameEntry' || G.phase === 'splash' || G.phase === 'login'
      || G.phase === 'register' || G.phase === 'guest' || G.phase === 'searching'
      || G.phase === 'toss' || G.phase === 'tossResult' || G.phase === 'leaderboard'
      || G.phase === 'profileView' || G.phase === 'market' || G.phase === 'botBatting'
      || G.phase === 'waitingOpp'){
    hud.style.display = 'none'; return;
  }
  hud.style.display = 'flex';
  uiScore.textContent = G.score;
  uiBest.textContent = G.best;
  uiOuts.textContent = G.outs + '/1';
  uiTurn.textContent = (G.currentPlayer + 1) + '/' + (G.players.length || 1);
  if (uiCoins) uiCoins.textContent = ACCOUNT.coins;
  if (uiLives) uiLives.textContent = ACCOUNT.lives;
}

/* ==================== LOOP ==================== */
let last = performance.now();
function loop(now){
  let dt = (now-last)/1000;
  last = now;
  if (dt>0.05) dt=0.05;
  frameDt = dt;
  update(dt); draw(); updateHUD();
  requestAnimationFrame(loop);
}

/* ==================== INIT ==================== */
function initFirebase(){
  // Offline-first stub — all persistence is local.
  loadLeaderboard();
}

resetGulli();
rebuildMenuButtons();
initFirebase();
setTimeout(()=>{ try{ playSplashChime(); } catch(e){} }, 120);
requestAnimationFrame(loop);

})();
</script>
